     exactly (the date only claims as much width as it needs). */
  ctx.font = ptToPx(HEADER_FONT_PT, dpi) + "px " + FONT_FAMILY;
  var dateW = ctx.measureText(new Date().toISOString().slice(0,10)).width + mmToPx(CELL_PADDING_MM, dpi)*2;
  regions.push({ contactIndex:-1, field:"headerLegend", x:dateW, y:0, w:wPx-dateW, h:headerH, pt:HEADER_FONT_PT });
  if(layout.doubleRow){
    var subRowH = bodyH / (capacity*2);
    var colSet = layoutDoubleRowColumns(ctx, wPx, dpi, showNumbers);
    for(var i=0;i<capacity;i++){
      var top1 = bodyY + subRowH*2*i, top2 = top1 + subRowH;
      var contact = contacts && contacts[i];
      /* must match drawCard's own per-row Normal/Wide choice exactly, so
         a click always edits whichever field is actually on screen */
      var hasLabel1 = contact && formatLabelForRow(contact.label1);
      var cols1 = hasLabel1 ? colSet.line1Normal : colSet.line1Wide;
      var fields1 = hasLabel1 ? ["name","label1","phone"] : ["name","phone"];
      cols1.forEach(function(col, ci){ regions.push({ contactIndex:i, field:fields1[ci], x:col.x, y:top1, w:col.w, h:subRowH, pt:col.pt }); });

      /* 2a's field depends on the page's line2Mode (see pickLine2Field) --
         "empty" mode has no field backing it, so that column isn't
         clickable at all (nothing to edit into). */
      var hasLabel2 = contact && formatLabelForRow(contact.phone2Label);
      var cols2 = hasLabel2 ? colSet.line2Normal : colSet.line2Wide;
      var wideKey = contact ? pickLine2Field(contact, line2Mode).key : "email";
      var fields2 = hasLabel2 ? [wideKey, "phone2Label", "phone2"] : [wideKey, "phone2"];
      cols2.forEach(function(col, ci){
        if(fields2[ci] == null) return;
        regions.push({ contactIndex:i, field:fields2[ci], x:col.x, y:top2, w:col.w, h:subRowH, pt:col.pt });
      });
    }
  } else {
    var rowH = bodyH / capacity;
    var cols2 = layoutRowColumns(ctx, wPx, dpi, layout);
    for(var j=0;j<capacity;j++){
      var top = bodyY + rowH*j;
      cols2.forEach(function(col){ regions.push({ contactIndex:j, field:col.key, x:col.x, y:top, w:col.w, h:rowH, pt:col.pt }); });
    }
  }
  return regions;
}

function openEditOverlay(pageEl, target, field, left, top, width, height, initialValue, fontPx){
  var existing = pageEl.querySelector(".editOverlayInput");
  if(existing) existing.remove();
  var input = document.createElement("input");
  input.className = "editOverlayInput";
  input.type = "text";
  input.value = initialValue != null ? initialValue : (target[field] || "");
  input.style.position = "absolute";
  input.style.left = left + "px";
  input.style.top = top + "px";
  input.style.width = Math.max(width, 50) + "px";
  input.style.height = Math.max(height, 16) + "px";
  input.style.fontFamily = FONT_FAMILY;
  input.style.fontSize = (fontPx || 12) + "px";
  input.style.zIndex = "10";
  input.style.border = "2px solid #0080ff";
  input.style.padding = "0 2px";
  input.style.boxSizing = "border-box";
  var committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    target[field] = input.value.trim();
    input.remove();
    renderViewer();
  }
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
    else if(e.key === "Escape"){ e.preventDefault(); committed = true; input.remove(); }
  });
  pageEl.appendChild(input);
  input.focus();
  input.select();
}

/* the viewer canvas always shows exactly one card now (see
   renderCardsOntoCanvas's preview mode), so a click maps straight into
   card-relative coordinates -- no grid/block math needed to figure out
   which of several tiled copies was clicked. */
function onCanvasClick(e, canvas, pageIndex){
  var pageState = state.pages[pageIndex];
  if(!pageState || pageState.layout === "empty") return;
  var geo = pageGeometryForIndex(pageIndex);

  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  var xInCard = (e.clientX - rect.left) * scaleX, yInCard = (e.clientY - rect.top) * scaleY;
  var cardWpx = canvas.width, cardHpx = canvas.height;

  var ctx = canvas.getContext("2d");
  var cardContacts = contactsForPage(pageState);
  var regions = getEditableRegions(ctx, cardWpx, cardHpx, RENDER_DPI, geo.layout, cardContacts, pageState.line2Mode, pageState.showNumbers);
  var hit = regions.find(function(r){ return xInCard>=r.x && xInCard<r.x+r.w && yInCard>=r.y && yInCard<r.y+r.h; });
  if(!hit) return;

  var target, initialValue;
  if(hit.contactIndex === -1){
    /* page-level field (the header legend), not tied to a contact -- an
       empty/never-set override means "no custom text yet", so editing
       starts from whatever's actually showing (the auto dept summary, or
       the layout's default legend) instead of a blank box */
    target = pageState;
    initialValue = pageState.headerLegend
      ? pageState.headerLegend
      : (geo.layout.showDept ? collectDeptNames(cardContacts).join(" ") : (geo.layout.phoneRowLegend || ""));
  } else {
    target = cardContacts[hit.contactIndex];
    if(!target) return;
    initialValue = null;
  }

  var cssScale = rect.width / canvas.width;
  /* the input's font must match the exact size the field is drawn at on
     the card -- ptToPx converts the field's own point size to canvas-
     internal pixels at RENDER_DPI, then cssScale shrinks that down the
     same way the canvas itself is displayed smaller than its internal
     resolution. Editing then looks like typing directly into the card,
     not a differently-sized text box floating over it. */
  var fontPx = ptToPx(hit.pt, RENDER_DPI) * cssScale;
  openEditOverlay(canvas.parentElement, target, hit.field,
    hit.x*cssScale, hit.y*cssScale, hit.w*cssScale, hit.h*cssScale, initialValue, fontPx);
}

/* ---------------- print ---------------- */
/* CSS @page can only declare one physical size for the whole print job,
   so mixed page orientations/sizes across pages print using the first
   page's size -- a real limitation of print CSS, not something this app
   can route around. Each canvas still gets its own correct mm CSS size. */
/* prefer a named CSS paper size ("A4", "A4 landscape") over raw mm
   dimensions when they match one of PAPER_SIZES -- many printer drivers
   only reliably recognize the standard keyword form for @page size and
   may silently reject or mis-handle an arbitrary custom mm size, even
   when the numbers are numerically identical to a standard sheet. Falls
   back to literal mm only for a genuinely custom card/paper size. */
function pageSizeCssValue(dims){
  var key = Object.keys(PAPER_SIZES).find(function(k){
    var p = PAPER_SIZES[k];
    return (p.wMM === dims.w && p.hMM === dims.h) || (p.wMM === dims.h && p.hMM === dims.w);
  });
  if(!key) return dims.w + "mm " + dims.h + "mm";
  var p = PAPER_SIZES[key];
  return dims.w === p.wMM && dims.h === p.hMM ? key : key + " landscape";
}

/* every canvas is rendered inside its own try/catch: without this, one
   page hitting an unexpected error (e.g. from an edited/dragged-into state
   the renderer doesn't expect) would throw partway through the loop below
   and abort the whole function -- window.print() would never run, and
   nothing visible would happen at all. A page that fails to render still
   gets a blank placeholder instead of vanishing outright, and print goes
   ahead with whatever did render rather than not happening at all. */
function doPrint(){
  var total = totalPagesCount();
  var area = $("#printArea");
  area.innerHTML = "";
  var failures = 0;
  try {
    var firstDims = currentPageDims(0);
    $("#pageSizeStyle").textContent = "@page { size: " + pageSizeCssValue(firstDims) + "; margin: 0; }";
  } catch(e){
    console.error("Print: failed to compute page size", e);
  }
  for(var i=0;i<total;i++){
    var canvas = document.createElement("canvas");
    try {
      var dims = currentPageDims(i);
      canvas.style.width = dims.w + "mm";
      canvas.style.height = dims.h + "mm";
      renderCardsOntoCanvas(canvas, i);
    } catch(e){
      failures++;
      console.error("Print: page " + (i+1) + " failed to render", e);
    }
    area.appendChild(canvas);
  }
  if(failures > 0){
    setStatus("Utskrift: " + failures + " av " + total + " sida/sidor kunde inte renderas (se konsolen) -- skriver ut resten.");
  }
  /* window.print() snapshots whatever the browser has actually laid out
     and painted so far -- calling it in the very same tick these canvases
     were created and appended risks racing that paint (seen as a print
     job the dialog accepts but that comes out blank, or never actually
     reaches the printer). The first requestAnimationFrame callback still
     runs BEFORE the next paint, so it's the second one that's guaranteed
     to run after the canvases just appended have actually been painted. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      window.print();
    });
  });
}


/* ============================================================
   MENU / VIEWER UI
   Toolbar, per-page controls, the page viewer/scroller, and the
   department-grouping sidebar. Everything in this section builds
   DOM and wires up events; the actual card drawing is delegated
   to the render engine above (renderCardsOntoCanvas, onCanvasClick).
   Edit here for anything about how controls look or are laid out
   -- it doesn't touch card layout/drawing logic.
   ============================================================ */

/* builds a <select> from an array of [value,text] option pairs -- every
   dropdown in the page/group controls otherwise repeats the same create/
   populate/set-value/wire-change skeleton with only the options differing */
function buildSelect(options, value, onChange, title){
  var sel = document.createElement("select");
  if(title) sel.title = title;
  options.forEach(function(o){ sel.appendChild(el("option", { value:o[0], text:o[1] })); });
  sel.value = value;
  sel.addEventListener("change", function(){ onChange(sel.value); });
  return sel;
}

/* like buildSelect, but for [hexColor,text] pairs where the value itself
   IS the color to preview -- a plain <option> can't carry a color swatch
   next to its label (no nested markup inside option text, and per-option
   background styling isn't reliably honored across browsers), so this
   builds the popup out of real DOM rows instead: a button showing the
   current swatch+name, and a list of the same shown/hidden on click.
   Closing on an outside click is handled by ONE listener registered once
   in initEvents (see closeOpenSwatchLists) rather than one per instance
   here, since this can be rebuilt many times across re-renders and a
   per-instance document listener would leak. */
function buildSwatchSelect(options, value, onChange, title){
  var wrap = el("div", { class:"swatchSelect" });
  var current = options.find(function(o){ return o[0].toLowerCase() === (value||"").toLowerCase(); }) || options[0];

  var btn = el("button", { type:"button", class:"swatchBtn" });
  if(title) btn.title = title;
  var btnSwatch = el("span", { class:"swatchBox" });
  btnSwatch.style.background = current ? current[0] : "#000";
  btn.appendChild(btnSwatch);
  btn.appendChild(el("span", { text: current ? current[1] : "" }));
  wrap.appendChild(btn);

  /* a 4-column grid of plain swatch squares, not a list of labeled rows
     -- each cell IS the color (title carries the name on hover) so the
     picker reads as a compact color grid, matching how OS/app color
     pickers usually look, rather than a dropdown menu of text options */
  var list = el("div", { class:"swatchList" });
  list.hidden = true;
  options.forEach(function(o){
    var item = el("div", { class:"swatchItem" + (current && o[0] === current[0] ? " active" : ""), title:o[1] });
    item.style.background = o[0];
    item.addEventListener("click", function(){
      list.hidden = true;
      onChange(o[0]);
    });
    list.appendChild(item);
  });

  /* an arbitrary custom color, as three R/G/B number fields plus an apply
     button -- its own row (.swatchRgbRow spans every grid column) so it
     always starts a fresh row regardless of how many swatches came before
     it, rather than sharing the grid's own column tracks and landing
     wherever the swatch count happens to leave off. */
  var rgbRow = el("div", { class:"swatchRgbRow" });
  var startColor = hexToRgb(current ? current[0] : value);
  var rgbInputs = ["R","G","B"].map(function(ch, idx){
    var input = document.createElement("input");
    input.type = "number"; input.min = "0"; input.max = "255";
    input.className = "swatchRgbInput";
    input.title = ch;
    input.value = [startColor.r, startColor.g, startColor.b][idx];
    input.addEventListener("click", function(e){ e.stopPropagation(); });
    rgbRow.appendChild(input);
    return input;
  });
  var rgbApplyBtn = el("button", { type:"button", class:"swatchRgbApply", text:"RGB", title:"Använd anpassad RGB-färg" });
  rgbApplyBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var vals = rgbInputs.map(function(inp){ return Math.max(0, Math.min(255, parseInt(inp.value,10)||0)); });
    var hex = "#" + vals.map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
    list.hidden = true;
    onChange(hex);
  });
  rgbRow.appendChild(rgbApplyBtn);
  list.appendChild(rgbRow);

  wrap.appendChild(list);

  btn.addEventListener("click", function(e){
    e.stopPropagation();
    closeOpenSwatchLists();
    list.hidden = !list.hidden;
    if(!list.hidden) positionSwatchList(list);
  });

  return wrap;
}
/* keeps the color-swatch popup fully on screen: it opens right/down by
   default (see the CSS), but a card's own swatch button can sit close
   enough to the viewer's edge that the popup's real size -- unknowable
   while it was still hidden -- would run past it, so this measures the
   now-visible popup and flips it to whichever side actually has room. */
function positionSwatchList(list){
  list.classList.remove("alignRight", "openUp");
  var rect = list.getBoundingClientRect();
  if(rect.right > window.innerWidth) list.classList.add("alignRight");
  if(rect.bottom > window.innerHeight) list.classList.add("openUp");
}
function closeOpenSwatchLists(){
  document.querySelectorAll(".pageInfoBar .swatchList").forEach(function(l){ l.hidden = true; l.classList.remove("alignRight", "openUp"); });
}

function pageLayoutOptionsSelect(currentKey, onChange){
  var options = ["v20","v10","empty"].map(function(key){ return [key, LAYOUTS[key].shortLabel]; });
  return buildSelect(options, currentKey, onChange, "Layout");
}

function hexToRgb(hex){
  hex = (hex||"#000000").replace("#","");
  return { r:parseInt(hex.slice(0,2),16)||0, g:parseInt(hex.slice(2,4),16)||0, b:parseInt(hex.slice(4,6),16)||0 };
}

/* per-page header color: 7 preset swatches (all pre-verified for good
   contrast with white text) plus a custom R/G/B row inside the same
   dropdown (see buildSwatchSelect) for an arbitrary color -- contrast
   with white is the picker's own responsibility there, unlike the
   vetted presets */
function buildHeaderColorControls(pageState){
  var options = COLOR_PRESETS.map(function(c){ return [c.hex, c.name]; });
  var isPreset = COLOR_PRESETS.some(function(c){ return c.hex.toLowerCase() === (pageState.headerColor||"").toLowerCase(); });
  if(!isPreset) options.push([pageState.headerColor, "Anpassad"]);
  return buildSwatchSelect(options, pageState.headerColor, function(v){ pageState.headerColor = v; renderViewer(); }, "Rubrikfärg");
}

function buildPageControls(index){
  var box = el("div", { class:"pageControls" });
  var pageState = state.pages[index];
  if(!pageState) return box; /* no data yet -- nothing to configure */

  box.appendChild(pageLayoutOptionsSelect(pageState.layout, function(newKey){
    var oldLayout = pageState.layout;
    /* "empty" just hides this page's contacts rather than cascading them
       away like a real capacity shrink would -- they're remembered on the
       page itself (savedContacts) and restored if you switch back to a
       content layout, until a fresh import replaces state.pages outright */
    if(newKey === "empty" && oldLayout !== "empty"){
      pageState.savedContacts = pageState.contacts;
      pageState.contacts = [];
    } else if(newKey !== "empty" && oldLayout === "empty"){
      pageState.contacts = pageState.savedContacts || [];
      pageState.savedContacts = null;
    }
    pageState.layout = newKey;
    if(newKey === "empty" && !pageState.emptyMode) pageState.emptyMode = "blank";
    reflowFromPage(index);
    renderViewer();
  }));

  if(pageState.layout !== "empty"){
    box.appendChild(buildHeaderColorControls(pageState));
  }

  if(pageState.layout === "v10"){
    /* line 2's wide field (name row's second line) -- a per-page choice
       instead of auto-detected, see pickLine2Field(). Options show just
       the mode name (no "Rad 2:" prefix); the select's title carries
       that context on hover instead. */
    var line2Options = Object.keys(LINE2_MODES).map(function(key){ return [key, LINE2_MODES[key]]; });
    box.appendChild(buildSelect(line2Options, pageState.line2Mode || "email", function(v){ pageState.line2Mode = v; renderViewer(); }, "Rad 2"));

    /* optional running number to the left of each contact, centered
       across its two lines (see drawCard/layoutDoubleRowColumns) -- off
       by default, a per-page toggle since not everyone wants it */
    var numLabel = el("label", { class:"tool", title:"Visa löpnummer till vänster om varje kontakt" });
    var numCheckbox = document.createElement("input");
    numCheckbox.type = "checkbox";
    numCheckbox.checked = !!pageState.showNumbers;
    numCheckbox.addEventListener("change", function(){ pageState.showNumbers = numCheckbox.checked; renderViewer(); });
    numLabel.appendChild(numCheckbox);
    numLabel.appendChild(document.createTextNode("Nr"));
    box.appendChild(numLabel);
  }

  if(pageState.layout === "empty"){
    var modeOptions = [["blank","Tom"],["rows","Tomt rutnät"],["image","Anpassad bild"]];
    box.appendChild(buildSelect(modeOptions, pageState.emptyMode, function(v){ pageState.emptyMode = v; renderViewer(); }));

    if(pageState.emptyMode === "image"){
      var fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.addEventListener("change", function(){
        var f = fileInput.files[0];
        if(!f) return;
        var reader = new FileReader();
        reader.onload = function(){
          var img = new Image();
          img.onload = function(){ pageState.image = img; renderViewer(); };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      });
      box.appendChild(fileInput);

      if(pageState.image){
        var fitOptions = [["contain","Behåll proportioner"],["stretch","Sträck ut"]];
        box.appendChild(buildSelect(fitOptions, pageState.imageFit || "contain", function(v){ pageState.imageFit = v; renderViewer(); }, "Bildanpassning"));

        var rotateBtn = el("button", { type:"button", text:"↻ Rotera", title:"Rotera bilden 90°" });
        rotateBtn.addEventListener("click", function(){
          pageState.imageRotation = ((pageState.imageRotation || 0) + 90) % 360;
          renderViewer();
        });
        box.appendChild(rotateBtn);
      }
    }
  }
  return box;
}

/* the thin control strip floating directly above a card in the viewer --
   what used to be a "Sidor" list entry's own header (used/free count,
   A-Ö/Ta bort) and selectors (layout, header color, line 2/numbers,
   empty-page mode -- see buildPageControls, reused unchanged), now living
   right next to the card it actually describes instead of a separate
   scrolling list. The label always names both "Kort N" (the sheet) and
   "Sida M" (front/back within it) -- unambiguous whether one side or
   several pairs are showing at once (see sidesPerView). */
function buildPageInfoBar(index){
  var bar = el("div", { class:"pageInfoBar" });
  var pageState = state.pages[index];
  if(!pageState) return bar; /* no data yet -- nothing to show/control */

  var sidaNum = index % 2 === 0 ? 1 : 2;
  var cap = layoutRows(pageState.layout), used = contactsForPage(pageState).length, free = Math.max(0, cap-used);
  var headerText = "Kort " + (Math.floor(index/2)+1) + " Sida " + sidaNum
    + (pageState.layout === "empty" ? ": tom" : ": " + used + "/" + cap + " använda, " + free + " lediga");
  var headerRow = el("div", { class:"pageInfoHeader" });
  headerRow.appendChild(el("span", { class: free === 0 && pageState.layout !== "empty" ? "full" : "", text:headerText, title:headerText }));
  /* sorts this page's own contacts alphabetically by name, in place --
     the page is already the one on screen (its info bar sits right on
     it), so there's no separate "jump to this card" button to make room
     for anymore. */
  var sortBtn = el("button", { type:"button", text:"A-Ö", title:"Sortera namnen på det här kortet alfabetiskt" });
  sortBtn.addEventListener("click", function(){
    pageState.contacts.sort(function(a, b){ return (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"}); });
    renderViewer();
  });
  headerRow.appendChild(sortBtn);
  var removeBtn = el("button", { type:"button", class:"removeBtn", text:"Ta bort", title:"Gör den här sidan tom" });
  removeBtn.addEventListener("click", function(){ removePage(index); });
  headerRow.appendChild(removeBtn);
  bar.appendChild(headerRow);

  bar.appendChild(buildPageControls(index));
  return bar;
}

/* one card's worth of preview -- the on-screen unit shown regardless of
   how many are on screen at once (see sidesPerView). Pages are printed in
   front/back pairs (see partnerPageIndex): "Sida" is 1 (front, even
   index) or 2 (back, odd index) within its sheet. */
function buildPageEl(index){
  var page = el("div", { class:"page", "data-index":String(index) });
  page.appendChild(buildPageInfoBar(index));
  var canvas = document.createElement("canvas");
  canvas.addEventListener("click", function(e){ onCanvasClick(e, canvas, index); });
  canvas.draggable = true;
  wireCardRowDrag(canvas, index);
  page.appendChild(canvas);
  renderCardsOntoCanvas(canvas, index, true);

  /* the rows a drag is currently over would occupy, highlighted -- see
     wireCardDropTarget/applyDragHighlights. A plain DOM overlay rather
     than redrawing the canvas: much simpler, and it's purely visual
     (never part of what actually gets printed). Every page gets one so
     a cascade reaching this page (even when it's not the one under the
     cursor) has somewhere to show it. */
  page.appendChild(el("div", { class:"cardRowHighlightLayer" }));
  wireCardDropTarget(canvas, index);

  return page;
}

/* one printed sheet's worth of preview: front + back side by side, since
   that's the actual physical unit -- pages are always printed in pairs
   (see partnerPageIndex). frontIndex is always even. Every card gets its
   own strip immediately to its own left, front and back alike (see
   .cardEdgeHandles), instead of the old outer/inner split -- so this is
   just the same two steps repeated once per card. */
function buildPagePairEl(frontIndex){
  var backIndex = partnerPageIndex(frontIndex);
  var pair = el("div", { class:"pagePair", "data-index":String(frontIndex) });
  [frontIndex, backIndex].forEach(function(idx){
    pair.appendChild(buildCardEdgeHandles(idx));
    pair.appendChild(buildPageEl(idx));
  });
  return pair;
}
/* the narrowest tier (sidesPerView===1) shows only one physical side, not
   its printed partner -- same wrapper/edge-handle strip as a full pair,
   just missing the second .page, so buildPageEl/fitVisibleCards still
   work on it unchanged. */
function buildLonePageEl(index){
  var pair = el("div", { class:"pagePair", "data-index":String(index) });
  pair.appendChild(buildCardEdgeHandles(index));
  pair.appendChild(buildPageEl(index));
  return pair;
}

/* which row (0-indexed, capacity-based -- one v10 contact block counts as
   a single row even though it's two printed lines) a client Y coordinate
   falls on for a given canvas -- shared by the dragover highlight and the
   drop handler so they always agree on the same row. Returns null for a
   page with nothing to drop onto (no data yet, or "empty" layout).
   belowMidpoint says whether the point falls in the row's bottom half
   (used to decide insertAfter for a reorder landing on an occupied row). */
/* built on rowFractionsForLayout's own fraction math (below) rather than
   recomputing headerH/rowH in pixels itself -- computeHeaderH is a pure
   ratio of hPx, so the fractions it derives at an arbitrary unit apply
   just as well against the real clientY/rect.height fraction here. */
function cardRowGeometry(canvas, index, clientY){
  var pageState = state.pages[index];
  if(!pageState || pageState.layout === "empty") return null;
  var layout = pageGeometryForIndex(index).layout;
  var geo = rowFractionsForLayout(layout);
  if(geo.capacity <= 0) return null;
  var rect = canvas.getBoundingClientRect();
  if(rect.height <= 0) return null;
  var yFrac = (clientY - rect.top) / rect.height;
  var idx = Math.max(0, Math.min(geo.capacity - 1, Math.floor((yFrac - geo.headerFrac) / geo.rowFrac)));
  var rowTopFrac = geo.headerFrac + idx*geo.rowFrac;
  var belowMidpoint = (yFrac - rowTopFrac) > geo.rowFrac/2;
  /* the one canonical "insert before this row" index -- idx itself
     (top half) or idx+1 (bottom half). Everything that needs to agree on
     where a drop lands -- the highlight preview and the actual
     cross-page/new-placement drop -- uses this same value instead of
     each re-deriving its own boundary from idx/belowMidpoint, which is
     what let the old preview and the real drop fall out of sync. */
  return { idx: idx, topFrac: rowTopFrac, hFrac: geo.rowFrac, belowMidpoint: belowMidpoint, insertRow: idx + (belowMidpoint ? 1 : 0) };
}

/* same header/row-height math as cardRowGeometry and getEditableRegions,
   expressed as plain fractions (0..1) of the card's own height,
   independent of any actual pixel size -- shared by cardRowGeometry
   above and buildCardEdgeHandles' own strip positioning. */
function rowFractionsForLayout(layout){
  var capacity = layoutRows(layout.key);
  if(capacity <= 0) return { headerFrac:0, rowFrac:0, capacity:0 };
  var hUnit = 1000; /* computeHeaderH is a pure ratio of hPx, so any unit works */
  var headerH = computeHeaderH(hUnit, layout);
  return { headerFrac: headerH/hUnit, rowFrac: (hUnit-headerH)/hUnit/capacity, capacity: capacity };
}

/* one contiguous run of same-department rows within a page's own contact
   order -- e.g. if Sales sits at rows 3-5 with IT at rows 0-2 and 6-8,
   this returns three segments (IT, Sales, IT again), not two -- the
   repeat is exactly the thing the segment capsules (see
   buildCardEdgeHandles) are meant to make visible via a shared color. */
function contiguousDeptSegments(contacts){
  var segments = [];
  contacts.forEach(function(c, i){
    var key = deptGroupKey(c.department);
    var last = segments[segments.length-1];
    if(last && last.key === key) last.length++;
    else segments.push({ key:key, label:deptDisplayLabel(c.department), startIdx:i, length:1 });
  });
  return segments;
}

/* moves one contact already on this page to sit right where a drag
   landed -- reuses reorderWithinPage (the same function the v10 sidebar
   list already reorders with), just computing its target/insertAfter
   from a card row instead of a list row. targetContact is null when the
   drop landed past the last real contact (an empty trailing row), which
   reorderWithinPage has no target for -- treated as "move to the end". */
function reorderContactOnCard(pageIndex, contactId, targetContact, insertAfter){
  if(targetContact){ reorderWithinPage(pageIndex, contactId, targetContact.id, insertAfter); return; }
  var contacts = contactsForPage(state.pages[pageIndex] || {});
  var last = contacts[contacts.length-1];
  if(!last || last.id === contactId) return;
  reorderWithinPage(pageIndex, contactId, last.id, true);
}

/* same idea as reorderContactOnCard, but for a whole segment (a
   contiguous block, see contiguousDeptSegments) dragged by its capsule
   handle -- there's no existing shared helper for this (reorderWithinPage
   only ever moves one contact), so this is its own splice-out/splice-in.
   Segments are only ever dragged within their own page (see
   wireCardDropTarget), so pageIndex always matches where startIdx/length
   were computed from. */
function reorderSegmentOnCard(pageIndex, startIdx, length, targetContact, insertAfter){
  var pageState = state.pages[pageIndex];
  if(!pageState) return;
  var contacts = pageState.contacts;
  if(startIdx < 0 || startIdx+length > contacts.length) return;
  var block = contacts.slice(startIdx, startIdx+length);
  if(targetContact && block.some(function(c){ return c.id === targetContact.id; })) return; /* dropped on itself */
  var rest = contacts.slice(0, startIdx).concat(contacts.slice(startIdx+length));
  var insertAt;
  if(!targetContact){
    insertAt = rest.length;
  } else {
    var targetIdx = rest.findIndex(function(c){ return c.id === targetContact.id; });
    if(targetIdx === -1) return;
    insertAt = insertAfter ? targetIdx+1 : targetIdx;
  }
  pageState.contacts = rest.slice(0, insertAt).concat(block, rest.slice(insertAt));
  renderViewer();
}

/* unassigns a whole dragged segment (see reorderSegmentOnCard) from its
   page in one go -- dropped onto #cardRemoveZone. Contacts are never
   deleted, only unplaced, same as every other removal in this app. */
function removeSegmentFromPage(pageIndex, startIdx, length){
  var pageState = state.pages[pageIndex];
  if(!pageState) return;
  if(startIdx < 0 || startIdx+length > pageState.contacts.length) return;
  pageState.contacts = pageState.contacts.slice(0, startIdx).concat(pageState.contacts.slice(startIdx+length));
  renderViewer();
}

/* makes the card itself draggable, one row at a time -- press anywhere on
   a contact's row (not just a dedicated handle) and drag to move it,
   while a plain click still reaches onCanvasClick for inline editing:
   dragstart only fires once the browser sees real drag motion, and a
   click never fires after a drag starts, so the two never conflict.
   Produces the exact same {type:"contact", fromPage, contactId} payload
   the old per-row grip used, so wireCardDropTarget's drop handling needed
   no changes at all. */
function wireCardRowDrag(canvas, pageIndex){
  canvas.addEventListener("dragstart", function(e){
    var pageState = state.pages[pageIndex];
    if(!pageState || pageState.layout === "empty"){
      e.preventDefault(); return;
    }
    var geo = rowFractionsForLayout(pageGeometryForIndex(pageIndex).layout);
    var rect = canvas.getBoundingClientRect();
    var yFrac = rect.height > 0 ? (e.clientY - rect.top) / rect.height : -1;
    if(geo.capacity <= 0 || yFrac < geo.headerFrac){ e.preventDefault(); return; } /* header area: not a row */
    var idx = Math.min(geo.capacity - 1, Math.floor((yFrac - geo.headerFrac) / geo.rowFrac));
    var contact = contactsForPage(pageState)[idx];
    if(!contact){ e.preventDefault(); return; }
    var payload = { type:"contact", fromPage:pageIndex, contactId:contact.id };
    e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "move";
    activeDragPayload = payload;
    showRowDragGhost(e, contact.name);
  });
}
/* a small floating label instead of the browser's default drag image
   (a screenshot of the whole card, misleading when only one row is
   actually moving) -- reuses one hidden element across every drag rather
   than creating/discarding a node each time. */
var rowDragGhostEl = null;
function showRowDragGhost(e, text){
  if(!rowDragGhostEl){
    rowDragGhostEl = el("div", { id:"rowDragGhost" });
    document.body.appendChild(rowDragGhostEl);
  }
  rowDragGhostEl.textContent = text;
  e.dataTransfer.setDragImage(rowDragGhostEl, -12, 14);
}

/* same idea as showRowDragGhost, but for a dragged segment capsule: a
   horizontal pill in the segment's own color (the capsule itself is a
   vertical strip with sideways text -- not something you'd want to see
   dragging around) with the cursor pinned to its right edge, so the pill
   trails to the LEFT of the cursor -- matching where the tab itself
   always sits relative to its card now that every strip is on the left.
   Width is read back off the element itself after the text/color are
   set, so the pill always sizes to whatever's being dragged rather than
   a fixed box. */
var segmentDragGhostEl = null;
function showSegmentDragGhost(e, text, color){
  if(!segmentDragGhostEl){
    segmentDragGhostEl = el("div", { id:"segmentDragGhost" });
    document.body.appendChild(segmentDragGhostEl);
  }
  segmentDragGhostEl.textContent = text;
  segmentDragGhostEl.style.background = color;
  var rect = segmentDragGhostEl.getBoundingClientRect();
  e.dataTransfer.setDragImage(segmentDragGhostEl, rect.width, rect.height/2);
}

/* the actual contacts a drag payload represents, in the order they'll be
   inserted -- lets the dragover preview color each highlighted row by its
   own department instead of one flat color for the whole span (see
   simulateInsertHighlights/contiguousDeptRuns). A segment is already one
   contiguous same-department run (contiguousDeptSegments), so its own
   page's slice is enough; a group sweeps every matching contact
   regardless of page, the same set moveMatchingBetweenPagesAt will
   actually take. */
function resolveDraggedContacts(data){
  if(!data) return [];
  if(data.type === "segment"){
    var fromPageState = state.pages[data.fromPage];
    return fromPageState ? contactsForPage(fromPageState).slice(data.startIdx, data.startIdx + data.length) : [];
  }
  if(data.type === "group") return state.contacts.filter(function(c){ return c.sourceId === data.sourceId && deptGroupKey(c.department) === data.groupKey; });
  /* a multi-use source's contact/group, or the "Tom rad" spacer -- these
     are cloned fresh on drop (see instantiateTemplates) rather than moved
     out of the pool, so there's no existing contact object to look up;
     the payload already carries everything the preview needs. */
  if(data.type === "template") return data.templates || [];
  var contact = state.contacts.find(function(c){ return c.id === data.contactId; });
  return contact ? [contact] : [];
}

/* one contiguous run of same-department contacts, in relative order --
   like contiguousDeptSegments, but without a startIdx: the highlight
   preview only ever needs the runs within whatever window it's drawing
   (see applyDragHighlights), not their absolute position on a page. */
function contiguousDeptRuns(contacts){
  var runs = [];
  contacts.forEach(function(c){
    var key = deptGroupKey(c.department);
    var last = runs[runs.length-1];
    if(last && last.key === key) last.length++;
    else runs.push({ key:key, length:1 });
  });
  return runs;
}

/* reordering a contact/segment within its OWN page never cascades (the
   page's total count doesn't change), but the dragged block is already
   sitting somewhere else in that same array -- so a raw "insert before
   this index" position, measured against the array that still contains
   it, needs the same self-removal shift reorderWithinPage/
   reorderSegmentOnCard apply internally (removing the block first shifts
   everything after it back by its own length). Without this, the preview
   shows the move landing one row later than it actually will whenever the
   drop point sits right after the dragged block's own current position. */
function selfShiftInsertRow(srcStart, srcLen, rawInsertRow){
  if(rawInsertRow <= srcStart) return rawInsertRow;
  return Math.max(srcStart, rawInsertRow - srcLen);
}

/* dry-run of reflowFromPage's own cascade math, without mutating state:
   given `draggedContacts` landing at `atRow` on `pageIndex`, works out
   which existing rows shift onto which later pages, so a drag's dragover
   preview can highlight every affected card, not just the one under the
   cursor. Each highlight carries the actual contiguous department runs
   that will occupy it, so the color always matches what actually lands
   there -- the dragged contacts' own department for the primary landing
   spot, and whichever departments were already there for anything it
   pushes further down the cascade (which can easily be a mix, e.g.
   inserting 4 IT contacts might push 1 unrelated Support contact off the
   end onto the next page). Approximate for the rare case where the
   dragged group already sits partly on another v20 page -- takeMatching's
   own consolidation is more precise than a hover preview needs to be. */
function simulateInsertHighlights(pageIndex, atRow, draggedContacts){
  var highlights = [{ pageIndex:pageIndex, startRow:atRow, runs:contiguousDeptRuns(draggedContacts) }];
  var page = state.pages[pageIndex];
  if(!page) return highlights;
  var existing = contactsForPage(page);
  var cap = layoutRows(page.layout);
  var overflow = existing.slice(0, atRow).concat(draggedContacts, existing.slice(atRow)).slice(cap);
  var idx = pageIndex + 1;
  while(overflow.length){
    var next = state.pages[idx];
    if(!next || next.layout === "empty"){
      highlights.push({ pageIndex:idx, startRow:0, runs:contiguousDeptRuns(overflow) });
      break;
    }
    var nextCap = layoutRows(next.layout);
    /* only the incoming overflow itself is highlighted here (clamped to
       this page's own capacity) -- not the whole kept portion, which
       would also cover this page's own pre-existing rows that simply
       shifted down within their own page, nothing a drag preview needs
       to call out. */
    highlights.push({ pageIndex:idx, startRow:0, runs:contiguousDeptRuns(overflow.slice(0, nextCap)) });
    overflow = overflow.concat(contactsForPage(next)).slice(nextCap);
    idx++;
  }
  return highlights;
}

/* shows the highlight on every affected, CURRENTLY RENDERED card (a page
   reachable by the cascade but not in the DOM right now just has nowhere
   to show it, which is the best any preview can do) -- a page not in the
   list just has its layer emptied. Each highlight's `runs` becomes one
   colored block per contiguous department run, positioned back to back
   starting at startRow, so a span that mixes departments (cascade
   spillover) reads as distinct colored bands instead of one flat block. */
function applyDragHighlights(highlights){
  var byIndex = {};
  highlights.forEach(function(h){ byIndex[h.pageIndex] = h; });
  document.querySelectorAll(".page").forEach(function(pageEl){
    var idx = parseInt(pageEl.getAttribute("data-index"), 10);
    var layer = pageEl.querySelector(".cardRowHighlightLayer");
    var pageState = state.pages[idx];
    var h = byIndex[idx];
    if(!layer) return;
    layer.innerHTML = "";
    if(!h || !pageState) return;
    var geo = rowFractionsForLayout(pageGeometryForIndex(idx).layout);
    if(geo.capacity <= 0) return;
    var row = h.startRow;
    h.runs.forEach(function(run){
      var rowCount = Math.min(run.length, geo.capacity - row);
      if(rowCount > 0){
        var color = colorForDeptKey(run.key);
        var block = el("div", { class:"cardRowHighlight" });
        block.style.background = hexToRgba(color, 0.32);
        block.style.borderTop = "2px solid " + hexToRgba(color, 0.85);
        block.style.borderBottom = block.style.borderTop;
        block.style.top = ((geo.headerFrac + row*geo.rowFrac) * 100) + "%";
        block.style.height = (rowCount * geo.rowFrac * 100) + "%";
        layer.appendChild(block);
      }
      row += run.length;
    });
  });
}
function clearDragHighlights(){
  document.querySelectorAll(".cardRowHighlightLayer").forEach(function(l){ l.innerHTML = ""; });
}

/* lets a group/contact tile dragged from the sidebar's "Dra till kortet"
   pool be dropped directly onto a row of the card itself, landing
   exactly there via moveMatchingBetweenPagesAt instead of always
   appending. Also accepts a drag started on the card's own row
   (wireCardRowDrag) or its group capsule (buildCardEdgeHandles, single
   view only) -- same MIME, "contact"/"segment" payloads carrying
   fromPage -- and reorders in place instead, when the drag and drop are
   on the same page. Works in both view modes: "Alla" cards are smaller
   thumbnails, so landing on an exact row is less precise there, but
   moving a contact/department onto a different card is exactly as
   useful at that size. */
function wireCardDropTarget(canvas, index){
  canvas.addEventListener("dragover", function(e){
    if(e.dataTransfer.types.indexOf(PANEL_DRAG_MIME) === -1) return;
    var geom = cardRowGeometry(canvas, index, e.clientY);
    if(!geom) return;
    e.preventDefault();

    /* a same-page reorder never changes this page's own total count, so
       it never cascades; anything else (a different page, or straight
       from the pool) might, hence the dry-run. Both branches anchor on
       geom.insertRow -- the same value the drop handler below uses --
       so the preview always matches where the drop actually lands; the
       sameCard branch additionally corrects for the dragged block still
       sitting in the array insertRow indexes into (see
       selfShiftInsertRow's own doc comment for why that matters). */
    var contacts = resolveDraggedContacts(activeDragPayload);
    if(!contacts.length) return;
    var sameCard = activeDragPayload && activeDragPayload.fromPage === index &&
      (activeDragPayload.type === "segment" || activeDragPayload.type === "contact");
    if(sameCard){
      var srcStart = activeDragPayload.type === "segment" ? activeDragPayload.startIdx
        : contactsForPage(state.pages[index]).findIndex(function(c){ return c.id === activeDragPayload.contactId; });
      applyDragHighlights([{ pageIndex:index, startRow:selfShiftInsertRow(srcStart, contacts.length, geom.insertRow), runs:contiguousDeptRuns(contacts) }]);
    } else {
      applyDragHighlights(simulateInsertHighlights(index, geom.insertRow, contacts));
    }
  });
  canvas.addEventListener("dragleave", function(){ clearDragHighlights(); });
  canvas.addEventListener("drop", function(e){
    clearDragHighlights();
    var geom = cardRowGeometry(canvas, index, e.clientY);
    if(!geom) return;
    e.preventDefault();
    var raw = e.dataTransfer.getData(PANEL_DRAG_MIME);
    if(!raw) return;
    var data = JSON.parse(raw);
    var targetContact = contactsForPage(state.pages[index])[geom.idx] || null;

    if(data.type === "segment"){
      if(data.fromPage === index){
        reorderSegmentOnCard(index, data.startIdx, data.length, targetContact, geom.belowMidpoint);
        return;
      }
      /* cross-page: move this exact contiguous run (by id, not by
         department) to the target page -- matching by department alone
         would also sweep up a second, non-contiguous run of the same
         dept still left behind on the source page, if there is one. */
      var fromPageState = state.pages[data.fromPage];
      var segIds = fromPageState ? contactsForPage(fromPageState).slice(data.startIdx, data.startIdx + data.length).map(function(c){ return c.id; }) : [];
      if(!segIds.length) return;
      moveMatchingBetweenPagesAt(data.fromPage, index, idsMatcher(segIds), geom.insertRow);
      return;
    }
    if(data.type === "contact" && data.fromPage === index){
      reorderContactOnCard(index, data.contactId, targetContact, geom.belowMidpoint);
      return;
    }
    /* a genuinely new placement (from the pool, or a different page) --
       same as dropping onto this page's own card in the sidebar list:
       overflow cascades onto the next page (reflowFromPage, inside
       moveMatchingBetweenPagesAt), opening a new one at DEFAULT_LAYOUT
       ("v20") if it needs to, instead of being refused. */
    handlePanelDrop(data,
      function(fromPage, groupKey, sourceId){ moveMatchingBetweenPagesAt(fromPage, index, groupMatcher(sourceId, groupKey), geom.insertRow); },
      function(fromPage, contactId){ moveMatchingBetweenPagesAt(fromPage, index, contactMatcher(contactId), geom.insertRow); },
      function(templates){ addTemplatesAt(index, geom.insertRow, templates); });
  });
}

/* the colored capsule strip standing directly against the card: one per
   contiguous same-department run, drag to move that whole block (see
   contiguousDeptSegments/reorderSegmentOnCard). Per-contact dragging no
   longer needs a dedicated handle here -- the card itself is draggable
   row-by-row (see wireCardRowDrag) -- so this strip only ever holds group
   capsules now. Always sits on the card's own left, front and back
   alike -- there's no longer an outer/inner distinction to pick a side
   for. */
function buildCardEdgeHandles(pageIndex){
  var strip = el("div", { class:"cardEdgeHandles" });
  var pageState = state.pages[pageIndex];
  if(!pageState || pageState.layout === "empty") return strip;
  var layout = pageGeometryForIndex(pageIndex).layout;
  var geo = rowFractionsForLayout(layout);
  if(geo.capacity <= 0) return strip;
  var contacts = contactsForPage(pageState);

  contiguousDeptSegments(contacts).forEach(function(seg){
    var color = colorForDeptKey(seg.key);
    var capsule = el("div", { class:"segmentCapsule", draggable:"true", text:seg.label,
      title:seg.label + " -- dra för att flytta hela gruppen (inom sidan eller till en annan sida)" });
    capsule.style.background = color;
    capsule.style.top = ((geo.headerFrac + seg.startIdx*geo.rowFrac) * 100) + "%";
    capsule.style.height = ((seg.length*geo.rowFrac) * 100) + "%";
    capsule.addEventListener("dragstart", function(e){ showSegmentDragGhost(e, seg.label, color); });
    wireDragStart(capsule, { type:"segment", fromPage:pageIndex, startIdx:seg.startIdx, length:seg.length });
    strip.appendChild(capsule);
  });

  return strip;
}

/* a "remove from page" drop target right next to the cards, for a
   contact/segment dragged straight off a card's own edge handles.
   Top-right of the viewer, per request (see #newPageZone for its
   opposite-corner, opposite-action counterpart). Reuses wireDropTarget's
   own dragover/dragleave/drop wiring instead of repeating it. */
function wireCardRemoveZone(zone){
  wireDropTarget(zone, function(data){
    if(data.type === "segment"){ removeSegmentFromPage(data.fromPage, data.startIdx, data.length); return; }
    handlePanelDrop(data, removeGroupFromPage, removeContactFromPage);
  });
}


function currentPageDims(index){
  return pageGeometryForIndex(index).pageDims;
}

/* how many individual card SIDES (not pairs) show on screen at once,
   purely a function of the viewer's own width -- no separate view-mode
   toggle to keep in sync with it. Two full pairs (4 sides) on a large
   window, one pair (2 sides) on a medium one, and just one lone side on
   a narrow one: simple width tiers rather than anything more elaborate. */
var SIDES_LARGE_MIN_PX = 1200;
var SIDES_MEDIUM_MIN_PX = 640;
function sidesPerView(){
  var w = $("#viewerContent").clientWidth;
  if(w >= SIDES_LARGE_MIN_PX) return 4;
  if(w >= SIDES_MEDIUM_MIN_PX) return 2;
  return 1;
}

/* must match #viewerContent's own padding-top/padding-bottom in the CSS
   -- ch below reserves exactly that much real vertical space instead of
   a blanket percentage, so the fitted card(s) actually fill the space
   between them with no extra centering slack left over. Without that,
   flex centering only ever reallocates slack between top/bottom in
   proportion to the padding difference, which is too subtle to read as
   "the bottom has more room" -- reserving the exact space makes each
   padding value the real, visible gap. PAGE_INFO_BAR_CLEARANCE_PX only
   has to clear each card's own .pageInfoBar strip now -- the nav lives in
   the toolbar, not over the viewer, so it's no longer part of this budget. */
var PAGE_INFO_BAR_CLEARANCE_PX = 80;
var VIEWER_BOTTOM_MARGIN_PX = 32;
/* must match #viewerContent's own left/right padding in the CSS -- used
   below to size against the actual content box, not the padding along
   with it (that used to let a row size itself right out to the padded
   edge, or even wrap when it didn't actually need to -- see fitVisibleCards). */
var VIEWER_SIDE_PADDING_PX = 32;

/* sizes every currently-rendered .page to fit them all on screen at once,
   side by side, on whichever axis (combined width or height) is tighter
   -- every card shares one physical size (CARD_W_MM/CARD_H_MM are
   global), so a single scale computed from the total width covers all of
   them. Reads the fixed (non-card) width straight from the DOM instead of
   assuming it -- every edge-handles strip's actual rendered width, the
   12px gap between a pair's own front/back, and the 24px gap between
   separate pairs (both from the CSS) -- so it works the same whether
   renderViewer just built a lone side or several full pairs, and never
   under-counts the strips (which used to leave rows a bit too wide for
   their own budget, forcing an unwanted wrap into a second row that then
   overflowed the viewer's own height). */
function fitVisibleCards(){
  var wrap = $("#viewerContent");
  var pages = wrap.querySelectorAll(".page");
  var pairs = wrap.querySelectorAll(".pagePair");
  if(!pages.length) return;
  var dims = pageGeometryForIndex(state.currentPage).cardDims;
  var stripEl = wrap.querySelector(".cardEdgeHandles");
  var stripW = stripEl ? stripEl.getBoundingClientRect().width : 0;
  var stripCount = 0, pageGapCount = 0;
  pairs.forEach(function(pp){
    stripCount += pp.querySelectorAll(".cardEdgeHandles").length;
    pageGapCount += Math.max(0, pp.querySelectorAll(".page").length - 1);
  });
  var rowGaps = Math.max(0, pairs.length - 1) * 24;
  var fixedW = stripCount*stripW + pageGapCount*12 + rowGaps;
  var availW = wrap.clientWidth - VIEWER_SIDE_PADDING_PX*2;
  var cw = (availW - fixedW) / pages.length;
  var ch = wrap.clientHeight - PAGE_INFO_BAR_CLEARANCE_PX - VIEWER_BOTTOM_MARGIN_PX;
  var scale = Math.min(cw/dims.w, ch/dims.h);
  var w = dims.w*scale, h = dims.h*scale;
  pages.forEach(function(p){ p.style.width = w+"px"; p.style.height = h+"px"; });
}

/* however many card sides renderViewer actually put on screen last time
   -- lets updateIndicator report the right range (e.g. "Kort 1–2 / 3")
   without recomputing sidesPerView itself. */
var lastVisibleCount = 0;

function renderViewer(){
  var wrap = $("#viewerContent");
  wrap.innerHTML = "";

  /* nothing to show a card for yet -- one overlay message covering the
     whole viewer, instead of the same text repeated on an empty front
     and an empty back card */
  var overlay = $("#emptyViewerOverlay");
  if(!state.pages.length){
    overlay.textContent = state.contacts.length
      ? "Dra en avdelningsgrupp eller kontakt från panelen till vänster för att skapa en sida"
      : "Släpp en CSV- eller XLSX-fil för att börja";
    overlay.hidden = false;
    lastVisibleCount = 0;
    updateIndicator();
    renderGroupPanel();
    return;
  }
  overlay.hidden = true;

  var total = totalPagesCount();
  var spv = sidesPerView();

  if(spv === 1){
    if(state.currentPage > total-1) state.currentPage = total-1;
    if(state.currentPage < 0) state.currentPage = 0;
    wrap.appendChild(buildLonePageEl(state.currentPage));
    lastVisibleCount = 1;
  } else {
    /* currentPage always names the FRONT of the leading pair shown --
       pages are always printed in pairs (see partnerPageIndex), so a
       multi-side tier only ever shows/steps through whole pairs. */
    if(state.currentPage % 2 !== 0) state.currentPage -= 1;
    var pairsToShow = Math.min(spv/2, Math.ceil(total/2));
    var maxFront = Math.max(0, total - pairsToShow*2);
    if(state.currentPage > maxFront) state.currentPage = maxFront;
    if(state.currentPage < 0) state.currentPage = 0;
    var row = el("div", { class:"pagesRow" });
    for(var i=0;i<pairsToShow;i++){
      row.appendChild(buildPagePairEl(state.currentPage + i*2));
    }
    wrap.appendChild(row);
    lastVisibleCount = pairsToShow*2;
  }
  fitVisibleCards();
  updateIndicator();
  renderGroupPanel();
}

function updateIndicator(){
  var total = totalPagesCount();
  var totalPairs = Math.ceil(total/2);
  if(sidesPerView() === 1){
    var sida = state.currentPage%2===0 ? 1 : 2;
    $("#pageIndicator").textContent = "Kort " + (Math.floor(state.currentPage/2)+1) + " Sida " + sida + " / " + totalPairs;
    return;
  }
  var firstPair = state.currentPage/2+1;
  var lastPair = Math.min(totalPairs, firstPair + Math.max(0, lastVisibleCount/2) - 1);
  $("#pageIndicator").textContent = "Kort " + (firstPair===lastPair ? firstPair : firstPair+"–"+lastPair) + " / " + totalPairs;
}

/* idx names the page to jump to -- the front of its pair in a multi-side
   tier, or its own lone target in the single-side tier; renderViewer
   re-aligns/clamps it for whichever tier is actually current. */
function scrollToPage(idx){
  var total = totalPagesCount();
  state.currentPage = Math.max(0, Math.min(total-1, idx));
  renderViewer();
}
function goPrev(){ scrollToPage(state.currentPage - sidesPerView()); }
function goNext(){ scrollToPage(state.currentPage + sidesPerView()); }

var wheelCooldown = false;
function onWheel(e){
  e.preventDefault();
  if(wheelCooldown) return;
  if(e.deltaY > 15) { wheelCooldown = true; goNext(); }
  else if(e.deltaY < -15) { wheelCooldown = true; goPrev(); }
  else return;
  setTimeout(function(){ wheelCooldown = false; }, 350);
}

function populatePaperSizes(){
  var sel = $("#paperSize");
  sel.innerHTML = "";
  Object.keys(PAPER_SIZES).forEach(function(key){
    sel.appendChild(el("option", { value:key, text:PAPER_SIZES[key].label }));
  });
  sel.value = state.paperSize;
}

function initEvents(){
  $("#paperSize").addEventListener("change", function(){ state.paperSize = $("#paperSize").value; renderViewer(); });
  $("#prevBtn").addEventListener("click", goPrev);
  $("#nextBtn").addEventListener("click", goNext);
  $("#printBtn").addEventListener("click", doPrint);
  wireCardRemoveZone($("#cardRemoveZone"));
  wireDropTarget($("#newPageZone"), function(data){ handlePanelDrop(data, moveGroupToNewPage, moveContactToNewPage, addTemplatesToNewPage); });
  /* dropping a group/contact on the empty-viewer overlay (shown only when
     state.pages is empty) creates the first page, same as "+ Ny sida" --
     otherwise there's nowhere on screen yet to drop onto. */
  wireDropTarget($("#emptyViewerOverlay"), function(data){ handlePanelDrop(data, moveGroupToNewPage, moveContactToNewPage, addTemplatesToNewPage); });
  /* Ctrl+P (Cmd+P on Mac) must go through doPrint() too, not the browser's
     own print of whatever's on screen -- the visible viewer is a live
     editor (one card at a time, edit overlays, etc), not the print layout;
     only #printArea (built by doPrint) is meant to ever hit the printer. */
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && (e.key === "p" || e.key === "P")){
      e.preventDefault();
      doPrint();
    }
  });
  /* closes any open header-color swatch dropdown (see buildSwatchSelect)
     when the click landed anywhere outside it -- registered once here
     rather than per dropdown instance, since those get rebuilt on every
     render */
  document.addEventListener("click", closeOpenSwatchLists);
  $("#viewerWrap").addEventListener("wheel", onWheel, { passive:false });
  /* a resize can cross a sidesPerView tier (needing a full rebuild, since
     a different number of pairs/sides now fit) just as easily as it can
     leave the tier alone and only change the pixel size of what's
     already showing -- always going through renderViewer covers both
     without needing to tell them apart. Debounced so a window dragged by
     its edge doesn't rebuild on every intermediate frame. */
  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderViewer, 80);
  });
  setupDropZone();
}

/* ---------------- department grouping sidebar ---------------- */
/* buckets any contact list by department -- used both for the full roster
   (state.contacts) and for a single page's own contacts, which aren't
   guaranteed to stay contiguous by department once groups are moved
   between pages by hand. Groups appear in first-seen order. */
function groupContactsByDepartment(contacts){
  var byKey = new Map();
  var order = [];
  contacts.forEach(function(c){
    var key = deptGroupKey(c.department);
    if(!byKey.has(key)){
      byKey.set(key, { key:key, label:deptDisplayLabel(c.department), contacts:[] });
      order.push(key);
    }
    byKey.get(key).contacts.push(c);
  });
  return order.map(function(k){ return byKey.get(k); });
}
function computeDepartmentGroups(){ return groupContactsByDepartment(state.contacts); }

/* same idea as groupContactsByDepartment, but a department is only ever
   the same group if it's also from the same imported source -- two files
   that both have an "IT" department produce two separate groups here, so
   dragging or auto-populating one never sweeps up the other's contacts
   (see the group panel's per-source sections, and packContactsIntoPages).
   Each group additionally carries its sourceId, needed by groupMatcher to
   keep the two apart. */
function groupContactsBySourceAndDepartment(contacts){
  var byKey = new Map();
  var order = [];
  contacts.forEach(function(c){
    var key = (c.sourceId||"") + "::" + deptGroupKey(c.department);
    if(!byKey.has(key)){
      byKey.set(key, { key:deptGroupKey(c.department), sourceId:c.sourceId, label:deptDisplayLabel(c.department), contacts:[] });
      order.push(key);
    }
    byKey.get(key).contacts.push(c);
  });
  return order.map(function(k){ return byKey.get(k); });
}

/* consistent color for a department, shared by the segment capsules
   (buildCardEdgeHandles) and the drag-preview highlight
   (applyDragHighlights) -- same key, same color, so a purple IT capsule
   and a purple highlighted row obviously mean the same department. Order
   comes from computeDepartmentGroups (first-seen in the full roster),
   cycling through COLOR_PRESETS if there are more departments than
   presets. */
function colorForDeptKey(key){
  var deptOrder = computeDepartmentGroups().map(function(g){ return g.key; });
  var idx = deptOrder.indexOf(key);
  return COLOR_PRESETS[(idx === -1 ? 0 : idx) % COLOR_PRESETS.length].hex;
}
function hexToRgba(hex, alpha){
  var rgb = hexToRgb(hex);
  return "rgba("+rgb.r+","+rgb.g+","+rgb.b+","+alpha+")";
}

/* which 1-indexed page(s) currently show at least one of this group's
   contacts -- contact objects are shared by reference all the way from
   state.contacts through to each page's contacts array (nothing clones
   them), so a plain reference check is enough. A page whose contacts are
   hidden in savedContacts (because it's currently set to "empty") doesn't
   count -- those contacts aren't actually on that page right now. Lets the
   sidebar warn against adding a group somewhere it (partly) already is. */
function pageNumbersForGroup(group){
  var contactSet = new Set(group.contacts);
  var nums = [];
  state.pages.forEach(function(p, i){
    if(p.contacts.some(function(c){ return contactSet.has(c); })) nums.push(i+1);
  });
  return nums;
}

/* appends a whole department group onto the given 1-indexed page, creating
   pages up to that index if needed, then reuses the existing overflow
   cascade (reflowFromPage) so nothing is ever dropped if it doesn't fit --
   the same guarantee a manual layout-capacity change already gets. */
/* ensures state.pages[index] exists and is a real content page (creating
   blank pages up to it, and waking it up from "empty" if needed), ready to
   receive contacts -- used by moveMatchingBetweenPagesAt. */
function activateContentPage(index){
  while(state.pages.length <= index){
    state.pages.push(blankPage(DEFAULT_LAYOUT));
  }
  var target = state.pages[index];
  if(target.layout === "empty"){
    target.layout = DEFAULT_LAYOUT;
    target.savedContacts = null;
  }
  return target;
}

/* ---- shared drag/drop placement engine for both a whole department group
   and a single contact -- the two used to be fully separate (but identical)
   function families; unified here behind a match-predicate since the only
   real difference was "match by deptGroupKey" vs "match by id". ---- */

/* removes and returns every contact matching `matches` from one page's
   contacts -- never touches state.contacts itself, so a contact is only
   ever "unassigned from this page", not deleted. */
function takeMatchingOffPage(pageIndex, matches){
  var page = state.pages[pageIndex];
  if(!page) return [];
  var taken = page.contacts.filter(matches);
  if(taken.length) page.contacts = page.contacts.filter(function(c){ return !matches(c); });
  return taken;
}
/* same, but only across pages whose layout is `layoutKey` -- lets a
   consolidation stay within one layout family without disturbing
   placements on a different layout (see takeMatching). Omit layoutKey to
   sweep every page regardless of layout (the delete-zone's "unplace this
   from everywhere" case, in removeMatchingFromPage below). */
function takeMatchingOffAllPages(matches, layoutKey){
  var taken = [];
  state.pages.forEach(function(p, i){
    if(layoutKey == null || p.layout === layoutKey) taken = taken.concat(takeMatchingOffPage(i, matches));
  });
  return taken;
}
/* the unplaced pool (department tiles, expanded contact rows) is draggable
   too, and isn't tied to any one page -- its drags carry fromPage:null.
   Dragging an actual page's chip (fromPage a real index) always just moves
   that one page's portion, as before, regardless of layout.

   Pool drags depend on the destination layout: v20 is the one general-
   purpose directory, so it consolidates -- a contact never ends up on two
   v20 pages at once, though placements on non-v20 pages are left alone.
   v10 pages are each their own group-specific sheet (with info, like
   private numbers, meant only for that group), so a v10 destination never
   takes a contact off anywhere -- the same person can legitimately sit on
   several different v10 sheets, and on a v20 page, at once. */
function takeMatching(fromPage, matches, destLayoutKey){
  if(fromPage == null){
    if(destLayoutKey !== "v20"){
      return state.contacts.filter(matches);
    }
    /* a contact placed on more than one v20 page gets extracted once per
       page it was on, so fromPages can contain the same reference more
       than once -- the Set both tracks what's already accounted for AND,
       converted back to an array, dedupes the final result so
       consolidating never doubles someone up on the one destination page */
    var fromPages = takeMatchingOffAllPages(matches, "v20");
    var alreadyTaken = new Set(fromPages);
    var stillUnplaced = state.contacts.filter(function(c){ return matches(c) && !alreadyTaken.has(c); });
    return Array.from(alreadyTaken).concat(stillUnplaced);
  }
  return takeMatchingOffPage(fromPage, matches);
}

/* inserts every matching contact into another page starting at a specific
   row -- used when dropping
   directly onto a row of the card in the viewer itself (see
   wireCardDropTarget), where the row you're over is the whole point.
   Pool drags (fromPage:null) onto a v20 page they're already on still
   work out as an in-place reorder for free: takeMatching's v20
   consolidation removes the contact from every v20 page it's on
   (including this one, if it's here) before this re-inserts it at the
   dropped position. */
function moveMatchingBetweenPagesAt(fromPage, toIndex, matches, atRow){
  if(fromPage != null && fromPage === toIndex) return;
  var toPage = activateContentPage(toIndex);
  var moving = takeMatching(fromPage, matches, toPage.layout);
  if(!moving.length) return;
  var insertAt = Math.max(0, Math.min(atRow, toPage.contacts.length));
  toPage.contacts = toPage.contacts.slice(0, insertAt).concat(moving, toPage.contacts.slice(insertAt));
  reflowFromPage(toIndex);
  renderViewer();
}
/* drop target: sends every matching contact to a freshly appended page of
   its own, cascading overflow forward from there like any other placement.
   A brand-new page always starts as DEFAULT_LAYOUT, so that's the
   consolidation scope regardless of what it might get switched to later. */
function moveMatchingToNewPage(fromPage, matches){
  var moving = takeMatching(fromPage, matches, DEFAULT_LAYOUT);
  if(!moving.length) return;
  var newIndex = state.pages.length;
  state.pages.push(blankPage(DEFAULT_LAYOUT, moving));
  reflowFromPage(newIndex);
  if(state.pages.length % 2 !== 0) state.pages.push(blankPage(DEFAULT_LAYOUT));
  renderViewer();
}
/* drop target: takes every matching contact off the page it's on (or,
   dragged from the unplaced pool, off every page it's on) and puts it
   nowhere else -- e.g. dragging IT off page 3 without clearing the rest of
   that page. Contacts are never deleted (still in state.contacts): they
   just go back to being unplaced, ready to be dragged somewhere else later. */
function removeMatchingFromPage(fromPage, matches){
  var taken = fromPage == null ? takeMatchingOffAllPages(matches) : takeMatchingOffPage(fromPage, matches);
  if(!taken.length) return;
  renderViewer();
}

/* sourceId is required so two files that both have an "IT" department
   never match each other's contacts (see groupContactsBySourceAndDepartment) */
function groupMatcher(sourceId, groupKey){ return function(c){ return c.sourceId === sourceId && deptGroupKey(c.department) === groupKey; }; }
function contactMatcher(contactId){ return function(c){ return c.id === contactId; }; }
function idsMatcher(ids){ var set = new Set(ids); return function(c){ return set.has(c.id); }; }

function moveGroupToNewPage(fromPage, groupKey, sourceId){ moveMatchingToNewPage(fromPage, groupMatcher(sourceId, groupKey)); }
function removeGroupFromPage(fromPage, groupKey, sourceId){ removeMatchingFromPage(fromPage, groupMatcher(sourceId, groupKey)); }

/* clones a multi-use contact/group or the "Tom rad" spacer into brand-new
   contact objects (fresh ids), so the pool's own template is never
   consumed -- the same source stays draggable out again as many times as
   needed. Never added to state.contacts: a template instance lives only
   on whichever page(s) it's dropped onto (see the state.sources doc
   comment), so it's automatically left out of the pool listing and the
   "Fördela" auto-distribution, exactly as intended. */
function instantiateTemplates(templates){
  return templates.map(function(t){
    var c = Object.assign({}, t);
    c.id = state.nextContactId++;
    return c;
  });
}
function addTemplatesAt(toIndex, atRow, templates){
  var contacts = instantiateTemplates(templates);
  if(!contacts.length) return;
  var toPage = activateContentPage(toIndex);
  var insertAt = Math.max(0, Math.min(atRow, toPage.contacts.length));
  toPage.contacts = toPage.contacts.slice(0, insertAt).concat(contacts, toPage.contacts.slice(insertAt));
  reflowFromPage(toIndex);
  renderViewer();
}
function addTemplatesToNewPage(templates){
  var contacts = instantiateTemplates(templates);
  if(!contacts.length) return;
  var newIndex = state.pages.length;
  state.pages.push(blankPage(DEFAULT_LAYOUT, contacts));
  reflowFromPage(newIndex);
  if(state.pages.length % 2 !== 0) state.pages.push(blankPage(DEFAULT_LAYOUT));
  renderViewer();
}

function moveContactToNewPage(fromPage, contactId){ moveMatchingToNewPage(fromPage, contactMatcher(contactId)); }
function removeContactFromPage(fromPage, contactId){ removeMatchingFromPage(fromPage, contactMatcher(contactId)); }

/* turns this one page/side blank rather than physically removing it from
   state.pages -- splicing it out used to shift every later page's own
   front/back pairing, and repeatedly doing that down to zero pages fell
   all the way back to the "drop a CSV/XLSX file" empty-viewer message,
   which is a jarring thing to land on when contacts are already loaded.
   Same "switch to empty" move the layout select itself offers (see
   buildPageControls): its contacts are stashed in savedContacts, not
   deleted -- switching the layout back to v10/v20 restores them, and
   they're always still draggable back out of the pool in the meantime.
   A no-op on a page that's already blank. */
function removePage(index){
  var pageState = state.pages[index];
  if(!pageState || pageState.layout === "empty") return;
  pageState.savedContacts = pageState.contacts;
  pageState.contacts = [];
  pageState.layout = "empty";
  if(!pageState.emptyMode) pageState.emptyMode = "blank";
  reflowFromPage(index);
  renderViewer();
}

/* custom MIME type carrying {type:"group"|"contact", fromPage, groupKey|contactId}
   for the group panel's own internal drag-and-drop -- never "Files", so
   isFileDrag() never mistakes it for a real file drop */
var PANEL_DRAG_MIME = "application/x-cccp-panel-item";
/* wires up dragover/dragleave/drop on any element so it accepts a group or
   contact drag, calling onDrop(data) -- shared by every drop target in the
   group panel (page cards, "New page", "Remove from page") */
function wireDropTarget(target, onDrop){
  target.addEventListener("dragover", function(e){
    if(e.dataTransfer.types.indexOf(PANEL_DRAG_MIME) === -1) return;
    e.preventDefault();
    target.classList.add("dragOver");
  });
  target.addEventListener("dragleave", function(){ target.classList.remove("dragOver"); });
  target.addEventListener("drop", function(e){
    e.preventDefault();
    target.classList.remove("dragOver");
    var raw = e.dataTransfer.getData(PANEL_DRAG_MIME);
    if(!raw) return;
    onDrop(JSON.parse(raw));
  });
}
/* dispatches a drop payload to the matching group/contact/template
   operation -- shared by every drop target so they don't each need their
   own type check. onTemplate is optional: drop targets with no sensible
   "create a new one here" action (e.g. the remove zone) can leave it out,
   in which case a template drop is silently ignored there. */
function handlePanelDrop(data, onGroup, onContact, onTemplate){
  if(data.type === "contact") onContact(data.fromPage, data.contactId);
  else if(data.type === "template"){ if(onTemplate) onTemplate(data.templates); }
  else onGroup(data.fromPage, data.groupKey, data.sourceId);
}
/* starts a panel drag carrying `payload` (a {type, fromPage, ...} object
   matching handlePanelDrop's expectations) -- shared by every draggable
   pool tile/chip, which otherwise all repeat the same setData+effectAllowed
   pair with only the payload differing */
function wireDragStart(node, payload){
  node.addEventListener("dragstart", function(e){
    e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "move";
    activeDragPayload = payload;
  });
}
/* dataTransfer's own payload can only be read at dragstart/drop, never
   during dragover (a deliberate HTML5 DnD restriction, so a page can't
   snoop on a drag before the user commits to dropping) -- mirrored here
   instead so a dragover handler can know what's actually being dragged
   (which contacts, in particular -- see resolveDraggedContacts) for the
   multi-row preview below. Every drag in this app originates from its own
   code, so
   this side channel is always accurate for it. Cleared on dragend, which
   always fires on the source element once the drag operation ends,
   dropped or not. */
var activeDragPayload = null;
document.addEventListener("dragend", function(){ activeDragPayload = null; });

/* every 1-indexed page currently showing this exact contact -- normally at
   most one v20 page, but the same contact can legitimately sit on several
   v10 pages (and a v20 page) at once, since v10 never consolidates. A
   single contact is just a one-member group for this purpose, so it
   reuses pageNumbersForGroup's own reference-matching logic. */
function pageNumbersForContact(contact){
  return pageNumbersForGroup({ contacts:[contact] });
}

/* the expand/collapse triangle shown on both a pool department tile and a
   page's own department chip -- identical either way: flips the caller's
   expanded flag and re-renders, and must never itself start (or count as)
   a drag of the whole tile/chip it sits on */
function buildExpandToggle(expanded, onToggle){
  var toggle = el("span", { class:"groupTileToggle", text: expanded ? "▾" : "▸" });
  toggle.title = expanded ? "Dölj enskilda kontakter" : "Visa enskilda kontakter";
  toggle.addEventListener("dragstart", function(e){ e.preventDefault(); e.stopPropagation(); });
  toggle.addEventListener("click", function(e){ e.stopPropagation(); onToggle(); });
  return toggle;
}

/* strips the id off a contact so it can be carried in a "template" drag
   payload -- instantiateTemplates assigns each drop its own fresh id, so
   the id on the pool's own copy is never reused as-is (see
   state.nextContactId). */
function contactFields(c){
  var t = Object.assign({}, c);
  delete t.id;
  return t;
}

/* one draggable row per contact, used under an expanded pool tile.
   multiUse marks a source flagged for repeat use (see the source header's
   checkbox in renderGroupPanel): its chips are cloned fresh on every drag
   (a "template" payload) instead of being moved out of the pool, so the
   same person can be dropped onto more than one card. */
function buildContactList(contacts, fromPage, multiUse){
  var list = el("div", { class:"contactList" });
  contacts.forEach(function(c){
    var pageNums = multiUse ? [] : pageNumbersForContact(c);
    var placed = pageNums.length > 0;
    var chip = el("div", {
      class: "contactChip" + (placed ? " placed" : "") + (multiUse ? " reusable" : ""),
      draggable: "true",
      title: multiUse
        ? "Kan dras ut flera gånger -- dra till ett kort eller \"+ Ny sida\" i visaren"
        : (placed ? ("På sid" + (pageNums.length>1 ? "orna " : "an ") + pageNums.join(", ")) : "Inte placerad än") + " -- dra till ett kort, \"+ Ny sida\" eller \"✕ Ta bort\" i visaren"
    });
    chip.appendChild(el("span", { class:"contactChipName", text:c.name }));
    if(placed) chip.appendChild(el("span", { class:"contactChipPage", text:"s"+pageNums.join(",") }));
    if(multiUse) wireDragStart(chip, { type:"template", fromPage:null, templates:[contactFields(c)] });
    else wireDragStart(chip, { type:"contact", fromPage:fromPage, contactId:c.id });
    list.appendChild(chip);
  });
  return list;
}

function renderGroupPanel(){
  var panel = $("#groupPanelBody");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Dra till kortet" }));

  if(!state.sources.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"Importera en CSV/XLSX för att se grupper här." }));
    return;
  }

  var actions = el("div", { class:"panelActions" });
  var clearBtn = el("button", { type:"button", text:"Rensa alla" });
  clearBtn.addEventListener("click", function(){
    state.pages = [];
    renderViewer();
  });
  actions.appendChild(clearBtn);
  var populateBtn = el("button", { type:"button", text:"Fördela", title:"Fyll sidorna automatiskt med alla inlästa kontakter (flergångskällor undantagna) -- kör om samma fördelning efter att fler filer lästs in" });
  populateBtn.addEventListener("click", function(){
    state.currentPage = 0;
    regeneratePages();
    renderViewer();
  });
  actions.appendChild(populateBtn);
  panel.appendChild(actions);

  /* always-available blank spacer row -- a "template" tile like a
     multi-use source's own (see buildContactList), just with no source of
     its own: every drag creates a fresh empty-fields contact instance. */
  var emptyTile = el("div", {
    class: "groupTile reusable",
    draggable: "true",
    title: "Tom rad -- kan dras ut flera gånger för att lämna mellanrum mellan grupper"
  });
  emptyTile.appendChild(el("span", { class:"groupTileName", text:"+ Tom rad" }));
  wireDragStart(emptyTile, { type:"template", fromPage:null, templates:[emptyRowTemplate()] });
  panel.appendChild(emptyTile);

  /* one section per imported file, so a department repeated across two
     files (e.g. both having "IT") never shows up as a single merged
     group -- each source's own tiles only ever come from ITS OWN
     contacts (see groupContactsByDepartment(sourceContacts) below). */
  state.sources.forEach(function(source){
    var sourceContacts = state.contacts.filter(function(c){ return c.sourceId === source.id; });
    if(!sourceContacts.length) return;

    var section = el("div", { class:"sourceSection" });
    var header = el("div", { class:"sourceHeader" });
    header.appendChild(el("span", { class:"sourceName", text:source.name, title:source.name }));
    var toggleLabel = el("label", {
      class:"sourceMultiUse",
      title:"Tillåt att kontakter härifrån dras ut till flera platser (t.ex. generella supportnummer) -- de ingår då inte längre i \"Fördela\""
    });
    var toggleInput = el("input", { type:"checkbox" });
    toggleInput.checked = !!source.multiUse;
    toggleInput.addEventListener("change", function(){
      source.multiUse = toggleInput.checked;
      renderGroupPanel();
    });
    toggleLabel.appendChild(toggleInput);
    toggleLabel.appendChild(el("span", { text:"Flergång" }));
    header.appendChild(toggleLabel);
    section.appendChild(header);

    var grid = el("div", { class:"groupGrid" });
    groupContactsByDepartment(sourceContacts).forEach(function(g){
      var expandKey = source.id + ":" + g.key;
      var expanded = !!state.expandedGroups[expandKey];
      var pageNums = source.multiUse ? [] : pageNumbersForGroup(g);
      var placed = pageNums.length > 0;
      var tile = el("div", {
        class: "groupTile" + (placed ? " placed" : "") + (source.multiUse ? " reusable" : ""),
        draggable: "true",
        title: source.multiUse
          ? "Kan dras ut flera gånger -- dra till en sida nedan"
          : (placed ? ("På sid" + (pageNums.length>1 ? "orna " : "an ") + pageNums.join(", ")) : "Inte placerad än") + " -- dra till en sida nedan"
      });
      var nameRow = el("div", { class:"groupTileNameRow" });
      nameRow.appendChild(buildExpandToggle(expanded, function(){
        state.expandedGroups[expandKey] = !expanded;
        renderGroupPanel();
      }));
      nameRow.appendChild(el("span", { class:"groupTileName", text:g.label }));
      nameRow.appendChild(el("span", { class:"groupTileCount", text:g.contacts.length + (placed ? " · s" + pageNums.join(",") : "") }));
      tile.appendChild(nameRow);
      if(source.multiUse) wireDragStart(tile, { type:"template", fromPage:null, templates:g.contacts.map(contactFields) });
      /* fromPage:null marks this as a drag from the unplaced-pool grid
         (as opposed to a specific page's chip) -- see takeGroup() */
      else wireDragStart(tile, { type:"group", fromPage:null, groupKey:g.key, sourceId:source.id });
      grid.appendChild(tile);
      if(expanded) grid.appendChild(buildContactList(g.contacts, null, source.multiUse));
    });
    section.appendChild(grid);
    panel.appendChild(section);
  });
}

populatePaperSizes();
initEvents();
renderViewer();

})();
</script>
</body>
</html>
