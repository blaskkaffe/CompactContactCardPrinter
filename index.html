  if(state.pages.length % 2 !== 0) state.pages.push(emptyFillerPage());
  renderViewer();
}
function removeContactFromPage(fromPage, contactId){
  var taken = fromPage == null ? takeContactOffAllPages(contactId) : takeContactOffPage(fromPage, contactId);
  if(!taken) return;
  renderViewer();
}

/* removes a page outright. Its contacts are never deleted -- they're still
   in state.contacts, same as any other unplaced group/contact -- they just
   go back to being unassigned, ready to be dragged onto a different page
   from the pool. (An earlier version reinserted a fresh page with the same
   contacts at the same spot instead, which "rescued" the data but made
   Remove look like it did nothing whenever the page had content -- the
   page count never actually dropped.) Re-pads to an even count afterward,
   same as every other page-count change. */
function removePage(index){
  var page = state.pages[index];
  if(!page) return;
  state.pages.splice(index, 1);
  if(state.pages.length % 2 !== 0){
    state.pages.push(emptyFillerPage());
  }
  renderViewer();
}

/* custom MIME type carrying {type:"group"|"contact", fromPage, groupKey|contactId}
   for the group panel's own internal drag-and-drop -- never "Files", so
   isFileDrag() never mistakes it for a real file drop */
var PANEL_DRAG_MIME = "application/x-cccp-panel-item";
/* wires up dragover/dragleave/drop on any element so it accepts a group or
   contact drag, calling onDrop(data) -- shared by every drop target in the
   group panel (page cards, "New page", "Remove from page") */
function wireDropTarget(target, onDrop){
  target.addEventListener("dragover", function(e){
    if(e.dataTransfer.types.indexOf(PANEL_DRAG_MIME) === -1) return;
    e.preventDefault();
    target.classList.add("dragOver");
  });
  target.addEventListener("dragleave", function(){ target.classList.remove("dragOver"); });
  target.addEventListener("drop", function(e){
    e.preventDefault();
    target.classList.remove("dragOver");
    var raw = e.dataTransfer.getData(PANEL_DRAG_MIME);
    if(!raw) return;
    onDrop(JSON.parse(raw));
  });
}
/* dispatches a drop payload to the matching group/contact operation --
   shared by every drop target so they don't each need their own type check */
function handlePanelDrop(data, onGroup, onContact){
  if(data.type === "contact") onContact(data.fromPage, data.contactId);
  else onGroup(data.fromPage, data.groupKey);
}

/* which 1-indexed page currently shows this exact contact (by reference,
   same reasoning as pageNumbersForGroup), or null if it's unplaced */
function pageNumberForContact(contact){
  for(var i=0;i<state.pages.length;i++){
    if(state.pages[i].contacts.indexOf(contact) !== -1) return i+1;
  }
  return null;
}

/* one draggable row per contact, used both under an expanded pool tile and
   under an expanded page chip -- identical either way, since a single name
   moves through the same take/move functions a whole department does */
function buildContactList(contacts, fromPage){
  var list = el("div", { class:"contactList" });
  contacts.forEach(function(c){
    var pageNum = pageNumberForContact(c);
    var chip = el("div", {
      class: "contactChip" + (pageNum ? " placed" : ""),
      draggable: "true",
      title: (pageNum ? ("On page " + pageNum) : "Not placed yet") + " -- drag onto a page, \"+ New page\", or \"" + "✕ Remove from page" + "\""
    });
    chip.appendChild(el("span", { class:"contactChipName", text:c.name }));
    if(pageNum) chip.appendChild(el("span", { class:"contactChipPage", text:"p"+pageNum }));
    chip.addEventListener("dragstart", function(e){
      e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify({ type:"contact", fromPage:fromPage, contactId:c.id }));
      e.dataTransfer.effectAllowed = "move";
    });
    list.appendChild(chip);
  });
  return list;
}

function renderGroupPanel(){
  var panel = $("#groupPanelBody");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Department groups" }));

  if(!state.contacts.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"Import a CSV/XLSX to see groups here." }));
    return;
  }

  var clearBtn = el("button", { type:"button", text:"Clear pages, group manually", style:"width:100%; margin-bottom:10px; font-size:11px; padding:4px;" });
  clearBtn.addEventListener("click", function(){
    state.pages = [];
    renderViewer();
  });
  panel.appendChild(clearBtn);

  var grid = el("div", { class:"groupGrid" });
  computeDepartmentGroups().forEach(function(g){
    var pageNums = pageNumbersForGroup(g);
    var placed = pageNums.length > 0;
    var expanded = !!state.expandedGroups[g.key];
    var tile = el("div", {
      class: "groupTile" + (placed ? " placed" : ""),
      draggable: "true",
      title: (placed ? ("On page" + (pageNums.length>1 ? "s " : " ") + pageNums.join(", ")) : "Not placed yet") + " -- drag onto a page below"
    });
    var nameRow = el("div", { class:"groupTileNameRow" });
    var toggle = el("span", { class:"groupTileToggle", text: expanded ? "▾" : "▸" });
    toggle.title = expanded ? "Hide individual contacts" : "Show individual contacts";
    /* a click on the toggle only expands/collapses -- it must never start
       (or count as) a drag of the whole department tile */
    toggle.addEventListener("dragstart", function(e){ e.preventDefault(); e.stopPropagation(); });
    toggle.addEventListener("click", function(e){
      e.stopPropagation();
      state.expandedGroups[g.key] = !expanded;
      renderGroupPanel();
    });
    nameRow.appendChild(toggle);
    nameRow.appendChild(el("span", { class:"groupTileName", text:g.label }));
    tile.appendChild(nameRow);
    tile.appendChild(el("div", { class:"groupTileCount", text:g.contacts.length + (placed ? " · p" + pageNums.join(",") : "") }));
    /* fromPage:null marks this as a drag from the unplaced-pool grid
       (as opposed to a specific page's chip) -- see takeGroup() */
    tile.addEventListener("dragstart", function(e){
      e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify({ type:"group", fromPage:null, groupKey:g.key }));
      e.dataTransfer.effectAllowed = "move";
    });
    grid.appendChild(tile);
    if(expanded) grid.appendChild(buildContactList(g.contacts, null));
  });
  panel.appendChild(grid);

  panel.appendChild(el("h2", { text:"Pages", style:"margin-top:14px;" }));

  /* always rendered, even with zero pages -- "+ New page" is the only way
     to create the very first one now that placement is drag-only */
  var actionZone = el("div", { class:"pageActionZone" });
  var newPageZone = el("div", { class:"dropZone newPageZone", text:"+ New page" });
  var deleteZone = el("div", { class:"dropZone deleteZone", text:"✕ Remove from page" });
  wireDropTarget(newPageZone, function(data){ handlePanelDrop(data, moveGroupToNewPage, moveContactToNewPage); });
  wireDropTarget(deleteZone, function(data){ handlePanelDrop(data, removeGroupFromPage, removeContactFromPage); });
  actionZone.appendChild(newPageZone);
  actionZone.appendChild(deleteZone);
  panel.appendChild(actionZone);

  if(!state.pages.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"No pages yet." }));
    return;
  }

  state.pages.forEach(function(p, i){
    var card = el("div", { class:"pageCard" });

    var headerRow = el("div", { class:"pageCardHeader" });
    var cap = layoutRows(p.layout), used = p.contacts.length, free = Math.max(0, cap-used);
    var headerText = p.layout === "empty"
      ? "Page " + (i+1) + ": empty"
      : "Page " + (i+1) + " (" + LAYOUTS[p.layout].label + "): " + used + "/" + cap + " used, " + free + " free";
    headerRow.appendChild(el("span", { class: free === 0 && p.layout !== "empty" ? "full" : "", text:headerText }));
    var removeBtn = el("button", { type:"button", text:"Remove" });
    removeBtn.addEventListener("click", function(){ removePage(i); });
    headerRow.appendChild(removeBtn);
    card.appendChild(headerRow);

    var chipList = el("div", { class:"pageGroupList" });
    groupContactsByDepartment(p.contacts).forEach(function(g){
      var pgKey = i + ":" + g.key;
      var expandedP = !!state.expandedPageGroups[pgKey];
      var chip = el("div", { class:"pageGroupChip", draggable:"true" });
      var toggleP = el("span", { class:"chipToggle", text: expandedP ? "▾" : "▸" });
      toggleP.title = expandedP ? "Hide individual contacts" : "Show individual contacts";
      toggleP.addEventListener("dragstart", function(e){ e.preventDefault(); e.stopPropagation(); });
      toggleP.addEventListener("click", function(e){
        e.stopPropagation();
        state.expandedPageGroups[pgKey] = !expandedP;
        renderGroupPanel();
      });
      chip.appendChild(toggleP);
      chip.appendChild(el("span", { text:g.label + " " + g.contacts.length }));
      chip.addEventListener("dragstart", function(e){
        e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify({ type:"group", fromPage:i, groupKey:g.key }));
        e.dataTransfer.effectAllowed = "move";
      });
      chipList.appendChild(chip);
      if(expandedP) chipList.appendChild(buildContactList(g.contacts, i));
    });
    if(!chipList.children.length){
      chipList.appendChild(el("div", { class:"emptyNote", text: p.layout === "empty" ? "Drop a group here to fill it" : "No contacts here yet" }));
    }
    card.appendChild(chipList);

    /* the whole card is a drop target -- dragging a group or contact from
       any page (including this one, a no-op) onto it moves it from the
       source page here, cascading overflow like every other placement */
    wireDropTarget(card, function(data){
      handlePanelDrop(data,
        function(fromPage, groupKey){ moveGroupBetweenPages(fromPage, i, groupKey); },
        function(fromPage, contactId){ moveContactBetweenPages(fromPage, i, contactId); });
    });

    panel.appendChild(card);
  });
}

/* ===================== DEBUG PANEL (temporary) =====================
   Exposes the CONFIG constants above as live inputs. Reads/writes the
   same vars the renderer already uses, so deleting this whole function
   (+ its call below, + the <aside id="debugPanel"> element and its CSS
   block) fully removes the feature -- nothing else depends on it. */
function initDebugPanel(){
  var panel = $("#debugPanel");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Config (overrides)" }));

  var settings = [
    /* card/margin geometry -- moved here from the toolbar so it lives
       alongside every other override in one hideable panel */
    { label:"Card width (mm)",  get:function(){ return state.cardWmm; },  set:function(v){ state.cardWmm=v; },  step:0.01 },
    { label:"Card height (mm)", get:function(){ return state.cardHmm; },  set:function(v){ state.cardHmm=v; },  step:0.01 },
    { label:"Margin (mm)",      get:function(){ return state.marginMm; }, set:function(v){ state.marginMm=v; }, min:0, step:1 },
    { label:"Render DPI", get:function(){ return RENDER_DPI; }, set:function(v){ RENDER_DPI=v; } },
    { label:"Header font (pt)", get:function(){ return HEADER_FONT_PT; }, set:function(v){ HEADER_FONT_PT=v; } },
    { label:"Header height (x rows)", get:function(){ return HEADER_HEIGHT_FACTOR; }, set:function(v){ HEADER_HEIGHT_FACTOR=v; } },
    { label:"Name font (pt)",   get:function(){ return NAME_FONT_PT; },   set:function(v){ NAME_FONT_PT=v; } },
    { label:"Name font, w/ dept (pt)", get:function(){ return NAME_FONT_PT_TIGHT; }, set:function(v){ NAME_FONT_PT_TIGHT=v; } },
    { label:"Email font (pt)",  get:function(){ return EMAIL_FONT_PT; },  set:function(v){ EMAIL_FONT_PT=v; } },
    { label:"Phone font (pt)",  get:function(){ return PHONE_FONT_PT; },  set:function(v){ PHONE_FONT_PT=v; } },
    { label:"Dept font (pt)",   get:function(){ return DEPT_FONT_PT; },   set:function(v){ DEPT_FONT_PT=v; } },
    { label:"Dept max chars",   get:function(){ return DEPT_MAX_CHARS; }, set:function(v){ DEPT_MAX_CHARS=v; } },
    { label:"Label max chars",  get:function(){ return LABEL_MAX_CHARS; }, set:function(v){ LABEL_MAX_CHARS=v; } },
    { label:"Rows: 20-row vert.", get:function(){ return ROWS_V20; }, set:function(v){ ROWS_V20=v; } },
    { label:"Rows: 10-row vert.", get:function(){ return ROWS_V10; }, set:function(v){ ROWS_V10=v; } },
    { label:"Rows: 2-num horiz.", get:function(){ return ROWS_H2; },  set:function(v){ ROWS_H2=v; } }
  ];

  settings.forEach(function(s){
    var row = el("div", { class:"row" });
    row.appendChild(el("label", { text:s.label }));
    var input = document.createElement("input");
    input.type = "number";
    input.step = String(s.step != null ? s.step : 0.5);
    input.value = s.get();
    input.addEventListener("change", function(){
      var v = parseFloat(input.value);
      /* every setting must stay positive except margin, which may be 0 */
      var min = s.min != null ? s.min : Number.MIN_VALUE;
      if(!isNaN(v) && v >= min){ s.set(v); renderViewer(); }
    });
    row.appendChild(input);
    panel.appendChild(row);
  });
}
/* ===================== END DEBUG PANEL ===================== */

populatePaperSizes();
renderToolbar();
initEvents();
initDebugPanel();
renderViewer();

})();
</script>
