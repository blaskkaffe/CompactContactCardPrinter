<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompakt kontaktkortsskrivare</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#e6e6e6; --panel:#fff; --border:#bbb; --border-dark:#999; --border-light:#ccc;
  --text:#111; --text-soft:#333; --muted:#777; --muted-dark:#555; --hover-bg:#eee;
  --blue:#0080ff; --blue-text:#0060c0; --blue-bg:#dff0ff; --blue-glow:rgba(0,128,255,.6); --danger:#c00;
  --shadow-panel:0 2px 5px rgba(0,0,0,.28); --shadow-soft:rgba(0,0,0,.4);
  --space-1:4px; --space-2:6px; --space-3:8px; --space-4:10px; --space-5:12px;
  --edge-gap:14px; --panel-radius:calc(var(--pill-radius) + var(--space-4));
  --ui-font:12px; --small-font:10px; --title-font:15px;
  --segmentFontSize:12px; --segmentPillPadY:5px; --segmentLineHeight:1.2;
  --segmentPillHeight:calc(var(--segmentLineHeight)*var(--segmentFontSize) + var(--segmentPillPadY)*2);
  --pill-radius:calc(var(--segmentPillHeight)/2);
}
html,body{height:100%}
body{display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Arial,sans-serif}

/* Shared UI */
.pill{display:flex;align-items:center;height:var(--segmentPillHeight);min-width:calc(var(--segmentPillHeight)*2);padding:0 var(--space-4);border-radius:var(--pill-radius);font-size:10.5px;cursor:pointer;user-select:none}
.truncate{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Toolbar */
header.toolbar{display:grid;grid-template-columns:max-content minmax(52px,1fr) minmax(190px,max-content);align-items:center;column-gap:var(--space-4);flex:0 0 auto;padding:var(--space-3) var(--space-4);background:#1c1c1c;color:#fff}
header.toolbar h1{margin:0 var(--space-4) 0 0;font-size:var(--title-font);white-space:nowrap}
.toolbarSide{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--space-4)}
.toolbarSideRight{justify-content:flex-end}
header.toolbar select,header.toolbar button:not(.pill){flex:0 0 auto;height:30px;padding:0 var(--space-3);background:var(--panel);border:1px solid var(--border-dark);border-radius:4px;font-size:var(--ui-font);cursor:pointer}
header.toolbar button:hover{background:var(--hover-bg)}
#printBtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--border-dark);cursor:pointer}
label.tool{display:flex;align-items:center;gap:var(--space-1);flex:0 0 auto;font-size:var(--ui-font);white-space:nowrap}
#dataStatus{color:var(--border-light);font-size:var(--ui-font)}
#portalPanel{display:flex;align-items:center;gap:var(--space-2);max-width:40vw;padding:2px 0;overflow-x:auto;overflow-y:hidden}
#portalPanel .portalBtn{flex:0 0 auto;justify-content:center;background:var(--panel);border:1px solid var(--border-dark);color:var(--text-soft);font-weight:bold;transition:background-color .1s,border-color .1s,transform .08s,box-shadow .08s}
#portalPanel .portalBtn:hover{background:var(--hover-bg)}
#portalPanel .portalBtn.current{background:var(--blue-bg);border-color:var(--blue)}
#portalPanel .portalBtn.dragOver{background:var(--blue-bg);border-color:var(--blue);box-shadow:0 2px 6px var(--blue-glow);color:var(--blue-text);transform:scale(1.2)}

/* Group panel */
#mainRow{display:flex;flex:1 1 auto;overflow:hidden}
#groupPanel{display:flex;flex-direction:column;gap:var(--space-5);flex:0 0 260px;padding:var(--edge-gap);color:var(--text);overflow:hidden}
#groupPanelControls,#groupPanelBody{background:var(--panel);border:1px solid var(--border);border-radius:var(--panel-radius);box-shadow:var(--shadow-panel)}
#groupPanelControls{display:flex;flex-direction:column;gap:var(--space-3);flex:0 0 auto;padding:var(--space-4)}
#groupPanelControls .panelControlsGrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
#groupPanelControls .panelControlsGrid>*{min-width:0;padding:8px 6px;border-radius:var(--pill-radius);font-size:var(--ui-font);text-align:center}
#groupPanelControls button{background:var(--panel);border:1px solid var(--border-dark);cursor:pointer}
#groupPanelControls button:hover{background:var(--hover-bg)}
#newPageZone,#cardRemoveZone{border:1px solid var(--border-dark);transition:background-color .1s,border-color .1s,color .1s}
#newPageZone{color:var(--muted-dark);cursor:pointer}
#newPageZone.dragOver{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-text)}
#cardRemoveZone{border-color:var(--danger);color:var(--danger)}
#cardRemoveZone.dragOver{background:#fde4e4}
#groupPanelBody{flex:1 1 auto;padding:var(--space-4);font-size:var(--ui-font);overflow-y:auto}
#groupPanel h2{margin:0 0 var(--space-3);color:var(--muted-dark);font-size:var(--ui-font);text-transform:uppercase;letter-spacing:.04em}
#groupPanel .groupGrid{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-4)}
#groupPanel .groupTile,#groupPanel .contactChip{background:var(--panel);border:1px solid var(--border-light);cursor:grab}
#groupPanel .groupTile:active,#groupPanel .contactChip:active{cursor:grabbing}
#groupPanel .contactChip{justify-content:space-between;gap:var(--space-1)}
#groupPanel .groupTileNameRow{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
#groupPanel .groupTileName{flex:1;font-weight:bold}
#groupPanel .groupTileCount{flex:none;color:var(--muted);font-size:var(--small-font);white-space:nowrap}
#groupPanel .groupTileToggle{flex:none;padding:0 1px;color:var(--border-dark);font-size:9px;cursor:pointer;user-select:none}
#groupPanel .groupTileToggle:hover{color:var(--text-soft)}
#groupPanel .contactList{display:flex;flex-direction:column;gap:3px;margin-top:-2px;padding:2px 0 var(--space-1) var(--space-2);border-left:2px solid var(--hover-bg)}
#groupPanel .contactChipPage{flex:none;font-size:9.5px}
#groupPanel .emptyNote{color:var(--muted);font-style:italic}
#groupPanel .groupTile.reusable,#groupPanel .contactChip.reusable{border-style:dashed;border-color:var(--border-dark)}
#groupPanel .sourceSection{margin-bottom:14px}
#groupPanel .sourceHeader{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border-light)}
#groupPanel .sourceName{flex:1;font-size:11px;font-weight:bold}
#groupPanel .sourceMultiUse{display:flex;align-items:center;gap:3px;flex:none;color:var(--muted-dark);font-size:var(--small-font);cursor:pointer;user-select:none}
#groupPanel .sourceMultiUse input{margin:0}

/* Viewer */
main#viewerWrap{position:relative;flex:1 1 auto;min-width:0;background:var(--bg);overflow:hidden}
/* padding-top is set from JS (see fitVisibleCards/viewerTopClearancePx) --
   it depends on how tall the currently-visible page(s)' own .pageInfoBar
   actually renders, which isn't known until after layout. 0 here is only
   the flash-of-unstyled-content fallback for the instant before that
   first runs. */
#viewerContent{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:0 var(--edge-gap) var(--edge-gap) 0}
#emptyViewerOverlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:40px;color:var(--border-dark);font-size:18px;text-align:center}
#emptyViewerOverlay[hidden]{display:none}
#emptyViewerOverlay.dragOver{background:var(--blue-bg);color:var(--blue-text)}
.cardRowHighlightLayer{position:absolute;inset:0;z-index:4;pointer-events:none}
.cardRowHighlightLayer .cardRowHighlight{position:absolute;left:0;right:0}

/* Card layout */
.pageUnit{display:flex}
.pagesRow{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;gap:24px}
.page{position:relative;z-index:2;flex:0 0 auto;background:var(--panel);box-shadow:var(--shadow-panel)}
.page canvas{display:block;width:100%;height:100%;cursor:grab}
.page canvas:active{cursor:grabbing}

/* Segment tabs / drag ghosts */
.cardEdgeHandles{position:relative;z-index:1;flex:0 0 auto;width:var(--segmentPillHeight)}
.cardEdgeHandles .segmentCapsule{position:absolute;right:0;display:flex;justify-content:center;align-items:center;width:var(--segmentPillHeight);border:1px solid;border-radius:var(--pill-radius) 0 0 var(--pill-radius);color:var(--text-soft);font-size:var(--segmentFontSize);font-weight:bold;line-height:var(--segmentLineHeight);text-align:center;writing-mode:vertical-rl;text-orientation:mixed;overflow:hidden;cursor:grab;user-select:none}
.cardEdgeHandles .segmentCapsule:active{cursor:grabbing}
.cardEdgeHandles .segmentCapsule.emptyRowCapsule{background:var(--hover-bg);border-color:var(--border-dark)}
#rowDragGhost{position:fixed;top:-999px;left:-999px;padding:4px var(--space-4);background:#222;border-radius:4px;color:#fff;font-size:var(--ui-font);white-space:nowrap;pointer-events:none}
#segmentDragGhost{position:fixed;top:-999px;left:-999px;padding:var(--segmentPillPadY) 16px;border-radius:var(--pill-radius);box-shadow:0 1px 4px var(--shadow-soft);color:#fff;font-size:var(--segmentFontSize);font-weight:bold;line-height:var(--segmentLineHeight);white-space:nowrap;pointer-events:none}

/* Per-card info bar */
.pageInfoBar{position:absolute;left:0;right:0;bottom:100%;z-index:2;padding:var(--space-4);background:var(--panel);border:1px solid var(--border);border-radius:var(--panel-radius) var(--panel-radius) 0 0;font-size:11px}
.pageInfoBar .pageInfoHeader{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1)}
.pageInfoBar .pageInfoHeader span{flex:1 1 auto;font-size:11px;font-weight:bold}
.pageInfoBar .pageInfoHeader span.full{color:#a00}
.pageInfoBar .pageInfoHeader button{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:var(--segmentPillHeight);height:var(--segmentPillHeight);padding:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--pill-radius);font-size:9px;font-weight:bold;cursor:pointer}
.pageInfoBar .pageInfoHeader button.removeBtn{font-size:13px}
.pageInfoBar .pageInfoHeader button.removeBtn:hover{border-color:var(--danger);color:var(--danger)}
.pageInfoBar .pageControls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1)}
.pageInfoBar .pageControls select,.pageInfoBar .pageControls button,.pageInfoBar .pageControls input{height:30px;padding:0 6px;background:var(--panel);border:1px solid var(--border);border-radius:3px;font-size:var(--small-font);cursor:pointer}
.pageInfoBar .pageControls>select{width:76px}
.pageInfoBar .pageControls label.tool{display:flex;align-items:center;gap:3px;font-size:var(--small-font);white-space:nowrap;cursor:pointer}
/* a compact button standing in for the raw file input -- the browser's
   own file input renders at whatever width its "no file chosen" text
   needs (often 200px+), which forced it onto a row of its own (nothing
   else fit beside it) and made an image-mode page's info bar much taller
   than every other page's. The real input lives inside this label,
   visually hidden (not display:none, which some browsers stop forwarding
   a label click to) rather than shown -- clicking the label's own text
   still opens the file picker, same as clicking a native file input. */
.pageInfoBar .pageControls label.fileTrigger{display:inline-flex;align-items:center;height:30px;padding:0 6px;background:var(--panel);border:1px solid var(--border);border-radius:3px;font-size:var(--small-font);white-space:nowrap;cursor:pointer}
.pageInfoBar .pageControls label.fileTrigger:hover{background:var(--hover-bg)}
.pageInfoBar .pageControls label.fileTrigger input[type=file]{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.pageInfoBar .pageControls input[type=checkbox]{height:auto;padding:0}
.pageInfoBar .swatchSelect{position:relative;min-width:0}
.pageInfoBar .swatchSelect .swatchBtn{display:flex;align-items:center;gap:5px;width:76px;min-width:0;height:30px;padding:0 6px;background:var(--panel);border:1px solid var(--border);border-radius:3px;font-size:var(--small-font);cursor:pointer}
.pageInfoBar .swatchSelect .swatchBox{flex:none;width:11px;height:11px;border:1px solid rgba(0,0,0,.3);border-radius:2px}
.pageInfoBar .swatchSelect .swatchList{position:absolute;top:100%;left:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-1);max-height:220px;margin-top:2px;padding:6px;background:var(--panel);border:1px solid var(--border-dark);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.3);overflow-y:auto}
.pageInfoBar .swatchSelect .swatchList[hidden]{display:none}
.pageInfoBar .swatchSelect .swatchList.alignRight{left:auto;right:0}
.pageInfoBar .swatchSelect .swatchList.openUp{top:auto;bottom:100%;margin-top:0;margin-bottom:2px}
.pageInfoBar .swatchSelect .swatchItem{width:28px;height:28px;border:2px solid #fff;border-radius:3px;outline:1px solid rgba(0,0,0,.2);cursor:pointer}
.pageInfoBar .swatchSelect .swatchItem:hover,.pageInfoBar .swatchSelect .swatchItem.active{border-color:var(--blue)}

/* Overlays / print */
#dropOverlay{position:fixed;inset:0;z-index:1000;display:flex;justify-content:center;align-items:center;background:rgba(20,20,20,.75);color:#fff;font-size:28px;font-weight:bold;pointer-events:none}
#dropOverlay[hidden]{display:none}
#printArea{display:none}
@media(max-width:560px){header.toolbar h1{display:none}}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea canvas{display:block}
  #printArea canvas:not(:last-child){page-break-after:always}
}
</style>
<style id="pageSizeStyle"></style>
</head>
<body>

<header class="toolbar">
  <div class="toolbarSide">
    <h1>Kompakt kontaktkortsskrivare</h1>
  </div>
  <!-- one round button per page ("Sida N"), centered on the bar (see
       header.toolbar's grid in the CSS) -- the whole nav, now that prev/
       next and the indicator are gone: click one to jump straight there,
       or hold a drag over one to jump while the drag stays active (see
       wirePortalButton). Rebuilt by renderPortalPanel on every render,
       same as before it lived here. -->
  <div id="portalPanel"></div>
  <div class="toolbarSide toolbarSideRight">
    <span id="dataStatus" class="truncate">Släpp en CSV- eller XLSX-fil för att börja</span>
    <!-- everything about a page ITSELF (layout, header color, ...) lives
         on the card in the viewer now, see .pageInfoBar/buildPageInfoBar --
         paper size + print are the only page-wide settings left up here. -->
    <label class="tool">Papper:
      <select id="paperSize"></select>
    </label>
    <button id="printBtn" class="pill">Skriv ut</button>
  </div>
</header>

<div id="mainRow">
  <!-- GROUP PANEL: two stacked boxes -- #groupPanelControls (static, never
       rebuilt) holds the drop zones and the buttons that act on the whole
       roster; #groupPanelBody (rebuilt by renderGroupPanel) is the
       scrollable unplaced-contacts pool ("Dra till kortet"), one section
       per imported source. Everything about a page ITSELF (used/free
       count, A-Ö/Ta bort, layout/color/etc selectors) lives on the card in
       the viewer instead, see .pageInfoBar. -->
  <aside id="groupPanel">
    <div id="groupPanelControls">
      <div class="panelControlsGrid">
        <!-- drop a group/contact here to send it straight to a freshly
             created page (see moveGroupToNewPage/moveContactToNewPage), or
             just click it to create a blank one (see createNewPage). -->
        <div id="newPageZone" title="Klicka eller dra hit för att skapa en ny sida">+ Ny sida</div>
        <!-- a second "remove from page" target for a contact/segment
             dragged off a card's own edge handles (see wireCardRemoveZone). -->
        <div id="cardRemoveZone" title="Dra hit för att ta bort från sidan">✕ Ta bort</div>
        <button id="clearAllBtn" type="button">Rensa alla</button>
        <button id="populateBtn" type="button" title="Fyll sidorna automatiskt med alla inlästa kontakter (flergångskällor undantagna) -- kör om samma fördelning efter att fler filer lästs in">Fördela kontakter</button>
      </div>
      <!-- always-available blank spacer row -- a "template" tile like a
           multi-use source's own (see buildContactList/wireDragStart in
           the script), just with no source of its own: every drag creates
           a fresh empty-fields contact instance. -->
      <div id="emptyRowTile" class="pill groupTile reusable" draggable="true" title="Tom rad -- kan dras ut flera gånger för att lämna mellanrum mellan grupper">+ Tom rad</div>
    </div>
    <div id="groupPanelBody"></div>
  </aside>
  <main id="viewerWrap">
    <div id="viewerContent"></div>
    <div id="emptyViewerOverlay" hidden></div>
  </main>
</div>

<div id="dropOverlay" hidden>Släpp en CSV- eller XLSX-fil för att importera kontakter</div>
<div id="printArea"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG -- every tunable constant lives here: font sizes, the
   spacing "distances" used throughout the card layout, card/paper
   geometry, and the column header names recognized when importing
   a CSV/XLSX. Edit values here instead of hunting for a magic
   number elsewhere in the file -- there's no in-app settings UI
   (there used to be a debug panel exposing these as live inputs;
   removed once the values stopped needing regular tuning).
   ============================================================ */

/* -- rendering -- */
/* 600 caused real print failures (jobs that reached the OS print dialog
   but never actually printed) -- each A4 canvas at 600dpi is ~35 megapixels,
   and 4 of those in one job is a lot of raster data for a print driver/
   spooler to accept, especially over a network printer. 300dpi is the
   standard "high quality" print resolution and is plenty crisp for card
   text at this physical size, at a quarter of the pixels. Raise it here and
   test on your printer if you want to push it back up. */
const RENDER_DPI = 300;
const FONT_FAMILY = '"Cascadia Code", "Cascadia Mono", monospace';

/* -- font sizes (pt) -- */
const HEADER_FONT_PT = 9;
/* one notch smaller than the other row text (phone/dept) so the name (and
   the line-2 custom field, at the same size) gets more characters before
   truncateText has to start cutting it -- names are the one field where
   more visible text matters more than a slightly bigger glyph. */
const NAME_FONT_PT = 6;
/* v20's name column shares its row with a department column and only a
   single phone, so it's the tightest layout on a 54mm-wide card -- it gets
   its own name font, independent of NAME_FONT_PT (used by v10, which has
   room to spare and shouldn't shrink just because v20 needs to). Small
   enough that a long name like "Roberto von Hemansson III" fits without
   truncation alongside a department and a full phone number. */
const NAME_FONT_PT_TIGHT = 6;
const EMAIL_FONT_PT = 6;   /* the 10-contact layout's line-2 custom field (email/username/department) -- independent of NAME_FONT_PT, but kept equal to it */
const PHONE_FONT_PT = 7;
const DEPT_FONT_PT = 6;

/* -- text length caps -- */
const DEPT_MAX_CHARS = 4;   /* plus the "C " chief prefix, kept separately -- department is the least important field, so it's kept small to give the name column room */
const LABEL_MAX_CHARS = 6;  /* number-type tags on the 10-contact layout, e.g. "Work"/"Home" */

/* -- row capacity per layout (contacts per card) -- */
const ROWS_V20 = 20;
const ROWS_V10 = 10;

/* -- header sizing --
   header height = HEADER_HEIGHT_FACTOR rows' worth of height (see
   computeHeaderH), rather than a fixed fraction of the card, so it shrinks
   along with the rows instead of eating a constant share regardless of
   row count. */
const HEADER_HEIGHT_FACTOR = 1.3;

/* -- spacing "distances" (mm) -- */
const CELL_PADDING_MM = 1.5;   /* inner padding of every row/column */
const BORDER_WIDTH_MM = 0.3;   /* card border, crop marks, empty-card outline */
const DIVIDER_INSET_MM = 2;    /* how far a row divider stays clear of the card's left/right edges */
const DIVIDER_ALPHA = 0.5;     /* row divider opacity */
const DIVIDER_WIDTH_MM = 0.1;  /* row divider line weight */
/* "Tomt rutnät" (blank empty-page mode): an actual graph-paper grid
   inside each blank card outline, so the option visibly does something
   distinct from "Tom" (a truly blank card) -- squares GRID_SPACING_MM
   apart, inset GRID_INSET_MM from the card's own border on every side. */
const GRID_SPACING_MM = 5;
const GRID_INSET_MM = 2;
const GRID_ALPHA = 0.3;

/* -- card / paper geometry -- */
const CARD_W_MM = 53.98; /* ISO/IEC 7810 ID-1 credit card -- always the VERTICAL shape */
const CARD_H_MM = 85.60;
const MARGIN_MM = 10;    /* printer-unsafe border kept clear on every edge */

const PAPER_SIZES = {
  A3: { label:"A3", wMM:297, hMM:420 },
  A4: { label:"A4", wMM:210, hMM:297 }, /* default -- see state.paperSize */
  A5: { label:"A5", wMM:148, hMM:210 }
};

/* -- card layout definitions --
   v10 is 10 CONTACTS, each spanning two printed lines:
     line 1: name             | label1 (number type, e.g. "Work") | phone1
     line 2: email (or label2)|                                   | phone2
   Line 2's wide column shows the email, falling back to label2 when the
   email isn't real/useful (see pickLine2Field) -- it has no label column
   of its own; which number is "work" vs "home" is shown once, structurally,
   via the header legend below instead of repeating a tag on every row.
   layoutRows("v10") is the contact count (10), not the printed line count. */
/* shortLabel is only for the compact per-page layout select (see
   pageLayoutOptionsSelect) -- label is the full descriptive name used
   everywhere else (page card headers, etc). */
const LAYOUTS = {
  v20:   { key:"v20",   label:"20 rader vertikal",              shortLabel:"20 rader",   orientation:"vertical",   phones:1, showDept:true,  doubleRow:false },
  v10:   { key:"v10",   label:"10 kontakter vertikal (2 rader)", shortLabel:"10 (2 rad)", orientation:"vertical",   phones:2, showDept:false, doubleRow:true, phoneRowLegend:"Jobb / Hem" },
  empty: { key:"empty", label:"Tom sida",                        shortLabel:"Tom",        orientation:"vertical",   phones:0, showDept:false, doubleRow:false }
};
/* every freshly created page (auto-chunked on import, or dragged onto
   "+ New page"/an activated "empty" slot) starts out as this layout --
   its own dropdown is how you change it afterward, same as any page */
const DEFAULT_LAYOUT = "v20";

/* -- header background presets, exactly 16 (one full 4x4 grid, no overflow
   row) -- Svart first since it's the default new-page color, the rest
   hues evenly spaced around the wheel (24° apart). Bold/near-fully
   saturated (92%) rather than muted -- distinct, easy-to-print colors
   were the actual goal, and desaturating every hue toward gray (an
   earlier version of this palette) made them all read as similar murky
   browns/olives instead. Each still lands close to the same ~4.8:1
   contrast against the white header text drawn on top of it (headerColor,
   see drawCard) -- true bright yellow can't hit that and still be legible
   under fixed white text, so Gul reads as a dark gold/olive rather than a
   light canary yellow; every other hue stays clearly primary/secondary. */
const COLOR_PRESETS = [
  { name:"Svart",    hex:"#000000" },
  { name:"Röd",      hex:"#e40909" },
  { name:"Orange",   hex:"#be5108" },
  { name:"Gul",      hex:"#896f06" },
  { name:"Oliv",     hex:"#637a05" },
  { name:"Lime",     hex:"#378205" },
  { name:"Grön",     hex:"#068506" },
  { name:"Smaragd",  hex:"#068438" },
  { name:"Turkos",   hex:"#058168" },
  { name:"Cyan",     hex:"#067c99" },
  { name:"Azur",     hex:"#0b69f5" },
  { name:"Blå",      hex:"#2323f6" },
  { name:"Indigo",   hex:"#7723f6" },
  { name:"Lila",     hex:"#bc0ae9" },
  { name:"Magenta",  hex:"#d109a9" },
  { name:"Cerise",   hex:"#e0095f" }
];

/* ================= shared utilities ================= */
function $(sel){ return document.querySelector(sel); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ e.appendChild(c); });
  return e;
}
function mmToPx(mm, dpi){ return mm * dpi / 25.4; }
function ptToPx(pt, dpi){ return pt * dpi / 72; }

/* ================= app state ================= */
var state = {
  paperSize: "A4",
  currentPage: 0,              /* 0-indexed; the first of however many card sides are on screen (see sidesPerView) */
  contacts: [],
  sources: [],   /* [{id, name, multiUse}] -- one entry per imported file, in import order; every contact in `contacts` carries the sourceId of whichever import it came from, so same-named departments from two different files are never treated as one group (see groupContactsBySourceAndDepartment) */
  nextContactId: 1,
  nextSourceId: 1,
  pages: [], /* [{layout, contacts, emptyMode, image, headerColor, headerLegend, savedContacts}] -- one entry per generated page */
  expandedGroups: {},     /* group panel UI only: which pool department tiles are expanded to show individual contacts, keyed by group key */
  expandedPageGroups: {}  /* same, for a page card's own department chips, keyed by "pageIndex:groupKey" */
};


/* ============================================================
   PRINT / RENDER ENGINE
   Page/card geometry, CSV+XLSX import, page generation, contact
   formatting, canvas drawing, click-to-edit hit-testing, and the
   print pipeline. This section only reads/writes `state` and the
   CONFIG values above -- it has no knowledge of the toolbar or
   any menu UI. See MENU / VIEWER UI below for anything about how
   controls look or are laid out.
   ============================================================ */

/* ---------------- page geometry ---------------- */
function layoutRows(key){
  if(key === "v20") return ROWS_V20;
  if(key === "v10") return ROWS_V10;
  return 0;
}

/* shared by drawCard and getEditableRegions so hit-testing always matches
   what's actually drawn. Solves headerH = k*rowH where
   rowH = (hPx-headerH)/rowUnits. */
function computeHeaderH(hPx, layout){
  var capacity = layoutRows(layout.key);
  var rowUnits = layout.doubleRow ? capacity*2 : capacity;
  if(rowUnits <= 0) return hPx * 0.1; /* empty page has no rows to size against */
  return HEADER_HEIGHT_FACTOR * hPx / (rowUnits + HEADER_HEIGHT_FACTOR);
}

function cardDimsForOrientation(orientation){
  return orientation === "horizontal"
    ? { w: CARD_H_MM, h: CARD_W_MM }
    : { w: CARD_W_MM, h: CARD_H_MM };
}

/* how many cards fit edge-to-edge on a page of the given size, once the
   printer-safe margin is removed from every side */
function gridForDims(pageDims, cardDims){
  var usableW = pageDims.w - 2*MARGIN_MM;
  var usableH = pageDims.h - 2*MARGIN_MM;
  var cols = Math.max(0, Math.floor(usableW / cardDims.w));
  var rows = Math.max(0, Math.floor(usableH / cardDims.h));
  return { cols:cols, rows:rows, count:cols*rows };
}

/* top-left corner (mm, relative to the page) of the tiled card block --
   centered exactly: equal leftover space left/right, equal leftover space
   top/bottom (the two axes need not match each other, just each side of
   its own axis) -- printed output must stay perfectly centered. Shared by
   every place that tiles cards onto a page (the real print grid and the
   "empty rutnät" outline grid), so both stay visually consistent. */
function blockOriginMm(pageDims, blockWmm, blockHmm){
  return { x:(pageDims.w - blockWmm) / 2, y:(pageDims.h - blockHmm) / 2 };
}

/* the card orientation is chosen per-page (via that page's layout); the
   PAGE orientation is whichever of portrait/landscape fits the most of
   that card shape -- it is never chosen directly by the user */
function pickPageOrientation(cardDims){
  var p = PAPER_SIZES[state.paperSize];
  var portrait = { w:p.wMM, h:p.hMM, name:"stående" };
  if(p.wMM === p.hMM) return portrait;
  var landscape = { w:p.hMM, h:p.wMM, name:"liggande" };
  return gridForDims(landscape, cardDims).count > gridForDims(portrait, cardDims).count ? landscape : portrait;
}

/* full geometry for one page, given its layout key */
function pageGeometry(layoutKey){
  var layout = LAYOUTS[layoutKey] || LAYOUTS.v20;
  var cardDims = cardDimsForOrientation(layout.orientation);
  var pageDims = pickPageOrientation(cardDims);
  var grid = gridForDims(pageDims, cardDims);
  return { layout:layout, cardDims:cardDims, pageDims:pageDims, grid:grid };
}

function pageGeometryForIndex(index){
  var pageState = state.pages[index];
  var layoutKey = pageState ? pageState.layout : "v20";
  return pageGeometry(layoutKey);
}

/* ---------------- contact sorting (alphabetical, chief dept first) ---------------- */
function isChiefDept(dept){ return /^c\.?\s+/i.test((dept||"").trim()); }
function deptGroupKey(dept){ return (dept||"").trim().replace(/^c\.?\s+/i,"").toLowerCase(); }
/* the chief-prefix-stripped department name, for anywhere a department is
   shown without wanting the "C " marker (the card header's dept summary,
   the group panel) -- distinct from deptGroupKey, which lowercases too */
function deptDisplayLabel(dept){ return (dept||"").trim().replace(/^c\.?\s+/i, "") || "(ingen avdelning)"; }
/* one entry per distinct department among these contacts, in first-seen
   order -- shared by the card header's dept summary and its edit-overlay
   prefill, so what you see is what you'd start editing from */
function collectDeptNames(contacts){
  var seen = {}, names = [];
  contacts.forEach(function(c){
    if(!c || !c.department) return;
    var key = deptGroupKey(c.department);
    if(seen[key]) return;
    seen[key] = true;
    names.push(deptDisplayLabel(c.department));
  });
  return names;
}
function sortContacts(list){
  return list.slice().sort(function(a,b){
    var gk = deptGroupKey(a.department).localeCompare(deptGroupKey(b.department));
    if(gk!==0) return gk;
    var ca = isChiefDept(a.department), cb = isChiefDept(b.department);
    if(ca!==cb) return ca ? -1 : 1;
    return (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"});
  });
}

/* a v10 page's contacts are just pageState.contacts, same as any other
   layout -- the manual, drag-reorderable array is the only source of
   truth for what's on a page. */
function contactsForPage(pageState){
  return pageState.contacts;
}
/* moves one contact to sit just before (or, insertAfter, just after)
   another within the same page's own displayed order -- used by dragging
   a name onto a sibling name in the page's contact list. */
function reorderWithinPage(pageIndex, contactId, targetId, insertAfter){
  var pageState = state.pages[pageIndex];
  if(!pageState || contactId === targetId) return;

  var byId = {};
  pageState.contacts.forEach(function(c){ byId[c.id] = c; });
  var remaining = pageState.contacts.filter(function(c){ return c.id !== contactId; });
  var targetIdx = remaining.findIndex(function(c){ return c.id === targetId; });
  if(targetIdx === -1) return;
  remaining.splice(insertAfter ? targetIdx+1 : targetIdx, 0, byId[contactId]);
  pageState.contacts = remaining;
  renderViewer();
}

/* ---------------- CSV/XLSX import ---------------- */
/* column header names recognized on import (case-insensitive) -- lives
   here rather than in CONFIG since it's read only by rowsToContacts,
   below */
const IMPORT_HEADER_ALIASES = {
  name:       ["name","full name","fullname"],
  firstName:  ["first name","firstname","first"],
  lastName:   ["last name","lastname","last","surname"],
  department: ["department","dept"],
  phone:      ["phone","number","phone1","phone 1"],
  phone2:     ["phone2","phone 2"],
  label1:     ["label1","label 1","type1","type 1","number type"],
  label2:     ["label2","label 2","type2","type 2"],
  email:      ["email","e-mail"]
};

function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field=""; }
      else if(c === "\n" || c === "\r"){
        if(c === "\r" && text[i+1] === "\n") i++;
        row.push(field); field=""; rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r[0]||"").trim()!==""; });
}

/* ---------------- XLSX parsing (no libraries: minimal targeted unzip) ----------------
   .xlsx is a zip of XML parts, but only two of them ever matter here: the
   shared-strings table and the lowest-numbered worksheet. readXlsxParts
   walks the zip's central directory ONCE and decompresses just those two
   entries -- styles.xml, theme/*, docProps/*, calcChain.xml etc are real
   parts of any Excel-written file but are never even looked at, let alone
   unpacked, the way a generic unzip-everything approach would. */
function colLetterToIndex(ref){
  var m = /^([A-Z]+)/i.exec(ref), idx = 0;
  if(m) for(var i=0;i<m[1].length;i++) idx = idx*26 + (m[1].toUpperCase().charCodeAt(i)-64);
  return idx-1;
}
async function inflateRaw(bytes){
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readXlsxParts(buf){
  var view = new DataView(buf), len = buf.byteLength, eocd = -1;
  for(var i=len-22; i>=Math.max(0,len-65557); i--){
    if(view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd === -1) throw new Error("Not a valid .xlsx (zip) file");
  var count = view.getUint16(eocd+10, true), offset = view.getUint32(eocd+16, true);
  var parts = {}, sheetNum = Infinity;
  for(var e=0; e<count; e++){
    if(view.getUint32(offset, true) !== 0x02014b50) break;
    var method = view.getUint16(offset+10, true), size = view.getUint32(offset+20, true),
        nameLen = view.getUint16(offset+28, true), extraLen = view.getUint16(offset+30, true),
        commentLen = view.getUint16(offset+32, true), localOffset = view.getUint32(offset+42, true);
    var name = new TextDecoder().decode(new Uint8Array(buf, offset+46, nameLen));
    var sheetMatch = /^xl\/worksheets\/sheet(\d+)\.xml$/.exec(name);
    /* numeric comparison, not the previous alphabetical Object.keys().sort()
       -- "sheet10.xml" sorts before "sheet2.xml" as a STRING, which used to
       pick the wrong sheet on any workbook with 10+ sheets */
    var wanted = name === "xl/sharedStrings.xml" ? "sharedStrings" : (sheetMatch && +sheetMatch[1] < sheetNum) ? "sheet" : null;
    if(wanted && view.getUint32(localOffset, true) === 0x04034b50){
      var lhNameLen = view.getUint16(localOffset+26, true), lhExtraLen = view.getUint16(localOffset+28, true);
      var compBytes = new Uint8Array(buf, localOffset+30+lhNameLen+lhExtraLen, size);
      var raw = method === 0 ? compBytes : method === 8 ? await inflateRaw(compBytes) : null;
      if(raw){
        parts[wanted] = new TextDecoder().decode(raw);
        if(wanted === "sheet") sheetNum = +sheetMatch[1];
      }
    }
    offset += 46 + nameLen + extraLen + commentLen;
  }
  return parts;
}
function parseSharedStrings(xmlText){
  if(!xmlText) return [];
  var siNodes = new DOMParser().parseFromString(xmlText, "application/xml").getElementsByTagName("si");
  return Array.from(siNodes, function(si){
    return Array.from(si.getElementsByTagName("t"), function(t){ return t.textContent; }).join("");
  });
}
function parseSheetToRows(xmlText, sharedStrings){
  var rowNodes = new DOMParser().parseFromString(xmlText, "application/xml").getElementsByTagName("row");
  return Array.from(rowNodes, function(rowNode){
    var row = [];
    Array.from(rowNode.getElementsByTagName("c")).forEach(function(cell, c){
      var ref = cell.getAttribute("r");
      var idx = ref ? colLetterToIndex(ref) : c;
      var type = cell.getAttribute("t"), value;
      if(type === "inlineStr"){
        var isNode = cell.getElementsByTagName("is")[0];
        value = isNode ? Array.from(isNode.getElementsByTagName("t"), function(t){ return t.textContent; }).join("") : "";
      } else {
        var vNode = cell.getElementsByTagName("v")[0];
        var raw = vNode ? vNode.textContent : "";
        value = type === "s" ? (sharedStrings[+raw] || "") : raw;
      }
      while(row.length < idx) row.push("");
      row[idx] = value;
    });
    return row;
  });
}
async function parseXLSX(arrayBuffer){
  var parts = await readXlsxParts(arrayBuffer);
  if(!parts.sheet) throw new Error("Inget kalkylblad hittades i denna .xlsx-fil");
  return parseSheetToRows(parts.sheet, parseSharedStrings(parts.sharedStrings));
}

/* ---------------- rows -> contacts (shared by CSV and XLSX) ---------------- */
function headerIndex(headers, names){
  for(var i=0;i<headers.length;i++){
    var h = String(headers[i]||"").trim().toLowerCase();
    if(names.indexOf(h) !== -1) return i;
  }
  return -1;
}
function rowsToContacts(rows, sourceId){
  if(!rows.length) return [];
  var headers = rows[0];
  var idx = {};
  Object.keys(IMPORT_HEADER_ALIASES).forEach(function(k){ idx[k] = headerIndex(headers, IMPORT_HEADER_ALIASES[k]); });
  var out = [];
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    var get = function(i){ return i===-1 || row[i]==null ? "" : String(row[i]).trim(); };
    var name = get(idx.name) || (get(idx.firstName) + " " + get(idx.lastName)).trim();
    if(!name) continue;
    out.push({
      id:state.nextContactId++, sourceId:sourceId,
      name:name, department:get(idx.department), phone:get(idx.phone), phone2:get(idx.phone2),
      label1:get(idx.label1), label2:get(idx.label2), email:get(idx.email)
    });
  }
  return out;
}

/* a blank spacer row -- not a real imported contact, so it has no
   sourceId/department and never appears in state.contacts; dragged out of
   the group panel's own always-present tile via the same clone-on-drop
   "template" mechanism a multi-use source's contacts use (see
   wireDragStart's template payload), so every drag creates a fresh
   instance instead of moving a single shared one around. */
function emptyRowTemplate(){
  return { name:"", department:"", phone:"", phone2:"", label1:"", label2:"", email:"", isEmptyRow:true };
}

/* ---------------- page generation ---------------- */
/* auto-chunks contacts into pages using DEFAULT_LAYOUT. Each page keeps
   its own contacts snapshot, so changing one page's layout later doesn't
   reshuffle any other page. */
function blankPage(layout, contacts){
  return { layout:layout, contacts:contacts||[], emptyMode:"blank", image:null, headerColor:"#000000" };
}
/* packs contacts into as few `capacity`-sized bins as possible WITHOUT
   splitting a department across two, unless the department itself is
   bigger than one page (then it's chunked into capacity-sized pieces --
   there's no way around that). This is First Fit Decreasing, a standard
   bin-packing heuristic: sort the items (each a whole department, or one
   chunk of an oversized one) largest-first, and place each into the
   first bin it still fits in, opening a new bin only when none do.
   FFD is not always mathematically optimal, but it's simple, it never
   pointlessly splits a group that fits somewhere whole, and it matches
   what was actually asked for: prefer leaving empty rows on a page over
   splitting a department across two, and use as few pages as it can
   while keeping that rule. Plain sequential/list-order chunking (the
   previous behavior) ignored department boundaries entirely. */
function packContactsIntoPages(contacts, capacity){
  if(capacity <= 0) return [];
  var items = [];
  groupContactsBySourceAndDepartment(contacts).forEach(function(g){
    if(g.contacts.length <= capacity){
      items.push(g.contacts.slice());
    } else {
      for(var i=0;i<g.contacts.length;i+=capacity){
        items.push(g.contacts.slice(i, i+capacity));
      }
    }
  });
  /* largest first; a stable sort keeps same-size items in their original
     (first-appearance) order instead of shuffling ties arbitrarily */
  items.sort(function(a,b){ return b.length - a.length; });
  var bins = [];
  items.forEach(function(item){
    var bin = bins.find(function(b){ return b.used + item.length <= capacity; });
    if(!bin){ bin = { used:0, contacts:[] }; bins.push(bin); }
    bin.contacts = bin.contacts.concat(item);
    bin.used += item.length;
  });
  return bins.map(function(b){ return b.contacts; });
}

/* every source not flagged multi-use -- a multi-use source (generic
   support numbers, and the like) is meant to be dragged out by hand
   wherever it's needed, potentially more than once, so it never takes
   part in the automatic distribution below. */
function populatableContacts(){
  var multiUseIds = new Set(state.sources.filter(function(s){ return s.multiUse; }).map(function(s){ return s.id; }));
  return state.contacts.filter(function(c){ return !multiUseIds.has(c.sourceId); });
}
function regeneratePages(){
  var capacity = layoutRows(DEFAULT_LAYOUT);
  state.pages = packContactsIntoPages(populatableContacts(), capacity).map(function(c){ return blankPage(DEFAULT_LAYOUT, c); });
}

/* called after a page's own layout changes (its capacity may have shrunk,
   or it may have become "empty" with capacity 0). Any contacts that no
   longer fit are cascaded forward into the following pages in order, each
   re-sliced against its OWN layout's capacity, so nothing is ever silently
   dropped from print. An existing "empty" page downstream is left alone
   (it may be a deliberately placed divider or custom image, not filler)
   -- overflow reaching one, or the end of the list, becomes new page(s)
   appended at the very end instead of disturbing anything in between. */
function reflowFromPage(index){
  var page = state.pages[index];
  if(!page) return;
  var carry = page.contacts.length > layoutRows(page.layout) ? page.contacts.splice(layoutRows(page.layout)) : [];
  var idx = index + 1;
  while(carry.length){
    var next = state.pages[idx];
    if(!next || next.layout === "empty"){
      /* not page.layout -- if the page being emptied is itself the last
         page, that would resolve right back to "empty" and re-lose the
         data it's supposed to rescue. Use the same default content layout
         regeneratePages() would pick for brand-new pages instead. */
      var newCap = layoutRows(DEFAULT_LAYOUT) || carry.length;
      state.pages.push(blankPage(DEFAULT_LAYOUT, carry.splice(0, newCap)));
      continue;
    }
    var merged = carry.concat(next.contacts);
    var nextCap = layoutRows(next.layout);
    next.contacts = merged.slice(0, nextCap);
    carry = merged.slice(nextCap);
    idx++;
  }
}

/* ---------------- file drop handling ---------------- */
/* every file dropped becomes its own source in the group panel's pool
   (state.sources), and its contacts are ADDED to the existing roster
   rather than replacing it -- so a second/third file's numbers show up
   alongside the first's instead of wiping it out, each kept in its own
   section so a department name repeated across files is never merged
   with another file's (see groupContactsBySourceAndDepartment). Only the
   very first file dropped auto-fills the pages, matching the previous
   single-file behavior; anything dropped after that just joins the pool
   until "Fördela" (see renderGroupPanel) is clicked to redo the automatic
   distribution across everything collected so far. */
async function handleFile(file){
  try{
    var rows;
    if(/\.xlsx$/i.test(file.name)){
      rows = await parseXLSX(await file.arrayBuffer());
    } else {
      rows = parseCSV(await file.text());
    }
    var sourceId = "src" + (state.nextSourceId++);
    var contacts = rowsToContacts(rows, sourceId);
    if(!contacts.length){ setStatus("Inga kontakter hittades i \""+file.name+"\" (behöver en Namn-kolumn)"); return; }
    var firstImport = state.sources.length === 0;
    state.sources.push({ id:sourceId, name:file.name, multiUse:false });
    state.contacts = state.contacts.concat(sortContacts(contacts));
    if(firstImport){
      state.currentPage = 0;
      regeneratePages();
      setStatus(contacts.length + " kontakter inlästa från " + file.name);
    } else {
      setStatus(contacts.length + " kontakter tillagda från " + file.name + " -- klicka \"Fördela\" för att fylla sidorna med allt");
    }
    renderViewer();
  } catch(err){
    setStatus("Kunde inte läsa \""+file.name+"\": " + err.message);
  }
}
async function handleFiles(files){
  for(var i=0;i<files.length;i++){ await handleFile(files[i]); }
}
function setStatus(text){ $("#dataStatus").textContent = text; }

/* true for a real file drag (dataTransfer always advertises the "Files"
   type for these, even in the chat/web-attachment case below where the
   actual File object turns out to be unreadable) -- false for the group
   panel's own internal drag-and-drop (a custom MIME type, never "Files"),
   so dragging a group chip around never triggers the big file-drop
   overlay or the "no file" status message meant for real file drops. */
function isFileDrag(e){
  return !!(e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf("Files") !== -1);
}

function setupDropZone(){
  var counter = 0;
  /* capture:true so this always sees the event first, even if some native
     control (an <input>/<select> under the cursor) would otherwise handle
     drag/drop itself before it bubbles back up to window */
  var opts = { capture:true };
  window.addEventListener("dragenter", function(e){
    if(!isFileDrag(e)) return;
    e.preventDefault(); counter++; $("#dropOverlay").hidden = false;
  }, opts);
  window.addEventListener("dragover", function(e){ e.preventDefault(); }, opts);
  window.addEventListener("dragleave", function(e){
    if(!isFileDrag(e)) return;
    e.preventDefault(); counter=Math.max(0,counter-1); if(counter===0) $("#dropOverlay").hidden = true;
  }, opts);
  window.addEventListener("drop", function(e){
    if(!isFileDrag(e)) return;
    e.preventDefault();
    counter = 0;
    $("#dropOverlay").hidden = true;
    var dt = e.dataTransfer;
    var files = dt && dt.files;
    if(!files || !files.length){
      setStatus("Släppet innehöll ingen fil som webbläsaren kunde läsa -- om du drog den från en chatt-/webbilaga, spara den till disk först och dra den från filhanteraren istället.");
      return;
    }
    handleFiles(files);
  }, opts);
}

/* ---------------- contact field formatting ---------------- */
function truncateText(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  var lo = 0, hi = text.length;
  while(lo < hi){
    var mid = (lo+hi+1) >> 1;
    if(ctx.measureText(text.slice(0,mid)+".").width <= maxWidth) lo = mid; else hi = mid-1;
  }
  return lo <= 0 ? "." : text.slice(0, lo) + ".";
}

/* card header's dept summary: every department always appears, full name
   if there's room ("Finance HR IT Production"); if not, all of them get
   cut down to the same shared character cap -- the largest cap that still
   fits everyone -- rather than truncating one at a time and dropping the
   rest behind a count ("Fina HR IT Prod" instead of "Fina., HR, IT,." or
   "IT · Finance +2"). Names already shorter than the cap are left alone,
   so short department names like "HR" never get cut. ctx.font must already
   be set to the header font before calling this. */
function buildDeptSummary(ctx, contacts, maxWidth){
  var names = collectDeptNames(contacts);
  if(!names.length) return "";
  var full = names.join(" ");
  if(ctx.measureText(full).width <= maxWidth) return full;

  function joinedAtCap(cap){
    return names.map(function(n){ return n.length > cap ? n.slice(0, cap) : n; }).join(" ");
  }
  var maxLen = names.reduce(function(m, n){ return Math.max(m, n.length); }, 1);
  var lo = 1, hi = maxLen, best = 1;
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    if(ctx.measureText(joinedAtCap(mid)).width <= maxWidth){ best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  /* even every name cut to a single letter can theoretically still overflow
     with enough departments -- truncateText is the last-resort safety net
     that guarantees the header never overflows its own width */
  return truncateText(ctx, joinedAtCap(best), maxWidth);
}

/* shared by both row-column formatters below: plain character cap with a
   dot-truncate marker, no pixel measurement involved (unlike truncateText,
   which measures actual rendered width against a canvas font). One extra
   character over the cap is let through untouched -- "Marke" fits in a
   4-char department column just as well as "Mark" would've -- so the dot
   only appears once a string actually needs cutting, at maxChars+1. */
function capChars(s, maxChars){
  return s.length > maxChars + 1 ? s.slice(0, maxChars) + "." : s;
}

/* department column: keep a leading chief marker ("C "/"C." etc) outside the
   character budget, cap the rest at DEPT_MAX_CHARS, dot-truncate if cut */
function formatDeptForRow(dept){
  var d = (dept||"").trim();
  var m = /^(c\.?)\s+(.*)$/i.exec(d);
  var prefix = "", base = d;
  if(m){ prefix = m[1] + " "; base = m[2]; }
  return prefix + capChars(base, DEPT_MAX_CHARS);
}

/* number-type label column (Work/Home/Mobile/...): plain character cap,
   no chief-prefix handling needed */
function formatLabelForRow(label){
  return capChars((label||"").trim(), LABEL_MAX_CHARS);
}

/* XXX-XXX XX XX for a 10-digit number, XXX-XX XX XX for 9 digits; anything
   else has no defined grouping and is left as entered. Numbers never carry
   a country-code prefix and never exceed 10 digits. */
function formatPhoneNumber(raw){
  var digits = (raw||"").replace(/\D/g, "");
  if(digits.length === 10){
    return digits.slice(0,3)+"-"+digits.slice(3,6)+" "+digits.slice(6,8)+" "+digits.slice(8,10);
  }
  if(digits.length === 9){
    return digits.slice(0,3)+"-"+digits.slice(3,5)+" "+digits.slice(5,7)+" "+digits.slice(7,9);
  }
  return digits || (raw||"").trim();
}

/* v10 line 2's 2a box (its wide/custom field) is a per-page choice
   (pageState.line2Mode), not auto-detected -- see the Line 2 select in
   buildPageControls (its options show these labels directly, with no
   "Rad 2:" prefix -- the select's title attribute carries that context
   instead). 2b (contact.phone2Label) and 2c (phone2) are ordinary fields,
   independent of line2Mode -- every mode carries the same six boxes (see
   layoutDoubleRowColumns):
     "email"      -- always the email field (blank if there isn't one)
     "empty"      -- always blank, and not editable (no field backs it)
     "username"   -- always label2, repurposed here as a free-text handle/
                     username rather than a phone-type tag; independent of
                     label1, which still tags phone1 on line 1 as always
     "department" -- the contact's department/group, same field v20 shows
                     (v10 otherwise never shows department -- showDept is
                     false for its LAYOUTS entry -- so this is the only way
                     to surface it on a v10 card)
   Shared by drawCard and getEditableRegions so a click always edits
   whichever field is actually on screen. */
var LINE2_MODES = { email:"E-post", empty:"Tom", username:"Användarnamn", department:"Grupp" };
function pickLine2Field(contact, mode){
  if(mode === "empty") return { key:null, value:"" };
  if(mode === "username") return { key:"label2", value:(contact.label2 || "").trim() };
  if(mode === "department") return { key:"department", value:(contact.department || "").trim() };
  return { key:"email", value:(contact.email || "").trim() };
}

/* ---------------- column layout (shared by drawing and click hit-testing) ---------------- */
/* the phone column is always exactly wide enough for the 10-digit grouped
   format -- that's the longest a number can ever be, so there's nothing to
   measure per-dataset. Cached per PHONE_FONT_PT since it only depends on
   the debug-panel font size, not on the loaded contacts. */
var _phoneWidthCache = { pt:null, width:0 };
function maxFormattedPhoneWidth(ctx, dpi){
  if(_phoneWidthCache.pt === PHONE_FONT_PT) return _phoneWidthCache.width;
  ctx.font = ptToPx(PHONE_FONT_PT, dpi) + "px " + FONT_FAMILY;
  var w = ctx.measureText("000-000 00 00").width;
  _phoneWidthCache = { pt:PHONE_FONT_PT, width:w };
  return w;
}

/* the "middle" column (department, or a number-type label) is sized to
   its own worst-case capped content, not a share of the row -- it's the
   least important field, so it gets only as much room as it needs */
function measureMiddleColWidth(ctx, dpi, fontPt, maxChars, hasChiefPrefix, allowOneOver){
  ctx.font = ptToPx(fontPt, dpi) + "px " + FONT_FAMILY;
  var prefix = hasChiefPrefix ? "C " : "";
  var capped = ctx.measureText(prefix + "0".repeat(maxChars) + ".").width;
  if(!allowOneOver) return capped;
  /* content run through capChars can also be one character over the cap,
     shown in full with no dot (see capChars) -- make sure the column is
     wide enough for that case too, whichever measures wider */
  var fits = ctx.measureText(prefix + "0".repeat(maxChars + 1)).width;
  return Math.max(capped, fits);
}

/* name gets all the width the phone column and (if shown) the middle
   column don't need. The department-to-phone gap is narrower than the
   other gaps (department is the least important field), handing the
   difference back to name. */
function layoutRowColumns(ctx, wPx, dpi, layout){
  var pad = mmToPx(CELL_PADDING_MM, dpi);
  var gap = pad/2;
  ctx.font = ptToPx(DEPT_FONT_PT, dpi) + "px " + FONT_FAMILY;
  var deptCharW = ctx.measureText("0").width; /* one extra character of breathing room before the phone column */
  var deptPhoneGap = gap * 0.5 + deptCharW;
  var phoneW = maxFormattedPhoneWidth(ctx, dpi) + pad*0.5;
  var phoneCount = layout.phones;
  var middleW = layout.showDept ? (measureMiddleColWidth(ctx, dpi, DEPT_FONT_PT, DEPT_MAX_CHARS, true, true) + pad*0.5) : 0;
  var totalGaps = layout.showDept ? (gap + deptPhoneGap) : gap;
  var nameW = Math.max(0, wPx - pad*2 - phoneW*phoneCount - middleW - totalGaps);

  var cols = [];
  var x = pad;
  var nameFontPt = layout.showDept ? NAME_FONT_PT_TIGHT : NAME_FONT_PT;
  cols.push({ x:x, w:nameW, pt:nameFontPt, key:"name" }); x += nameW + gap;
  if(layout.showDept){
    /* stays physically between name and phone, but right-aligned so its
       text hugs the phone column (visually grouped with it) instead of
       sitting flush against the gap after name */
    cols.push({ x:x, w:middleW, pt:DEPT_FONT_PT, key:"department", align:"right" }); x += middleW + deptPhoneGap;
  }
  cols.push({ x:x, w:phoneW, pt:PHONE_FONT_PT, key:"phone" });
  return cols;
}

/* the 10-contact double-row layout, six boxes per contact:
     line 1: 1a name          | 1b label1 (phone1's type tag) | 1c phone1
     line 2: 2a custom field  | 2b phone2Label                | 2c phone2
   (2a's value depends on pageState.line2Mode -- see pickLine2Field --
   but 2b/2c are ordinary fields regardless of it, same as 1b/1c always
   are). A label column (1b/2b) only actually earns its keep when that
   ROW's own label has text -- a contact with no phone2Label, say, gets
   its 2a field drawn the full width up to phone2 instead of reserving a
   column for a label that isn't there. Since that's a per-contact,
   per-render decision (not a fixed per-card one), this returns BOTH
   column sets for each line -- "Normal" (3 boxes, label shown) and
   "Wide" (2 boxes, label-less) -- and drawCard/getEditableRegions pick
   between them per row, per line, based on that row's own data.

   showNumbers (pageState.showNumbers -- an optional per-page toggle)
   reserves a small gutter at the very left, ahead of every other column
   on both lines, for an optional running contact number (see drawCard) --
   it isn't a column here since it's drawn once per CONTACT (vertically
   centered across both its lines), not once per line, but every other
   column still needs to shift right to make room for it, on both lines.
   Its own padding (numberPad) is tighter than a normal cell's and equal
   on both sides of it -- between the card's own left edge and the number,
   and between the number and the name -- so the gutter costs the name as
   little width as possible instead of the number's box and the gap after
   it adding up to more than the number itself really needs. */
function layoutDoubleRowColumns(ctx, wPx, dpi, showNumbers){
  var pad = mmToPx(CELL_PADDING_MM, dpi);
  var gap = pad/2;
  var phoneW = maxFormattedPhoneWidth(ctx, dpi) + pad*0.5;
  var middleW = measureMiddleColWidth(ctx, dpi, DEPT_FONT_PT, LABEL_MAX_CHARS, false, true) + pad*0.5;
  /* "10." is the widest a v10 row number ever gets (capacity is fixed at
     ROWS_V10) -- allowOneOver is false here since row numbers are drawn
     directly, never routed through capChars's one-over forgiveness */
  var numberPad = pad * 0.15;
  var numberW = showNumbers ? measureMiddleColWidth(ctx, dpi, DEPT_FONT_PT, 2, false, false) + numberPad*2 : 0;
  var x0 = showNumbers ? numberW + numberPad : pad;

  var narrowW = Math.max(0, wPx - x0 - pad - phoneW - middleW - gap*2);
  var wideW = Math.max(0, wPx - x0 - pad - phoneW - gap);

  function normalCols(fontPt){
    var x = x0;
    var wide = { x:x, w:narrowW, pt:fontPt }; x += narrowW + gap;
    var mid = { x:x, w:middleW, pt:DEPT_FONT_PT }; x += middleW + gap;
    return [wide, mid, { x:x, w:phoneW, pt:PHONE_FONT_PT }];
  }
  function wideCols(fontPt){
    return [{ x:x0, w:wideW, pt:fontPt }, { x:x0 + wideW + gap, w:phoneW, pt:PHONE_FONT_PT }];
  }

  return {
    numberW: numberW,
    line1Normal: normalCols(NAME_FONT_PT),
    line1Wide: wideCols(NAME_FONT_PT),
    line2Normal: normalCols(EMAIL_FONT_PT),
    line2Wide: wideCols(EMAIL_FONT_PT)
  };
}

/* ---------------- card drawing ---------------- */
/* shared by every straight line drawn on a card or page: row dividers,
   crop-mark guides. Caller sets strokeStyle/lineWidth first. */
function strokeLine(ctx, x1, y1, x2, y2){
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

/* the plain white-filled, black-bordered card rectangle every card starts
   from -- a real card before its header/rows go on top, or an empty-grid
   outline standing in for one */
function fillCardBase(ctx, xPx, yPx, wPx, hPx, dpi){
  ctx.fillStyle = "#fff";
  ctx.fillRect(xPx, yPx, wPx, hPx);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = Math.max(1, mmToPx(BORDER_WIDTH_MM, dpi));
  ctx.strokeRect(xPx+0.5, yPx+0.5, wPx-1, hPx-1);
}

/* draws one printed line from a positional (not keyed) column layout --
   used for both flat single-line rows and each line of a double-row card */
function drawGenericRow(ctx, xPx, rowTop, wPx, rowH, dpi, cols, values){
  ctx.save();
  ctx.beginPath();
  ctx.rect(xPx, rowTop, wPx, rowH);
  ctx.clip();
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#000";
  cols.forEach(function(col, i){
    ctx.font = ptToPx(col.pt, dpi) + "px " + FONT_FAMILY;
    var align = col.align || "left";
    ctx.textAlign = align;
    var text = truncateText(ctx, values[i]||"", col.w);
    var tx = align === "right" ? xPx + col.x + col.w : xPx + col.x;
    ctx.fillText(text, tx, rowTop + rowH/2);
  });
  ctx.restore();
}

function drawRowFields(ctx, xPx, rowTop, wPx, rowH, dpi, contact, layout){
  var cols = layoutRowColumns(ctx, wPx, dpi, layout);
  var values = cols.map(function(col){
    return col.key === "name" ? (contact.name||"")
      : col.key === "department" ? formatDeptForRow(contact.department)
      : formatPhoneNumber(contact[col.key]);
  });
  drawGenericRow(ctx, xPx, rowTop, wPx, rowH, dpi, cols, values);
}

function drawCard(ctx, xPx, yPx, wPx, hPx, contacts, dpi, layout, headerColor, legendOverride, line2Mode, showNumbers){
  ctx.save();
  fillCardBase(ctx, xPx, yPx, wPx, hPx, dpi);

  var headerH = computeHeaderH(hPx, layout);
  ctx.fillStyle = headerColor || "#000000";
  ctx.fillRect(xPx, yPx, wPx, headerH);
  ctx.font = ptToPx(HEADER_FONT_PT, dpi) + "px " + FONT_FAMILY;
  ctx.textBaseline = "middle";
  var pad = mmToPx(CELL_PADDING_MM, dpi);
  var dateStr = new Date().toISOString().slice(0,10);
  /* the date never changes length, so it only gets as much of the header
     as it actually needs -- the rest goes to the department list/title,
     which usually needs much more than half */
  var leftW = ctx.measureText(dateStr).width + pad*2;
  var rightW = wPx - leftW;

  ctx.save();
  ctx.beginPath(); ctx.rect(xPx, yPx, leftW, headerH); ctx.clip();
  ctx.fillStyle = "#fff";
  ctx.textAlign = "left";
  ctx.fillText(dateStr, xPx+pad, yPx+headerH/2);
  ctx.restore();

  /* the header's right side is always editable (see getEditableRegions) --
     a custom legendOverride wins outright on any layout; otherwise a
     department-showing card falls back to the auto-built summary and
     everything else falls back to its layout's default legend, if any */
  var headerRightText = legendOverride ? legendOverride
    : layout.showDept ? buildDeptSummary(ctx, contacts, rightW-pad)
    : (layout.phoneRowLegend || "");
  if(headerRightText){
    ctx.save();
    ctx.beginPath(); ctx.rect(xPx+leftW, yPx, rightW, headerH); ctx.clip();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(truncateText(ctx, headerRightText, rightW-pad), xPx+wPx-pad, yPx+headerH/2);
    ctx.restore();
  }

  var bodyY = yPx+headerH, bodyH = hPx-headerH;
  var capacity = layoutRows(layout.key);
  var lineInset = mmToPx(DIVIDER_INSET_MM, dpi);

  function divider(y){
    ctx.strokeStyle = "rgba(0,0,0,"+DIVIDER_ALPHA+")";
    ctx.lineWidth = Math.max(1, mmToPx(DIVIDER_WIDTH_MM, dpi));
    strokeLine(ctx, xPx+lineInset, y, xPx+wPx-lineInset, y);
  }

  if(layout.doubleRow){
    var subRowH = bodyH / (capacity*2);
    var colSet = layoutDoubleRowColumns(ctx, wPx, dpi, showNumbers);
    for(var i=0;i<capacity;i++){
      var top1 = bodyY + subRowH*2*i;
      var top2 = top1 + subRowH;
      if(i>0) divider(top1);
      var c = contacts[i];
      if(!c) continue;
      if(showNumbers){
        /* one number per CONTACT, not per line -- vertically centered
           across both of its lines, i.e. exactly on the boundary between
           them (top1 + subRowH), not tied to either line's own baseline */
        ctx.save();
        ctx.font = ptToPx(DEPT_FONT_PT, dpi) + "px " + FONT_FAMILY;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000";
        ctx.fillText((i+1) + ".", xPx + colSet.numberW/2, top1 + subRowH);
        ctx.restore();
      }
      /* 1b/2b only actually get a column when THIS contact's own label
         has text -- see layoutDoubleRowColumns -- so 1a/2a can use the
         width a blank label doesn't need instead of leaving it empty. */
      var label1 = formatLabelForRow(c.label1);
      var cols1 = label1 ? colSet.line1Normal : colSet.line1Wide;
      var values1 = label1 ? [c.name, label1, formatPhoneNumber(c.phone)] : [c.name, formatPhoneNumber(c.phone)];
      drawGenericRow(ctx, xPx, top1, wPx, subRowH, dpi, cols1, values1);

      var label2 = formatLabelForRow(c.phone2Label);
      var cols2 = label2 ? colSet.line2Normal : colSet.line2Wide;
      var custom2 = pickLine2Field(c, line2Mode).value;
      var values2 = label2 ? [custom2, label2, formatPhoneNumber(c.phone2)] : [custom2, formatPhoneNumber(c.phone2)];
      drawGenericRow(ctx, xPx, top2, wPx, subRowH, dpi, cols2, values2);
    }
  } else {
    var rowH = bodyH / capacity;
    for(var j=0;j<capacity;j++){
      var rowTop = bodyY + rowH*j;
      if(j>0) divider(rowTop);
      var contact = contacts[j];
      if(!contact) continue;
      drawRowFields(ctx, xPx, rowTop, wPx, rowH, dpi, contact, layout);
    }
  }
  ctx.restore();
}

/* word-wraps onto as many lines as needed -- on a full print-sized canvas
   this text always fit on one line, but the same message now also has to
   fit a single small card-sized preview canvas */
function drawCenteredMessage(ctx, w, h, text){
  ctx.save();
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "#ccc"; ctx.lineWidth = 2; ctx.strokeRect(1,1,w-2,h-2);
  ctx.fillStyle = "#999";
  ctx.font = Math.max(12, Math.round(w*0.045)) + "px " + FONT_FAMILY;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  var maxW = w * 0.88;
  var lines = [], line = "";
  text.split(" ").forEach(function(word){
    var attempt = line ? line + " " + word : word;
    if(line && ctx.measureText(attempt).width > maxW){ lines.push(line); line = word; }
    else line = attempt;
  });
  lines.push(line);
  var lineH = parseInt(ctx.font, 10) * 1.3;
  var startY = h/2 - (lines.length-1)*lineH/2;
  lines.forEach(function(l, i){ ctx.fillText(l, w/2, startY + i*lineH); });
  ctx.restore();
}

/* faint graph-paper grid filling a blank card's interior, GRID_SPACING_MM
   apart in both directions -- without this, "Tomt rutnät" ("empty grid")
   was just a bordered blank rectangle, indistinguishable in kind from
   "Tom" (truly blank) and not actually a grid at all. */
function drawEmptyGrid(ctx, xPx, yPx, wPx, hPx, dpi){
  var inset = mmToPx(GRID_INSET_MM, dpi);
  var step = mmToPx(GRID_SPACING_MM, dpi);
  ctx.save();
  ctx.strokeStyle = "rgba(0,0,0," + GRID_ALPHA + ")";
  ctx.lineWidth = Math.max(1, mmToPx(DIVIDER_WIDTH_MM, dpi));
  var left = xPx+inset, right = xPx+wPx-inset, top = yPx+inset, bottom = yPx+hPx-inset;
  for(var x=left+step; x<right; x+=step) strokeLine(ctx, x, top, x, bottom);
  for(var y=top+step; y<bottom; y+=step) strokeLine(ctx, left, y, right, y);
  ctx.restore();
}

function drawEmptyCardOutline(ctx, xPx, yPx, wPx, hPx, dpi){
  ctx.save();
  fillCardBase(ctx, xPx, yPx, wPx, hPx, dpi);
  drawEmptyGrid(ctx, xPx, yPx, wPx, hPx, dpi);
  ctx.restore();
}

/* short cut-guides at each corner of the card block, extending straight out
   to the paper edge (same weight as the card border) -- lets you trim the
   outer margin off with straightedge cuts before separating the cards
   themselves along their own printed borders */
function drawCropMarks(ctx, pageWpx, pageHpx, blockX, blockY, blockW, blockH, dpi){
  ctx.save();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = Math.max(1, mmToPx(BORDER_WIDTH_MM, dpi));
  var right = blockX + blockW, bottom = blockY + blockH;
  function line(x1,y1,x2,y2){ strokeLine(ctx, x1, y1, x2, y2); }
  line(0, blockY, blockX, blockY);           line(blockX, 0, blockX, blockY);
  line(right, blockY, pageWpx, blockY);      line(right, 0, right, blockY);
  line(0, bottom, blockX, bottom);           line(blockX, bottom, blockX, pageHpx);
  line(right, bottom, pageWpx, bottom);      line(right, bottom, right, pageHpx);
  ctx.restore();
}

/* fully empty / bordered-grid / custom-image variants of the filler page.
   `preview` (the on-screen viewer, as opposed to print) shows just one
   blank card outline in "rows" mode instead of the whole tiled sheet --
   every card slot looks identical, so one is all there is to see. */
/* draws pageState.image into a wPx x hPx box, honoring two independent
   per-page choices:
     imageFit      -- "contain" (default): scaled uniformly to fit inside
                       the box, keeping proportions, same as before this
                       was made a choice at all. "stretch": scaled to
                       exactly fill the box on both axes, proportions not
                       kept.
                     -- imageRotation -- 0/90/180/270 (degrees, clockwise).
   Rotating swaps which of the image's own width/height fits against the
   box's width vs height (a 90/270 turn makes a landscape photo fit a
   portrait card the way you'd expect) -- see fitW/fitH below. The image
   is always drawn using its own natural pixel size scaled to drawW/drawH
   in a frame rotated around the box's center, so the math is identical
   for every rotation, 0 included. */
function drawEmptyImage(ctx, wPx, hPx, pageState){
  var img = pageState.image;
  var rotation = ((pageState.imageRotation||0) % 360 + 360) % 360;
  var swapped = rotation === 90 || rotation === 270;
  var fitW = swapped ? hPx : wPx, fitH = swapped ? wPx : hPx;
  var drawW, drawH;
  if(pageState.imageFit === "stretch"){
    drawW = fitW; drawH = fitH;
  } else {
    var scale = Math.min(fitW/img.width, fitH/img.height);
    drawW = img.width*scale; drawH = img.height*scale;
  }
  ctx.save();
  ctx.translate(wPx/2, hPx/2);
  ctx.rotate(rotation * Math.PI/180);
  ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
  ctx.restore();
}

function drawEmptyPageContent(ctx, wPx, hPx, geo, pageState, preview){
  if(pageState.emptyMode === "image" && pageState.image){
    drawEmptyImage(ctx, wPx, hPx, pageState);
    return;
  }
  if(pageState.emptyMode === "rows"){
    if(preview){
      drawEmptyCardOutline(ctx, 0, 0, wPx, hPx, RENDER_DPI);
      return;
    }
    var grid = geo.grid;
    if(grid.count <= 0) return;
    var blockWmm = grid.cols*geo.cardDims.w, blockHmm = grid.rows*geo.cardDims.h;
    var origin = blockOriginMm(geo.pageDims, blockWmm, blockHmm);
    var startXmm = origin.x, startYmm = origin.y;
    for(var i=0;i<grid.count;i++){
      var col = i%grid.cols, row = Math.floor(i/grid.cols);
      var xPx = mmToPx(startXmm+col*geo.cardDims.w, RENDER_DPI);
      var yPx = mmToPx(startYmm+row*geo.cardDims.h, RENDER_DPI);
      var wPxCard = mmToPx(geo.cardDims.w, RENDER_DPI), hPxCard = mmToPx(geo.cardDims.h, RENDER_DPI);
      drawEmptyCardOutline(ctx, xPx, yPx, wPxCard, hPxCard, RENDER_DPI);
    }
    drawCropMarks(ctx, wPx, hPx, mmToPx(startXmm,RENDER_DPI), mmToPx(startYmm,RENDER_DPI), mmToPx(blockWmm,RENDER_DPI), mmToPx(blockHmm,RENDER_DPI), RENDER_DPI);
    return;
  }
  /* "blank": nothing further -- caller already filled white */
}

function totalPagesCount(){ return state.pages.length || 1; }

/* `preview` (the on-screen viewer) draws exactly one copy of the card at
   its own size -- every copy on a printed sheet is identical (see
   contactsForPage), so one is all there is to see while editing. Print
   (preview omitted) still renders the full sheet tiled with grid.count
   copies, unchanged. */
function renderCardsOntoCanvas(canvas, pageIndex, preview){
  var pageState = state.pages[pageIndex];
  var layoutKey = pageState ? pageState.layout : "v20";
  var geo = pageGeometryForIndex(pageIndex);
  var dims = preview ? geo.cardDims : geo.pageDims;
  canvas.width = Math.round(mmToPx(dims.w, RENDER_DPI));
  canvas.height = Math.round(mmToPx(dims.h, RENDER_DPI));
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(!pageState){
    drawCenteredMessage(ctx, canvas.width, canvas.height, "Släpp en CSV- eller XLSX-fil för att börja");
    return;
  }
  if(layoutKey === "empty"){
    drawEmptyPageContent(ctx, canvas.width, canvas.height, geo, pageState, preview);
    return;
  }
  var cardContacts = contactsForPage(pageState);

  if(preview){
    drawCard(ctx, 0, 0, canvas.width, canvas.height, cardContacts, RENDER_DPI, geo.layout, pageState.headerColor, pageState.headerLegend, pageState.line2Mode, pageState.showNumbers);
    return;
  }
  if(geo.grid.count <= 0){
    drawCenteredMessage(ctx, canvas.width, canvas.height, "Korten får inte plats på sidan med nuvarande storleks-/marginalinställningar");
    return;
  }

  var blockWmm = geo.grid.cols * geo.cardDims.w;
  var blockHmm = geo.grid.rows * geo.cardDims.h;
  var origin = blockOriginMm(dims, blockWmm, blockHmm);
  var startXmm = origin.x, startYmm = origin.y;

  for(var i=0;i<geo.grid.count;i++){
    var col = i % geo.grid.cols, row = Math.floor(i / geo.grid.cols);
    var xPx = mmToPx(startXmm + col*geo.cardDims.w, RENDER_DPI);
    var yPx = mmToPx(startYmm + row*geo.cardDims.h, RENDER_DPI);
    var wPx = mmToPx(geo.cardDims.w, RENDER_DPI);
    var hPx = mmToPx(geo.cardDims.h, RENDER_DPI);
    drawCard(ctx, xPx, yPx, wPx, hPx, cardContacts, RENDER_DPI, geo.layout, pageState.headerColor, pageState.headerLegend, pageState.line2Mode, pageState.showNumbers);
  }
  drawCropMarks(ctx, canvas.width, canvas.height, mmToPx(startXmm,RENDER_DPI), mmToPx(startYmm,RENDER_DPI), mmToPx(blockWmm,RENDER_DPI), mmToPx(blockHmm,RENDER_DPI), RENDER_DPI);
}

/* ---------------- click-to-edit ---------------- */
/* every editable field's box within ONE card, relative to that card's own
   top-left corner -- shared by both drawing (implicitly, via the same
   column-layout functions) and click hit-testing */
function getEditableRegions(ctx, wPx, hPx, dpi, layout, contacts, line2Mode, showNumbers){
  var regions = [];
  var headerH = computeHeaderH(hPx, layout);
  var bodyY = headerH, bodyH = hPx - headerH;
  var capacity = layoutRows(layout.key);
  /* the right side of the header is always free text -- a department-
     showing card defaults to the auto-built summary, v10 defaults to a
     legend (phoneRowLegend), but both are editable the same way.
     Page-level field (contactIndex:-1), not tied to any one contact.
     Matches drawCard's leftW/rightW split
     exactly (the date only claims as much width as it needs). */
  ctx.font = ptToPx(HEADER_FONT_PT, dpi) + "px " + FONT_FAMILY;
  var dateW = ctx.measureText(new Date().toISOString().slice(0,10)).width + mmToPx(CELL_PADDING_MM, dpi)*2;
  regions.push({ contactIndex:-1, field:"headerLegend", x:dateW, y:0, w:wPx-dateW, h:headerH, pt:HEADER_FONT_PT });
  if(layout.doubleRow){
    var subRowH = bodyH / (capacity*2);
    var colSet = layoutDoubleRowColumns(ctx, wPx, dpi, showNumbers);
    for(var i=0;i<capacity;i++){
      var top1 = bodyY + subRowH*2*i, top2 = top1 + subRowH;
      var contact = contacts && contacts[i];
      /* must match drawCard's own per-row Normal/Wide choice exactly, so
         a click always edits whichever field is actually on screen */
      var hasLabel1 = contact && formatLabelForRow(contact.label1);
      var cols1 = hasLabel1 ? colSet.line1Normal : colSet.line1Wide;
      var fields1 = hasLabel1 ? ["name","label1","phone"] : ["name","phone"];
      cols1.forEach(function(col, ci){ regions.push({ contactIndex:i, field:fields1[ci], x:col.x, y:top1, w:col.w, h:subRowH, pt:col.pt }); });

      /* 2a's field depends on the page's line2Mode (see pickLine2Field) --
         "empty" mode has no field backing it, so that column isn't
         clickable at all (nothing to edit into). */
      var hasLabel2 = contact && formatLabelForRow(contact.phone2Label);
      var cols2 = hasLabel2 ? colSet.line2Normal : colSet.line2Wide;
      var wideKey = contact ? pickLine2Field(contact, line2Mode).key : "email";
      var fields2 = hasLabel2 ? [wideKey, "phone2Label", "phone2"] : [wideKey, "phone2"];
      cols2.forEach(function(col, ci){
        if(fields2[ci] == null) return;
        regions.push({ contactIndex:i, field:fields2[ci], x:col.x, y:top2, w:col.w, h:subRowH, pt:col.pt });
      });
    }
  } else {
    var rowH = bodyH / capacity;
    var cols2 = layoutRowColumns(ctx, wPx, dpi, layout);
    for(var j=0;j<capacity;j++){
      var top = bodyY + rowH*j;
      cols2.forEach(function(col){ regions.push({ contactIndex:j, field:col.key, x:col.x, y:top, w:col.w, h:rowH, pt:col.pt }); });
    }
  }
  return regions;
}

function openEditOverlay(pageEl, target, field, left, top, width, height, initialValue, fontPx){
  var existing = pageEl.querySelector(".editOverlayInput");
  if(existing) existing.remove();
  var input = document.createElement("input");
  input.className = "editOverlayInput";
  input.type = "text";
  input.value = initialValue != null ? initialValue : (target[field] || "");
  input.style.position = "absolute";
  input.style.left = left + "px";
  input.style.top = top + "px";
  input.style.width = Math.max(width, 50) + "px";
  input.style.height = Math.max(height, 16) + "px";
  input.style.fontFamily = FONT_FAMILY;
  input.style.fontSize = (fontPx || 12) + "px";
  input.style.zIndex = "10";
  input.style.border = "2px solid #0080ff";
  input.style.padding = "0 2px";
  input.style.boxSizing = "border-box";
  var committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    target[field] = input.value.trim();
    input.remove();
    renderViewer();
  }
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
    else if(e.key === "Escape"){ e.preventDefault(); committed = true; input.remove(); }
  });
  pageEl.appendChild(input);
  input.focus();
  input.select();
}

/* the viewer canvas always shows exactly one card now (see
   renderCardsOntoCanvas's preview mode), so a click maps straight into
   card-relative coordinates -- no grid/block math needed to figure out
   which of several tiled copies was clicked. */
function onCanvasClick(e, canvas, pageIndex){
  var pageState = state.pages[pageIndex];
  if(!pageState || pageState.layout === "empty") return;
  var geo = pageGeometryForIndex(pageIndex);

  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  var xInCard = (e.clientX - rect.left) * scaleX, yInCard = (e.clientY - rect.top) * scaleY;
  var cardWpx = canvas.width, cardHpx = canvas.height;

  var ctx = canvas.getContext("2d");
  var cardContacts = contactsForPage(pageState);
  var regions = getEditableRegions(ctx, cardWpx, cardHpx, RENDER_DPI, geo.layout, cardContacts, pageState.line2Mode, pageState.showNumbers);
  var hit = regions.find(function(r){ return xInCard>=r.x && xInCard<r.x+r.w && yInCard>=r.y && yInCard<r.y+r.h; });
  if(!hit) return;

  var target, initialValue;
  if(hit.contactIndex === -1){
    /* page-level field (the header legend), not tied to a contact -- an
       empty/never-set override means "no custom text yet", so editing
       starts from whatever's actually showing (the auto dept summary, or
       the layout's default legend) instead of a blank box */
    target = pageState;
    initialValue = pageState.headerLegend
      ? pageState.headerLegend
      : (geo.layout.showDept ? collectDeptNames(cardContacts).join(" ") : (geo.layout.phoneRowLegend || ""));
  } else {
    target = cardContacts[hit.contactIndex];
    if(!target) return;
    initialValue = null;
  }

  var cssScale = rect.width / canvas.width;
  /* the input's font must match the exact size the field is drawn at on
     the card -- ptToPx converts the field's own point size to canvas-
     internal pixels at RENDER_DPI, then cssScale shrinks that down the
     same way the canvas itself is displayed smaller than its internal
     resolution. Editing then looks like typing directly into the card,
     not a differently-sized text box floating over it. */
  var fontPx = ptToPx(hit.pt, RENDER_DPI) * cssScale;
  openEditOverlay(canvas.parentElement, target, hit.field,
    hit.x*cssScale, hit.y*cssScale, hit.w*cssScale, hit.h*cssScale, initialValue, fontPx);
}

/* ---------------- print ---------------- */
/* CSS @page can only declare one physical size for the whole print job,
   so mixed page orientations/sizes across pages print using the first
   page's size -- a real limitation of print CSS, not something this app
   can route around. Each canvas still gets its own correct mm CSS size. */
/* prefer a named CSS paper size ("A4", "A4 landscape") over raw mm
   dimensions when they match one of PAPER_SIZES -- many printer drivers
   only reliably recognize the standard keyword form for @page size and
