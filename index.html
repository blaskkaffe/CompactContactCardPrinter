<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compact Contact Card Printer</title>
<style>
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; font:14px/1.4 Arial, sans-serif; background:#e6e6e6; color:#111; display:flex; flex-direction:column;}

header.toolbar{flex:0 0 auto; background:#1c1c1c; color:#fff; padding:8px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
header.toolbar h1{font-size:15px; margin:0 14px 0 0;}
header.toolbar button, header.toolbar select, header.toolbar input{font-size:12px; padding:4px 8px; border-radius:4px; border:1px solid #888; background:#fff; cursor:pointer;}
header.toolbar button:hover{background:#eee;}
header.toolbar button.active{background:#333; color:#fff;}
#pageIndicator{font-size:12px; min-width:90px; text-align:center;}
.spacer{flex:1 1 auto;}
label.tool{display:flex; gap:4px; align-items:center; font-size:12px;}
#dataStatus{font-size:12px; color:#ccc;}
#gridInfo{font-size:12px; color:#ccc;}

/* holds the page viewer and the debug settings panel side by side */
#mainRow{flex:1 1 auto; display:flex; overflow:hidden;}

main#viewerWrap{flex:1 1 auto; position:relative; overflow:hidden; min-width:0;}
main#viewerWrap.mode-single{display:flex; align-items:center; justify-content:center;}
main#viewerWrap.mode-all{overflow-y:auto; padding:24px 0;}

.pagesAll{display:grid; grid-template-columns:1fr; gap:24px; max-width:min(520px, 94vw); margin:0 auto;}
@media (min-width:1280px){
  .pagesAll{grid-template-columns:repeat(2, 1fr); max-width:min(1064px, 94vw);}
}

.page{background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.4); position:relative; flex:0 0 auto;}
.mode-all .page{width:100%; aspect-ratio:var(--ratio);}
.page canvas{display:block; width:100%; height:100%;}

.pageLabel{position:absolute; top:6px; left:8px; font-size:11px; color:#999; pointer-events:none; z-index:1;}
.pageControls{position:absolute; top:4px; right:4px; z-index:2; display:flex; flex-direction:column; gap:2px; align-items:flex-end;}
.pageControls select, .pageControls input{font-size:10px; padding:1px 3px;}

#dropOverlay{position:fixed; inset:0; background:rgba(20,20,20,.75); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; z-index:1000; pointer-events:none;}
#dropOverlay[hidden]{display:none;}

#printArea{display:none;}
@media print{
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important;}
  #printArea canvas{display:block; page-break-after:always;}
}

/* ===================== DEBUG PANEL (temporary -- see initDebugPanel) ===================== */
#debugPanel{flex:0 0 220px; background:#222; color:#eee; overflow-y:auto; padding:10px; font-size:12px; border-left:1px solid #000;}
#debugPanel h2{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#f90; margin:0 0 8px;}
#debugPanel .row{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px;}
#debugPanel input{width:70px; font-size:12px; padding:2px 4px;}
/* ===================== END DEBUG PANEL ===================== */

/* ===================== GROUP PANEL (department grouping helper) ===================== */
#groupPanel{flex:0 0 240px; background:#f0f0f0; color:#111; overflow-y:auto; padding:10px; font-size:12px; border-right:1px solid #bbb;}
#groupPanel h2{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#555; margin:0 0 8px;}
#groupPanel .groupRow{background:#fff; border:1px solid #ccc; border-radius:4px; padding:6px 8px; margin-bottom:6px;}
#groupPanel .groupTitle{display:flex; justify-content:space-between; font-weight:bold; margin-bottom:4px;}
#groupPanel .groupAdd{display:flex; gap:4px; align-items:center;}
#groupPanel .groupAdd input{width:40px; font-size:11px; padding:2px 3px;}
#groupPanel .groupAdd button{font-size:11px; padding:2px 6px; cursor:pointer;}
#groupPanel .pageSlots{list-style:none; margin:0; padding:0;}
#groupPanel .pageSlots li{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #ddd;}
#groupPanel .pageSlots li.full{color:#a00;}
#groupPanel .emptyNote{color:#777; font-style:italic;}
/* ===================== END GROUP PANEL ===================== */
</style>
<style id="pageSizeStyle"></style>
</head>
<body>

<header class="toolbar">
  <h1>Compact Contact Card Printer</h1>

  <label class="tool">Paper:
    <select id="paperSize"></select>
  </label>
  <button id="cardOrientationBtn"></button>
  <button id="viewModeBtn"></button>

  <label class="tool">Card w(mm): <input type="number" id="cardWmm" min="10" max="200" step="0.01" style="width:60px;"></label>
  <label class="tool">Card h(mm): <input type="number" id="cardHmm" min="10" max="300" step="0.01" style="width:60px;"></label>
  <label class="tool">Margin(mm): <input type="number" id="marginMm" min="0" max="50" step="1" style="width:50px;"></label>
  <span id="gridInfo"></span>

  <div class="spacer"></div>

  <span id="dataStatus">Drop a CSV or XLSX file to begin</span>

  <button id="prevBtn">&larr; Prev</button>
  <span id="pageIndicator"></span>
  <button id="nextBtn">Next &rarr;</button>
  <button id="printBtn">Print</button>
</header>

<div id="mainRow">
  <!-- GROUP PANEL: department groups + manual page-assignment helper -->
  <aside id="groupPanel"></aside>
  <main id="viewerWrap"></main>
  <!-- DEBUG PANEL (temporary, remove this whole <aside> + initDebugPanel() + its CSS block to drop the feature) -->
  <aside id="debugPanel"></aside>
</div>
<div id="dropOverlay" hidden>Drop CSV or XLSX file to import contacts</div>
<div id="printArea"></div>

<script>
(function(){
"use strict";

/* ================= layout types ================= */
/* row counts are separate mutable vars (not baked into LAYOUTS) so the
   debug panel can tune them live */
var ROWS_V20 = 20;
var ROWS_V10 = 10;
var ROWS_H2 = 12;
function layoutRows(key){
  if(key === "v20") return ROWS_V20;
  if(key === "v10") return ROWS_V10;
  if(key === "h2") return ROWS_H2;
  return 0;
}
/* v10 is 10 CONTACTS, each spanning two printed lines:
     line 1: name | label1 (number type, e.g. "Work") | phone1
     line 2: email | label2                            | phone2
   layoutRows("v10") is the contact count (10), not the printed line count. */
var LAYOUTS = {
  v20:   { key:"v20",   label:"20-row vertical",              orientation:"vertical",   phones:1, showDept:true,  doubleRow:false },
  v10:   { key:"v10",   label:"10-contact vertical (2 lines)", orientation:"vertical",   phones:2, showDept:false, doubleRow:true, phoneRowLegend:"Work / Home" },
  h2:    { key:"h2",    label:"2-number horizontal",           orientation:"horizontal", phones:2, showDept:false, doubleRow:false },
  empty: { key:"empty", label:"Empty page",                    orientation:"vertical",   phones:0, showDept:false, doubleRow:false }
};

/* header background presets -- all verified >=8:1 WCAG contrast ratio
   against white text (see commit notes), so white header text always
   reads clearly against any of them */
var COLOR_PRESETS = [
  { name:"Black",        hex:"#000000" },
  { name:"Charcoal",     hex:"#2B2B2B" },
  { name:"Slate Gray",   hex:"#37474F" },
  { name:"Navy",         hex:"#001F54" },
  { name:"Dark Blue",    hex:"#0B3D91" },
  { name:"Indigo",       hex:"#2E1A47" },
  { name:"Dark Purple",  hex:"#4A148C" },
  { name:"Dark Magenta", hex:"#6A1B4D" },
  { name:"Dark Red",     hex:"#8B0000" },
  { name:"Maroon",       hex:"#6B0F1A" },
  { name:"Dark Brown",   hex:"#3E2723" },
  { name:"Dark Olive",   hex:"#4B5320" },
  { name:"Forest Green", hex:"#14432A" },
  { name:"Dark Teal",    hex:"#01414D" },
  { name:"Dark Cyan",    hex:"#004D4D" }
];

/* ================= paper / page geometry ================= */
var PAPER_SIZES = {
  A4: { label:"A4", wMM:210, hMM:297 }
};
var RENDER_DPI = 150;

var state = {
  paperSize: "A4",
  cardOrientation: "vertical", /* default orientation used when auto-generating NEW pages */
  viewMode: "single",          /* "single" | "all" */
  currentPage: 0,              /* 0-indexed */
  cardWmm: 53.98,              /* exact ISO/IEC 7810 ID-1 credit card -- always the VERTICAL shape */
  cardHmm: 85.60,
  marginMm: 10,                /* printer-unsafe border to keep clear on every edge */
  contacts: [],
  pages: []                    /* [{layout, contacts, emptyMode, image}] -- one entry per generated page */
};

function $(sel){ return document.querySelector(sel); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ e.appendChild(c); });
  return e;
}

function cardDimsForOrientation(orientation){
  return orientation === "horizontal"
    ? { w: state.cardHmm, h: state.cardWmm }
    : { w: state.cardWmm, h: state.cardHmm };
}

/* how many cards fit edge-to-edge on a page of the given size, once the
   printer-safe margin is removed from every side */
function gridForDims(pageDims, cardDims){
  var usableW = pageDims.w - 2*state.marginMm;
  var usableH = pageDims.h - 2*state.marginMm;
  var cols = Math.max(0, Math.floor(usableW / cardDims.w));
  var rows = Math.max(0, Math.floor(usableH / cardDims.h));
  return { cols:cols, rows:rows, count:cols*rows };
}

/* the card orientation is chosen per-page (via that page's layout); the
   PAGE orientation is whichever of portrait/landscape fits the most of
   that card shape -- it is never chosen directly by the user */
function pickPageOrientation(cardDims){
  var p = PAPER_SIZES[state.paperSize];
  var portrait = { w:p.wMM, h:p.hMM, name:"portrait" };
  if(p.wMM === p.hMM) return portrait;
  var landscape = { w:p.hMM, h:p.wMM, name:"landscape" };
  return gridForDims(landscape, cardDims).count > gridForDims(portrait, cardDims).count ? landscape : portrait;
}

/* full geometry for one page, given its layout key */
function pageGeometry(layoutKey){
  var layout = LAYOUTS[layoutKey] || LAYOUTS.v20;
  var cardDims = cardDimsForOrientation(layout.orientation);
  var pageDims = pickPageOrientation(cardDims);
  var grid = gridForDims(pageDims, cardDims);
  return { layout:layout, cardDims:cardDims, pageDims:pageDims, grid:grid };
}

/* pages are printed double-sided, so page 0+1, 2+3, ... are the front/back
   of one physical sheet and must share its exact size. An "empty" page
   borrows its geometry (card size, page orientation, grid) from its
   partner so the pair always matches -- only when both sides of a pair
   are empty does it fall back to the layout's own default orientation. */
function partnerPageIndex(index){ return index % 2 === 0 ? index + 1 : index - 1; }

function pageGeometryForIndex(index){
  var pageState = state.pages[index];
  var layoutKey = pageState ? pageState.layout : "v20";
  var geoSourceKey = layoutKey;
  if(layoutKey === "empty"){
    var partner = state.pages[partnerPageIndex(index)];
    if(partner && partner.layout !== "empty") geoSourceKey = partner.layout;
  }
  var geo = pageGeometry(geoSourceKey);
  return { layout:LAYOUTS[layoutKey], cardDims:geo.cardDims, pageDims:geo.pageDims, grid:geo.grid };
}

/* ================= contact sorting (alphabetical, chief dept first) ================= */
function isChiefDept(dept){ return /^c\.?\s+/i.test((dept||"").trim()); }
function deptGroupKey(dept){ return (dept||"").trim().replace(/^c\.?\s+/i,"").toLowerCase(); }
function sortContacts(list){
  return list.slice().sort(function(a,b){
    var gk = deptGroupKey(a.department).localeCompare(deptGroupKey(b.department));
    if(gk!==0) return gk;
    var ca = isChiefDept(a.department), cb = isChiefDept(b.department);
    if(ca!==cb) return ca ? -1 : 1;
    return (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"});
  });
}

/* ================= CSV parsing ================= */
function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field=""; }
      else if(c === "\n" || c === "\r"){
        if(c === "\r" && text[i+1] === "\n") i++;
        row.push(field); field=""; rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r[0]||"").trim()!==""; });
}

/* ================= XLSX parsing (no libraries: native unzip + XML) ================= */
function colLetterToIndex(ref){
  var m = /^([A-Z]+)/i.exec(ref);
  if(!m) return 0;
  var letters = m[1].toUpperCase(), idx = 0;
  for(var i=0;i<letters.length;i++) idx = idx*26 + (letters.charCodeAt(i)-64);
  return idx-1;
}

async function inflateRaw(bytes){
  var ds = new DecompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZipXmlEntries(buf){
  var view = new DataView(buf);
  var len = buf.byteLength;
  var eocdOffset = -1;
  var scanFrom = Math.max(0, len - 65557);
  for(var i=len-22; i>=scanFrom; i--){
    if(view.getUint32(i, true) === 0x06054b50){ eocdOffset = i; break; }
  }
  if(eocdOffset === -1) throw new Error("Not a valid .xlsx (zip) file");
  var totalEntries = view.getUint16(eocdOffset+10, true);
  var offset = view.getUint32(eocdOffset+16, true);

  var entries = [];
  for(var e=0; e<totalEntries; e++){
    if(view.getUint32(offset, true) !== 0x02014b50) break;
    var compressionMethod = view.getUint16(offset+10, true);
    var compressedSize = view.getUint32(offset+20, true);
    var fileNameLen = view.getUint16(offset+28, true);
    var extraLen = view.getUint16(offset+30, true);
    var commentLen = view.getUint16(offset+32, true);
    var localHeaderOffset = view.getUint32(offset+42, true);
    var name = new TextDecoder("utf-8").decode(new Uint8Array(buf, offset+46, fileNameLen));
    entries.push({ name:name, compressionMethod:compressionMethod, compressedSize:compressedSize, localHeaderOffset:localHeaderOffset });
    offset += 46 + fileNameLen + extraLen + commentLen;
  }

  var result = {};
  for(var k=0;k<entries.length;k++){
    var info = entries[k];
    if(!/\.xml$/.test(info.name)) continue;
    var lh = info.localHeaderOffset;
    if(view.getUint32(lh, true) !== 0x04034b50) continue;
    var lhNameLen = view.getUint16(lh+26, true);
    var lhExtraLen = view.getUint16(lh+28, true);
    var dataStart = lh + 30 + lhNameLen + lhExtraLen;
    var compBytes = new Uint8Array(buf, dataStart, info.compressedSize);
    var outBytes;
    if(info.compressionMethod === 0) outBytes = compBytes;
    else if(info.compressionMethod === 8) outBytes = await inflateRaw(compBytes);
    else continue;
    result[info.name] = new TextDecoder("utf-8").decode(outBytes);
  }
  return result;
}

function parseSharedStrings(xmlText){
  if(!xmlText) return [];
  var doc = new DOMParser().parseFromString(xmlText, "application/xml");
  var siNodes = doc.getElementsByTagName("si");
  var out = [];
  for(var i=0;i<siNodes.length;i++){
    var texts = siNodes[i].getElementsByTagName("t");
    var s = "";
    for(var j=0;j<texts.length;j++) s += texts[j].textContent;
    out.push(s);
  }
  return out;
}

function parseSheetToRows(xmlText, sharedStrings){
  var doc = new DOMParser().parseFromString(xmlText, "application/xml");
  var rowNodes = doc.getElementsByTagName("row");
  var rows = [];
  for(var r=0;r<rowNodes.length;r++){
    var cellNodes = rowNodes[r].getElementsByTagName("c");
    var rowArr = [];
    for(var c=0;c<cellNodes.length;c++){
      var cell = cellNodes[c];
      var ref = cell.getAttribute("r") || "";
      var idx = ref ? colLetterToIndex(ref) : c;
      var type = cell.getAttribute("t");
      var value = "";
      if(type === "inlineStr"){
        var isNode = cell.getElementsByTagName("is")[0];
        if(isNode){
          var ts = isNode.getElementsByTagName("t");
          for(var t=0;t<ts.length;t++) value += ts[t].textContent;
        }
      } else {
        var vNode = cell.getElementsByTagName("v")[0];
        var raw = vNode ? vNode.textContent : "";
        value = (type === "s") ? (sharedStrings[parseInt(raw,10)] || "") : raw;
      }
      while(rowArr.length < idx) rowArr.push("");
      rowArr[idx] = value;
    }
    rows.push(rowArr);
  }
  return rows;
}

async function parseXLSX(arrayBuffer){
  var xmlByName = await readZipXmlEntries(arrayBuffer);
  var sheetName = Object.keys(xmlByName).sort().find(function(n){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); });
  if(!sheetName) throw new Error("No worksheet found in this .xlsx file");
  var sharedStrings = parseSharedStrings(xmlByName["xl/sharedStrings.xml"]);
  return parseSheetToRows(xmlByName[sheetName], sharedStrings);
}

/* ================= rows -> contacts (shared by CSV and XLSX) ================= */
function headerIndex(headers, names){
  for(var i=0;i<headers.length;i++){
    var h = String(headers[i]||"").trim().toLowerCase();
    if(names.indexOf(h) !== -1) return i;
  }
  return -1;
}
function rowsToContacts(rows){
  if(!rows.length) return [];
  var headers = rows[0];
  var idx = {
    name: headerIndex(headers, ["name","full name","fullname"]),
    firstName: headerIndex(headers, ["first name","firstname","first"]),
    lastName: headerIndex(headers, ["last name","lastname","last","surname"]),
    department: headerIndex(headers, ["department","dept"]),
    phone: headerIndex(headers, ["phone","number","phone1","phone 1"]),
    phone2: headerIndex(headers, ["phone2","phone 2"]),
    label1: headerIndex(headers, ["label1","label 1","type1","type 1","number type"]),
    label2: headerIndex(headers, ["label2","label 2","type2","type 2"]),
    email: headerIndex(headers, ["email","e-mail"])
  };
  var out = [];
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    var get = function(i){ return i===-1 || row[i]==null ? "" : String(row[i]).trim(); };
    var name = get(idx.name);
    if(!name){
      name = (get(idx.firstName) + " " + get(idx.lastName)).trim();
    }
    if(!name) continue;
    out.push({
      name:name, department:get(idx.department), phone:get(idx.phone), phone2:get(idx.phone2),
      label1:get(idx.label1), label2:get(idx.label2), email:get(idx.email)
    });
  }
  return out;
}

/* ================= page generation ================= */
/* auto-chunks contacts sequentially into pages using the current default
   orientation's layout, padded to an even count with a blank page. Each
   page keeps its own contacts snapshot, so changing one page's layout
   later doesn't reshuffle any other page. */
function regeneratePages(){
  var defaultLayout = state.cardOrientation === "horizontal" ? "h2" : "v20";
  var capacity = layoutRows(defaultLayout);
  var pages = [];
  if(capacity > 0){
    for(var i=0;i<state.contacts.length;i+=capacity){
      pages.push({ layout:defaultLayout, contacts:state.contacts.slice(i,i+capacity), emptyMode:"blank", image:null, headerColor:"#000000" });
    }
  }
  if(pages.length && pages.length % 2 !== 0){
    pages.push({ layout:"empty", emptyMode:"rows", contacts:[], image:null, headerColor:"#000000" });
  }
  state.pages = pages;
}

/* called after a page's own layout changes (its capacity may have shrunk,
   or it may have become "empty" with capacity 0). Any contacts that no
   longer fit are cascaded forward into the following pages in order, each
   re-sliced against its OWN layout's capacity, so nothing is ever silently
   dropped from print. An existing "empty" page downstream is left alone
   (it may be a deliberately placed divider or custom image, not filler)
   -- overflow reaching one, or the end of the list, becomes new page(s)
   appended at the very end instead of disturbing anything in between. */
function reflowFromPage(index){
  var page = state.pages[index];
  if(!page) return;
  var carry = page.contacts.length > layoutRows(page.layout) ? page.contacts.splice(layoutRows(page.layout)) : [];
  var idx = index + 1;
  while(carry.length){
    var next = state.pages[idx];
    if(!next || next.layout === "empty"){
      /* not page.layout -- if the page being emptied is itself the last
         page, that would resolve right back to "empty" and re-lose the
         data it's supposed to rescue. Use the same default content layout
         regeneratePages() would pick for brand-new pages instead. */
      var fallbackLayout = state.cardOrientation === "horizontal" ? "h2" : "v20";
      var newCap = layoutRows(fallbackLayout) || carry.length;
      state.pages.push({ layout:fallbackLayout, contacts:carry.splice(0, newCap), emptyMode:"blank", image:null, headerColor:"#000000" });
      continue;
    }
    var merged = carry.concat(next.contacts);
    var nextCap = layoutRows(next.layout);
    next.contacts = merged.slice(0, nextCap);
    carry = merged.slice(nextCap);
    idx++;
  }
  if(state.pages.length % 2 !== 0){
    state.pages.push({ layout:"empty", emptyMode:"rows", contacts:[], image:null, headerColor:"#000000" });
  }
}

/* ================= department grouping helper (sidebar) ================= */
/* state.contacts is already grouped contiguously by department (sortContacts
   groups by deptGroupKey first), so this only needs one pass collecting
   consecutive runs -- no separate grouping/sorting logic to keep in sync. */
function deptDisplayLabel(dept){ return (dept||"").trim().replace(/^c\.?\s+/i, "") || "(no department)"; }
function computeDepartmentGroups(){
  var groups = [];
  var current = null;
  state.contacts.forEach(function(c){
    var key = deptGroupKey(c.department);
    if(!current || current.key !== key){
      current = { key:key, label:deptDisplayLabel(c.department), contacts:[] };
      groups.push(current);
    }
    current.contacts.push(c);
  });
  return groups;
}

/* appends a whole department group onto the given 1-indexed page, creating
   pages up to that index if needed, then reuses the existing overflow
   cascade (reflowFromPage) so nothing is ever dropped if it doesn't fit --
   the same guarantee a manual layout-capacity change already gets. */
function addGroupToPage(group, pageNumber){
  var index = pageNumber - 1;
  if(index < 0) return;
  var defaultLayout = state.cardOrientation === "horizontal" ? "h2" : "v20";
  while(state.pages.length <= index){
    state.pages.push({ layout:defaultLayout, contacts:[], emptyMode:"blank", image:null, headerColor:"#000000" });
  }
  var target = state.pages[index];
  if(target.layout === "empty"){
    target.layout = defaultLayout;
    target.savedContacts = null;
  }
  target.contacts = target.contacts.concat(group.contacts);
  reflowFromPage(index);
  renderViewer();
}

function renderGroupPanel(){
  var panel = $("#groupPanel");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Department groups" }));

  if(!state.contacts.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"Import a CSV/XLSX to see groups here." }));
    return;
  }

  var clearBtn = el("button", { type:"button", text:"Clear pages, group manually", style:"width:100%; margin-bottom:10px; font-size:11px; padding:4px;" });
  clearBtn.addEventListener("click", function(){
    state.pages = [];
    renderViewer();
  });
  panel.appendChild(clearBtn);

  computeDepartmentGroups().forEach(function(g){
    var row = el("div", { class:"groupRow" });
    row.appendChild(el("div", { class:"groupTitle", text:g.label + " (" + g.contacts.length + ")" }));
    var addRow = el("div", { class:"groupAdd" });
    addRow.appendChild(el("span", { text:"Page" }));
    var pageInput = document.createElement("input");
    pageInput.type = "number"; pageInput.min = "1"; pageInput.step = "1";
    pageInput.value = String(state.pages.length + 1); /* defaults to "next new page" for sequential one-group-per-page building */
    addRow.appendChild(pageInput);
    var addBtn = el("button", { type:"button", text:"Add" });
    addBtn.addEventListener("click", function(){
      var target = parseInt(pageInput.value, 10);
      if(!target || target < 1) return;
      addGroupToPage(g, target);
    });
    addRow.appendChild(addBtn);
    row.appendChild(addRow);
    panel.appendChild(row);
  });

  panel.appendChild(el("h2", { text:"Page slots", style:"margin-top:14px;" }));
  if(!state.pages.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"No pages yet." }));
    return;
  }
  var ul = el("ul", { class:"pageSlots" });
  state.pages.forEach(function(p, i){
    var li = document.createElement("li");
    if(p.layout === "empty"){
      li.textContent = "Page " + (i+1) + ": empty";
    } else {
      var cap = layoutRows(p.layout), used = p.contacts.length, free = Math.max(0, cap-used);
      li.textContent = "Page " + (i+1) + " (" + LAYOUTS[p.layout].label + "): " + used + "/" + cap + " used, " + free + " free";
      if(free === 0) li.className = "full";
    }
    ul.appendChild(li);
  });
  panel.appendChild(ul);
}

/* ================= file drop handling ================= */
async function handleFile(file){
  try{
    var rows;
    if(/\.xlsx$/i.test(file.name)){
      rows = await parseXLSX(await file.arrayBuffer());
    } else {
      rows = parseCSV(await file.text());
    }
    var contacts = rowsToContacts(rows);
    if(!contacts.length){ setStatus("No contacts found in \""+file.name+"\" (need a Name column)"); return; }
    state.contacts = sortContacts(contacts);
    state.currentPage = 0;
    regeneratePages();
    setStatus(state.contacts.length + " contacts loaded from " + file.name);
    renderViewer();
  } catch(err){
    setStatus("Could not read \""+file.name+"\": " + err.message);
  }
}
function setStatus(text){ $("#dataStatus").textContent = text; }

function setupDropZone(){
  var counter = 0;
  /* capture:true so this always sees the event first, even if some native
     control (an <input>/<select> under the cursor) would otherwise handle
     drag/drop itself before it bubbles back up to window */
  var opts = { capture:true };
  window.addEventListener("dragenter", function(e){ e.preventDefault(); counter++; $("#dropOverlay").hidden = false; }, opts);
  window.addEventListener("dragover", function(e){ e.preventDefault(); }, opts);
  window.addEventListener("dragleave", function(e){ e.preventDefault(); counter=Math.max(0,counter-1); if(counter===0) $("#dropOverlay").hidden = true; }, opts);
  window.addEventListener("drop", function(e){
    e.preventDefault();
    counter = 0;
    $("#dropOverlay").hidden = true;
    var dt = e.dataTransfer;
    var file = dt && dt.files && dt.files[0];
    if(!file){
      setStatus("That drop didn't carry a file the browser could read -- if you dragged it from a chat/web attachment, save it to disk first and drag it from your file manager instead.");
      return;
    }
    handleFile(file);
  }, opts);
}

/* ================= card + page canvas rendering ================= */
function mmToPx(mm, dpi){ return mm * dpi / 25.4; }
function ptToPx(pt, dpi){ return pt * dpi / 72; }

var FONT_FAMILY = '"Cascadia Code", "Cascadia Mono", monospace';
/* real prints came out at roughly half the intended physical size (a
   print-scaling issue outside this app's control), so sizes are set a
   bit above half of the originally-specified 16/12/12/11pt to match
   what actually ends up on paper. All adjustable live via the debug panel. */
var HEADER_FONT_PT = 9;
var NAME_FONT_PT = 7;
var PHONE_FONT_PT = 7;
var DEPT_FONT_PT = 6;
var DEPT_MAX_CHARS = 5; /* plus the "C " chief prefix, kept separately */
var LABEL_MAX_CHARS = 6; /* number-type tags on the 10-contact layout, e.g. "Work"/"Home" */
var EMAIL_FONT_PT = 7; /* the 10-contact layout's email line only -- independent of NAME_FONT_PT */

function truncateText(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  var lo = 0, hi = text.length;
  while(lo < hi){
    var mid = (lo+hi+1) >> 1;
    if(ctx.measureText(text.slice(0,mid)+".").width <= maxWidth) lo = mid; else hi = mid-1;
  }
  return lo <= 0 ? "." : text.slice(0, lo) + ".";
}

/* department column: keep a leading chief marker ("C "/"C./ etc) outside the
   character budget, cap the rest at DEPT_MAX_CHARS, dot-truncate if cut */
function formatDeptForRow(dept){
  var d = (dept||"").trim();
  var m = /^(c\.?)\s+(.*)$/i.exec(d);
  var prefix = "", base = d;
  if(m){ prefix = m[1] + " "; base = m[2]; }
  if(base.length > DEPT_MAX_CHARS) base = base.slice(0, DEPT_MAX_CHARS) + ".";
  return prefix + base;
}

/* number-type label column (Work/Home/Mobile/...): plain character cap,
   no chief-prefix handling needed */
function formatLabelForRow(label){
  var s = (label||"").trim();
  if(s.length > LABEL_MAX_CHARS) s = s.slice(0, LABEL_MAX_CHARS) + ".";
  return s;
}

/* XXX-XXX XX XX for a 10-digit number, XXX-XX XX XX for 9 digits; anything
   else has no defined grouping and is left as entered. Numbers never carry
   a country-code prefix and never exceed 10 digits. */
function formatPhoneNumber(raw){
  var digits = (raw||"").replace(/\D/g, "");
  if(digits.length === 10){
    return digits.slice(0,3)+"-"+digits.slice(3,6)+" "+digits.slice(6,8)+" "+digits.slice(8,10);
  }
  if(digits.length === 9){
    return digits.slice(0,3)+"-"+digits.slice(3,5)+" "+digits.slice(5,7)+" "+digits.slice(7,9);
  }
  return digits || (raw||"").trim();
}

/* the phone column is always exactly wide enough for the 10-digit grouped
   format -- that's the longest a number can ever be, so there's nothing to
   measure per-dataset. Cached per PHONE_FONT_PT since it only depends on
   the debug-panel font size, not on the loaded contacts. */
var _phoneWidthCache = { pt:null, width:0 };
function maxFormattedPhoneWidth(ctx, dpi){
  if(_phoneWidthCache.pt === PHONE_FONT_PT) return _phoneWidthCache.width;
  ctx.font = ptToPx(PHONE_FONT_PT, dpi) + "px " + FONT_FAMILY;
  var w = ctx.measureText("000-000 00 00").width;
  _phoneWidthCache = { pt:PHONE_FONT_PT, width:w };
  return w;
}

/* the "middle" column (department, or a number-type label) is sized to
   its own worst-case capped content, not a share of the row -- it's the
   least important field, so it gets only as much room as it needs */
function measureMiddleColWidth(ctx, dpi, fontPt, maxChars, hasChiefPrefix){
  ctx.font = ptToPx(fontPt, dpi) + "px " + FONT_FAMILY;
  var sample = (hasChiefPrefix ? "C " : "") + "0".repeat(maxChars) + ".";
  return ctx.measureText(sample).width;
}

/* name gets all the width the phone column(s) and (if shown) the middle
   column don't need; a 2-phone layout has no department column at all.
   The department-to-phone gap is narrower than the other gaps (department
   is the least important field), handing the difference back to name. */
function layoutRowColumns(ctx, wPx, dpi, layout){
  var pad = mmToPx(1.5, dpi);
  var gap = pad/2;
  var deptPhoneGap = gap * 0.5;
  var phoneW = maxFormattedPhoneWidth(ctx, dpi) + pad*0.5;
  var phoneCount = layout.phones;
  var middleW = layout.showDept ? (measureMiddleColWidth(ctx, dpi, DEPT_FONT_PT, DEPT_MAX_CHARS, true) + pad*0.5) : 0;
  var totalGaps = layout.showDept
    ? gap + deptPhoneGap + gap*(phoneCount-1)
    : gap*phoneCount;
  var nameW = Math.max(0, wPx - pad*2 - phoneW*phoneCount - middleW - totalGaps);

  var cols = [];
  var x = pad;
  cols.push({ x:x, w:nameW, pt:NAME_FONT_PT, key:"name" }); x += nameW + gap;
  if(layout.showDept){
    cols.push({ x:x, w:middleW, pt:DEPT_FONT_PT, key:"department" }); x += middleW + deptPhoneGap;
  }
  cols.push({ x:x, w:phoneW, pt:PHONE_FONT_PT, key:"phone" }); x += phoneW + gap;
  if(phoneCount === 2){
    cols.push({ x:x, w:phoneW, pt:PHONE_FONT_PT, key:"phone2" });
  }
  return cols;
}

/* the 10-contact double-row layout: line 1 (name/label1/phone1) keeps the
   small label column, but line 2 has no label of its own -- which number
   is "work" vs "home" is shown once, structurally, via the card's header
   legend (top row = phone1, bottom row = phone2), so line 2 hands that
   whole column back to the email address instead. */
function layoutDoubleRowColumns(ctx, wPx, dpi){
  var pad = mmToPx(1.5, dpi);
  var gap = pad/2;
  var phoneW = maxFormattedPhoneWidth(ctx, dpi) + pad*0.5;
  var middleW = measureMiddleColWidth(ctx, dpi, DEPT_FONT_PT, LABEL_MAX_CHARS, false) + pad*0.5;

  var nameW = Math.max(0, wPx - pad*2 - phoneW - middleW - gap*2);
  var x1 = pad;
  var name = { x:x1, w:nameW, pt:NAME_FONT_PT }; x1 += nameW + gap;
  var mid = { x:x1, w:middleW, pt:DEPT_FONT_PT }; x1 += middleW + gap;
  var phone1 = { x:x1, w:phoneW, pt:PHONE_FONT_PT };

  var emailW = Math.max(0, wPx - pad*2 - phoneW - gap);
  var x2 = pad;
  var email = { x:x2, w:emailW, pt:EMAIL_FONT_PT }; x2 += emailW + gap;
  var phone2 = { x:x2, w:phoneW, pt:PHONE_FONT_PT };

  return { line1:[name, mid, phone1], line2:[email, phone2] };
}

/* draws one printed line from a positional (not keyed) column layout --
   used for both flat single-line rows and each line of a double-row card */
function drawGenericRow(ctx, xPx, rowTop, wPx, rowH, dpi, cols, values){
  ctx.save();
  ctx.beginPath();
  ctx.rect(xPx, rowTop, wPx, rowH);
  ctx.clip();
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = "#000";
  cols.forEach(function(col, i){
    ctx.font = ptToPx(col.pt, dpi) + "px " + FONT_FAMILY;
    ctx.fillText(truncateText(ctx, values[i]||"", col.w), xPx + col.x, rowTop + rowH/2);
  });
  ctx.restore();
}

function drawRowFields(ctx, xPx, rowTop, wPx, rowH, dpi, contact, layout){
  var cols = layoutRowColumns(ctx, wPx, dpi, layout);
  var values = cols.map(function(col){
    return col.key === "name" ? (contact.name||"")
      : col.key === "department" ? formatDeptForRow(contact.department)
      : formatPhoneNumber(contact[col.key]);
  });
  drawGenericRow(ctx, xPx, rowTop, wPx, rowH, dpi, cols, values);
}

function drawCard(ctx, xPx, yPx, wPx, hPx, contacts, dpi, layout, headerColor, legendOverride){
  ctx.save();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(xPx, yPx, wPx, hPx);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = Math.max(1, mmToPx(0.3, dpi));
  ctx.strokeRect(xPx+0.5, yPx+0.5, wPx-1, hPx-1);

  var headerH = hPx * 0.1;
  ctx.fillStyle = headerColor || "#000000";
  ctx.fillRect(xPx, yPx, wPx, headerH);
  ctx.font = ptToPx(HEADER_FONT_PT, dpi) + "px " + FONT_FAMILY;
  ctx.textBaseline = "middle";
  var pad = mmToPx(1.5, dpi);
  var halfW = wPx*0.5;

  ctx.save();
  ctx.beginPath(); ctx.rect(xPx, yPx, halfW, headerH); ctx.clip();
  ctx.fillStyle = "#fff";
  ctx.textAlign = "left";
  ctx.fillText(truncateText(ctx, new Date().toISOString().slice(0,10), halfW-pad), xPx+pad, yPx+headerH/2);
  ctx.restore();

  if(layout.showDept){
    var depts = [];
    contacts.forEach(function(c){ if(c && c.department && depts.indexOf(c.department)===-1) depts.push(c.department); });
    ctx.save();
    ctx.beginPath(); ctx.rect(xPx+halfW, yPx, wPx-halfW, headerH); ctx.clip();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(truncateText(ctx, depts.join(", "), halfW-pad), xPx+wPx-pad, yPx+headerH/2);
    ctx.restore();
  } else if(legendOverride || layout.phoneRowLegend){
    ctx.save();
    ctx.beginPath(); ctx.rect(xPx+halfW, yPx, wPx-halfW, headerH); ctx.clip();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(truncateText(ctx, legendOverride || layout.phoneRowLegend, halfW-pad), xPx+wPx-pad, yPx+headerH/2);
    ctx.restore();
  }

  var bodyY = yPx+headerH, bodyH = hPx-headerH;
  var capacity = layoutRows(layout.key);
  var lineInset = mmToPx(2, dpi);

  function divider(y, alpha, widthMm){
    ctx.strokeStyle = "rgba(0,0,0,"+alpha+")";
    ctx.lineWidth = Math.max(1, mmToPx(widthMm, dpi));
    ctx.beginPath();
    ctx.moveTo(xPx+lineInset, y);
    ctx.lineTo(xPx+wPx-lineInset, y);
    ctx.stroke();
  }

  if(layout.doubleRow){
    var subRowH = bodyH / (capacity*2);
    var colSet = layoutDoubleRowColumns(ctx, wPx, dpi);
    for(var i=0;i<capacity;i++){
      var top1 = bodyY + subRowH*2*i;
      var top2 = top1 + subRowH;
      if(i>0) divider(top1, 0.5, 0.1);
      var c = contacts[i];
      if(!c) continue;
      drawGenericRow(ctx, xPx, top1, wPx, subRowH, dpi, colSet.line1, [c.name, formatLabelForRow(c.label1), formatPhoneNumber(c.phone)]);
      drawGenericRow(ctx, xPx, top2, wPx, subRowH, dpi, colSet.line2, [c.email, formatPhoneNumber(c.phone2)]);
    }
  } else {
    var rowH = bodyH / capacity;
    for(var j=0;j<capacity;j++){
      var rowTop = bodyY + rowH*j;
      if(j>0) divider(rowTop, 0.5, 0.1);
      var contact = contacts[j];
      if(!contact) continue;
      drawRowFields(ctx, xPx, rowTop, wPx, rowH, dpi, contact, layout);
    }
  }
  ctx.restore();
}

function drawCenteredMessage(ctx, w, h, text){
  ctx.save();
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "#ccc"; ctx.lineWidth = 2; ctx.strokeRect(1,1,w-2,h-2);
  ctx.fillStyle = "#999";
  ctx.font = Math.max(12, Math.round(w*0.045)) + "px " + FONT_FAMILY;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, w/2, h/2);
  ctx.restore();
}

function drawEmptyCardOutline(ctx, xPx, yPx, wPx, hPx, dpi){
  ctx.save();
  ctx.fillStyle = "#fff";
  ctx.fillRect(xPx, yPx, wPx, hPx);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = Math.max(1, mmToPx(0.3, dpi));
  ctx.strokeRect(xPx+0.5, yPx+0.5, wPx-1, hPx-1);
  ctx.restore();
}

/* short cut-guides at each corner of the card block, extending straight out
   to the paper edge (same weight as the card border) -- lets you trim the
   outer margin off with straightedge cuts before separating the cards
   themselves along their own printed borders */
function drawCropMarks(ctx, pageWpx, pageHpx, blockX, blockY, blockW, blockH, dpi){
  ctx.save();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = Math.max(1, mmToPx(0.3, dpi));
  var right = blockX + blockW, bottom = blockY + blockH;
  function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  line(0, blockY, blockX, blockY);           line(blockX, 0, blockX, blockY);
  line(right, blockY, pageWpx, blockY);      line(right, 0, right, blockY);
  line(0, bottom, blockX, bottom);           line(blockX, bottom, blockX, pageHpx);
  line(right, bottom, pageWpx, bottom);      line(right, bottom, right, pageHpx);
  ctx.restore();
}

/* fully empty / bordered-grid / custom-image variants of the filler page */
function drawEmptyPageContent(ctx, wPx, hPx, geo, pageState){
  if(pageState.emptyMode === "image" && pageState.image){
    var img = pageState.image;
    var scale = Math.min(wPx/img.width, hPx/img.height);
    var dw = img.width*scale, dh = img.height*scale;
    ctx.drawImage(img, (wPx-dw)/2, (hPx-dh)/2, dw, dh);
    return;
  }
  if(pageState.emptyMode === "rows"){
    var grid = geo.grid;
    if(grid.count <= 0) return;
    var blockWmm = grid.cols*geo.cardDims.w, blockHmm = grid.rows*geo.cardDims.h;
    var startXmm = (geo.pageDims.w-blockWmm)/2, startYmm = (geo.pageDims.h-blockHmm)/2;
    for(var i=0;i<grid.count;i++){
      var col = i%grid.cols, row = Math.floor(i/grid.cols);
      var xPx = mmToPx(startXmm+col*geo.cardDims.w, RENDER_DPI);
      var yPx = mmToPx(startYmm+row*geo.cardDims.h, RENDER_DPI);
      var wPxCard = mmToPx(geo.cardDims.w, RENDER_DPI), hPxCard = mmToPx(geo.cardDims.h, RENDER_DPI);
      drawEmptyCardOutline(ctx, xPx, yPx, wPxCard, hPxCard, RENDER_DPI);
    }
    drawCropMarks(ctx, wPx, hPx, mmToPx(startXmm,RENDER_DPI), mmToPx(startYmm,RENDER_DPI), mmToPx(blockWmm,RENDER_DPI), mmToPx(blockHmm,RENDER_DPI), RENDER_DPI);
    return;
  }
  /* "blank": nothing further -- caller already filled white */
}

function totalPagesCount(){ return state.pages.length || 1; }

function renderCardsOntoCanvas(canvas, pageIndex){
  var pageState = state.pages[pageIndex];
  var layoutKey = pageState ? pageState.layout : "v20";
  var geo = pageGeometryForIndex(pageIndex);
  var dims = geo.pageDims;
  canvas.width = Math.round(mmToPx(dims.w, RENDER_DPI));
  canvas.height = Math.round(mmToPx(dims.h, RENDER_DPI));
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(!pageState){
    drawCenteredMessage(ctx, canvas.width, canvas.height, "Drop a CSV or XLSX file to begin");
    return;
  }
  if(layoutKey === "empty"){
    drawEmptyPageContent(ctx, canvas.width, canvas.height, geo, pageState);
    return;
  }
  if(geo.grid.count <= 0){
    drawCenteredMessage(ctx, canvas.width, canvas.height, "Cards don't fit the page with the current size/margin settings");
    return;
  }

  var blockWmm = geo.grid.cols * geo.cardDims.w;
  var blockHmm = geo.grid.rows * geo.cardDims.h;
  var startXmm = (dims.w - blockWmm) / 2;
  var startYmm = (dims.h - blockHmm) / 2;

  for(var i=0;i<geo.grid.count;i++){
    var col = i % geo.grid.cols, row = Math.floor(i / geo.grid.cols);
    var xPx = mmToPx(startXmm + col*geo.cardDims.w, RENDER_DPI);
    var yPx = mmToPx(startYmm + row*geo.cardDims.h, RENDER_DPI);
    var wPx = mmToPx(geo.cardDims.w, RENDER_DPI);
    var hPx = mmToPx(geo.cardDims.h, RENDER_DPI);
    drawCard(ctx, xPx, yPx, wPx, hPx, pageState.contacts, RENDER_DPI, geo.layout, pageState.headerColor, pageState.headerLegend);
  }
  drawCropMarks(ctx, canvas.width, canvas.height, mmToPx(startXmm,RENDER_DPI), mmToPx(startYmm,RENDER_DPI), mmToPx(blockWmm,RENDER_DPI), mmToPx(blockHmm,RENDER_DPI), RENDER_DPI);
}

/* ================= page element + viewer (navigation/scroll/orientation) ================= */
function pageLayoutOptionsSelect(currentKey, onChange){
  var sel = document.createElement("select");
  ["v20","v10","h2","empty"].forEach(function(key){
    sel.appendChild(el("option", { value:key, text:LAYOUTS[key].label }));
  });
  sel.value = currentKey;
  sel.addEventListener("change", function(){ onChange(sel.value); });
  return sel;
}

/* per-page header color: 15 preset swatches (all pre-verified for good
   contrast with white text) plus a button revealing R/G/B number inputs
   for an arbitrary custom color -- contrast with white is the picker's
   own responsibility there, unlike the vetted presets */
function buildHeaderColorControls(pageState){
  var wrap = el("div", { style:"display:flex; gap:2px; align-items:center;" });

  var sel = document.createElement("select");
  COLOR_PRESETS.forEach(function(c){
    sel.appendChild(el("option", { value:c.hex, text:c.name }));
  });
  var isPreset = COLOR_PRESETS.some(function(c){ return c.hex.toLowerCase() === (pageState.headerColor||"").toLowerCase(); });
  if(!isPreset){
    sel.appendChild(el("option", { value:pageState.headerColor, text:"Custom" }));
  }
  sel.value = pageState.headerColor;
  sel.addEventListener("change", function(){ pageState.headerColor = sel.value; renderViewer(); });
  wrap.appendChild(sel);

  var customBtn = el("button", { type:"button", text:"RGB..." });
  wrap.appendChild(customBtn);

  /* one "Apply" action reads all three fields at once -- applying on each
     individual field's change would trigger a full re-render (this app
     rebuilds page DOM on every state change) that collapses this box
     before the other two fields could be set */
  var rgbBox = el("div", { style:"display:none; gap:2px;" });
  var startColor = isPreset ? { r:0,g:0,b:0 } : hexToRgb(pageState.headerColor);
  var inputs = ["R","G","B"].map(function(ch, idx){
    var input = document.createElement("input");
    input.type = "number"; input.min = "0"; input.max = "255";
    input.style.width = "36px";
    input.value = [startColor.r, startColor.g, startColor.b][idx];
    rgbBox.appendChild(input);
    return input;
  });
  var applyBtn = el("button", { type:"button", text:"Apply" });
  applyBtn.addEventListener("click", function(){
    var vals = inputs.map(function(inp){ return Math.max(0, Math.min(255, parseInt(inp.value,10)||0)); });
    var hex = "#" + vals.map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
    pageState.headerColor = hex;
    renderViewer();
  });
  rgbBox.appendChild(applyBtn);
  customBtn.addEventListener("click", function(){
    rgbBox.style.display = rgbBox.style.display === "none" ? "flex" : "none";
  });
  wrap.appendChild(rgbBox);
  return wrap;
}
function hexToRgb(hex){
  hex = (hex||"#000000").replace("#","");
  return { r:parseInt(hex.slice(0,2),16)||0, g:parseInt(hex.slice(2,4),16)||0, b:parseInt(hex.slice(4,6),16)||0 };
}

function buildPageControls(index){
  var box = el("div", { class:"pageControls" });
  var pageState = state.pages[index];
  if(!pageState) return box; /* no data yet -- nothing to configure */

  box.appendChild(pageLayoutOptionsSelect(pageState.layout, function(newKey){
    var oldLayout = pageState.layout;
    /* "empty" just hides this page's contacts rather than cascading them
       away like a real capacity shrink would -- they're remembered on the
       page itself (savedContacts) and restored if you switch back to a
       content layout, until a fresh import replaces state.pages outright */
    if(newKey === "empty" && oldLayout !== "empty"){
      pageState.savedContacts = pageState.contacts;
      pageState.contacts = [];
    } else if(newKey !== "empty" && oldLayout === "empty"){
      pageState.contacts = pageState.savedContacts || [];
      pageState.savedContacts = null;
    }
    pageState.layout = newKey;
    if(newKey === "empty" && !pageState.emptyMode) pageState.emptyMode = "blank";
    reflowFromPage(index);
    renderViewer();
  }));

  if(pageState.layout !== "empty"){
    box.appendChild(buildHeaderColorControls(pageState));
  }

  if(pageState.layout === "empty"){
    var modeSel = document.createElement("select");
    [["blank","Blank"],["rows","Empty grid"],["image","Custom image"]].forEach(function(opt){
      modeSel.appendChild(el("option", { value:opt[0], text:opt[1] }));
    });
    modeSel.value = pageState.emptyMode;
    modeSel.addEventListener("change", function(){ pageState.emptyMode = modeSel.value; renderViewer(); });
    box.appendChild(modeSel);

    if(pageState.emptyMode === "image"){
      var fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.addEventListener("change", function(){
        var f = fileInput.files[0];
        if(!f) return;
        var reader = new FileReader();
        reader.onload = function(){
          var img = new Image();
          img.onload = function(){ pageState.image = img; renderViewer(); };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      });
      box.appendChild(fileInput);
    }
  }
  return box;
}

/* ================= click-to-edit ================= */
/* every editable field's box within ONE card, relative to that card's own
   top-left corner -- shared by both drawing (implicitly, via the same
   column-layout functions) and click hit-testing */
function getEditableRegions(ctx, wPx, hPx, dpi, layout){
  var regions = [];
  var headerH = hPx * 0.1;
  var bodyY = headerH, bodyH = hPx - headerH;
  var capacity = layoutRows(layout.key);
  if(layout.phoneRowLegend){
    /* page-level field (contactIndex:-1), not tied to any one contact */
    regions.push({ contactIndex:-1, field:"headerLegend", x:wPx*0.5, y:0, w:wPx*0.5, h:headerH });
  }
  if(layout.doubleRow){
    var subRowH = bodyH / (capacity*2);
    var colSet = layoutDoubleRowColumns(ctx, wPx, dpi);
    var fieldsLine1 = ["name","label1","phone"];
    var fieldsLine2 = ["email","phone2"];
    for(var i=0;i<capacity;i++){
      var top1 = bodyY + subRowH*2*i, top2 = top1 + subRowH;
      colSet.line1.forEach(function(col, ci){ regions.push({ contactIndex:i, field:fieldsLine1[ci], x:col.x, y:top1, w:col.w, h:subRowH }); });
      colSet.line2.forEach(function(col, ci){ regions.push({ contactIndex:i, field:fieldsLine2[ci], x:col.x, y:top2, w:col.w, h:subRowH }); });
    }
  } else {
    var rowH = bodyH / capacity;
    var cols2 = layoutRowColumns(ctx, wPx, dpi, layout);
    for(var j=0;j<capacity;j++){
      var top = bodyY + rowH*j;
      cols2.forEach(function(col){ regions.push({ contactIndex:j, field:col.key, x:col.x, y:top, w:col.w, h:rowH }); });
    }
  }
  return regions;
}

function openEditOverlay(pageEl, target, field, left, top, width, height, initialValue){
  var existing = pageEl.querySelector(".editOverlayInput");
  if(existing) existing.remove();
  var input = document.createElement("input");
  input.className = "editOverlayInput";
  input.type = "text";
  input.value = initialValue != null ? initialValue : (target[field] || "");
  input.style.position = "absolute";
  input.style.left = left + "px";
  input.style.top = top + "px";
  input.style.width = Math.max(width, 50) + "px";
  input.style.height = Math.max(height, 16) + "px";
  input.style.font = "12px monospace";
  input.style.zIndex = "10";
  input.style.border = "2px solid #0080ff";
  input.style.padding = "0 2px";
  input.style.boxSizing = "border-box";
  var committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    target[field] = input.value.trim();
    input.remove();
    renderViewer();
  }
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
    else if(e.key === "Escape"){ e.preventDefault(); committed = true; input.remove(); }
  });
  pageEl.appendChild(input);
  input.focus();
  input.select();
}

function onCanvasClick(e, canvas, pageIndex){
  var pageState = state.pages[pageIndex];
  if(!pageState || pageState.layout === "empty") return;
  var geo = pageGeometryForIndex(pageIndex);
  if(geo.grid.count <= 0) return;

  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  var pxX = (e.clientX - rect.left) * scaleX, pxY = (e.clientY - rect.top) * scaleY;

  var blockWmm = geo.grid.cols * geo.cardDims.w, blockHmm = geo.grid.rows * geo.cardDims.h;
  var startXmm = (geo.pageDims.w - blockWmm) / 2, startYmm = (geo.pageDims.h - blockHmm) / 2;
  var blockXpx = mmToPx(startXmm, RENDER_DPI), blockYpx = mmToPx(startYmm, RENDER_DPI);
  var cardWpx = mmToPx(geo.cardDims.w, RENDER_DPI), cardHpx = mmToPx(geo.cardDims.h, RENDER_DPI);

  var xInBlock = pxX - blockXpx, yInBlock = pxY - blockYpx;
  var cardCol = Math.floor(xInBlock / cardWpx), cardRow = Math.floor(yInBlock / cardHpx);
  if(xInBlock < 0 || yInBlock < 0 || cardCol >= geo.grid.cols || cardRow >= geo.grid.rows) return;
  var xInCard = xInBlock - cardCol*cardWpx, yInCard = yInBlock - cardRow*cardHpx;

  var ctx = canvas.getContext("2d");
  var regions = getEditableRegions(ctx, cardWpx, cardHpx, RENDER_DPI, geo.layout);
  var hit = regions.find(function(r){ return xInCard>=r.x && xInCard<r.x+r.w && yInCard>=r.y && yInCard<r.y+r.h; });
  if(!hit) return;

  var target, initialValue;
  if(hit.contactIndex === -1){
    /* page-level field (e.g. the header legend), not tied to a contact */
    target = pageState;
    initialValue = pageState.headerLegend != null ? pageState.headerLegend : (geo.layout.phoneRowLegend || "");
  } else {
    target = pageState.contacts[hit.contactIndex];
    if(!target) return;
    initialValue = null;
  }

  var absXpx = blockXpx + cardCol*cardWpx + hit.x;
  var absYpx = blockYpx + cardRow*cardHpx + hit.y;
  var cssScale = rect.width / canvas.width;
  openEditOverlay(canvas.parentElement, target, hit.field,
    absXpx*cssScale, absYpx*cssScale, hit.w*cssScale, hit.h*cssScale, initialValue);
}

function buildPageEl(index){
  var page = el("div", { class:"page", "data-index":String(index) });
  page.appendChild(el("span", { class:"pageLabel", text:"Page " + (index+1) + " / " + totalPagesCount() }));
  page.appendChild(buildPageControls(index));
  var canvas = document.createElement("canvas");
  canvas.addEventListener("click", function(e){ onCanvasClick(e, canvas, index); });
  page.appendChild(canvas);
  renderCardsOntoCanvas(canvas, index);
  return page;
}

function currentPageDims(index){
  return pageGeometryForIndex(index).pageDims;
}

function fitSinglePage(pageEl, index){
  var wrap = $("#viewerWrap");
  var dims = currentPageDims(index);
  var cw = wrap.clientWidth * 0.92;
  var ch = wrap.clientHeight * 0.92;
  var scale = Math.min(cw/dims.w, ch/dims.h);
  pageEl.style.width = (dims.w*scale) + "px";
  pageEl.style.height = (dims.h*scale) + "px";
}

var observer = null;
function setupObserver(){
  if(observer) observer.disconnect();
  var wrap = $("#viewerWrap");
  var ratios = {};
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var idx = parseInt(entry.target.getAttribute("data-index"), 10);
      ratios[idx] = entry.isIntersecting ? entry.intersectionRatio : 0;
    });
    var bestIdx = state.currentPage, bestRatio = -1;
    Object.keys(ratios).forEach(function(k){
      if(ratios[k] > bestRatio){ bestRatio = ratios[k]; bestIdx = parseInt(k,10); }
    });
    if(bestRatio > 0){ state.currentPage = bestIdx; updateIndicator(); }
  }, { root: wrap, threshold: [0, 0.25, 0.5, 0.75, 1] });
}

function renderViewer(){
  var wrap = $("#viewerWrap");
  wrap.className = state.viewMode === "single" ? "mode-single" : "mode-all";
  wrap.innerHTML = "";

  var total = totalPagesCount();
  if(state.currentPage > total-1) state.currentPage = total-1;
  if(state.currentPage < 0) state.currentPage = 0;

  if(state.viewMode === "single"){
    var page = buildPageEl(state.currentPage);
    var dims = currentPageDims(state.currentPage);
    page.style.setProperty("--ratio", dims.w + " / " + dims.h);
    wrap.appendChild(page);
    fitSinglePage(page, state.currentPage);
  } else {
    var container = el("div", { class:"pagesAll" });
    for(var i=0;i<total;i++){
      var p = buildPageEl(i);
      var d = currentPageDims(i);
      p.style.setProperty("--ratio", d.w + " / " + d.h);
      container.appendChild(p);
    }
    wrap.appendChild(container);
    setupObserver();
    container.querySelectorAll(".page").forEach(function(p){ observer.observe(p); });
  }
  updateIndicator();
  updateGridInfo();
  renderGroupPanel();
}

function updateIndicator(){
  $("#pageIndicator").textContent = "Page " + (state.currentPage+1) + " / " + totalPagesCount();
}
function updateGridInfo(){
  var geo = pageGeometryForIndex(state.currentPage);
  if(geo.layout.key === "empty"){
    $("#gridInfo").textContent = "Empty page (" + geo.pageDims.name + ")";
  } else {
    $("#gridInfo").textContent = geo.grid.cols+" x "+geo.grid.rows+" = "+geo.grid.count+" cards ("+geo.layout.label+", "+geo.pageDims.name+")";
  }
}

function renderToolbar(){
  $("#cardOrientationBtn").textContent = "New pages: " + (state.cardOrientation === "vertical" ? "Vertical" : "Horizontal");
  $("#viewModeBtn").textContent = state.viewMode === "single" ? "View: Single" : "View: All";
  $("#cardWmm").value = state.cardWmm;
  $("#cardHmm").value = state.cardHmm;
  $("#marginMm").value = state.marginMm;
}

function scrollToPage(idx){
  var total = totalPagesCount();
  idx = Math.max(0, Math.min(total-1, idx));
  if(state.viewMode === "single"){
    state.currentPage = idx;
    renderViewer();
  } else {
    state.currentPage = idx;
    var target = $("#viewerWrap").querySelector('.page[data-index="'+idx+'"]');
    if(target) target.scrollIntoView({ behavior:"smooth", block:"start" });
    updateIndicator();
  }
}
function goPrev(){ scrollToPage(state.currentPage - 1); }
function goNext(){ scrollToPage(state.currentPage + 1); }

/* ================= print ================= */
/* CSS @page can only declare one physical size for the whole print job,
   so mixed page orientations/sizes across pages print using the first
   page's size -- a real limitation of print CSS, not something this app
   can route around. Each canvas still gets its own correct mm CSS size. */
function doPrint(){
  var total = totalPagesCount();
  var firstDims = currentPageDims(0);
  $("#pageSizeStyle").textContent = "@page { size: " + firstDims.w + "mm " + firstDims.h + "mm; margin: 0; }";
  var area = $("#printArea");
  area.innerHTML = "";
  for(var i=0;i<total;i++){
    var dims = currentPageDims(i);
    var canvas = document.createElement("canvas");
    canvas.style.width = dims.w + "mm";
    canvas.style.height = dims.h + "mm";
    renderCardsOntoCanvas(canvas, i);
    area.appendChild(canvas);
  }
  window.print();
}

var wheelCooldown = false;
function onWheel(e){
  if(state.viewMode !== "single") return;
  e.preventDefault();
  if(wheelCooldown) return;
  if(e.deltaY > 15) { wheelCooldown = true; goNext(); }
  else if(e.deltaY < -15) { wheelCooldown = true; goPrev(); }
  else return;
  setTimeout(function(){ wheelCooldown = false; }, 350);
}

/* ================= init ================= */
function populatePaperSizes(){
  var sel = $("#paperSize");
  sel.innerHTML = "";
  Object.keys(PAPER_SIZES).forEach(function(key){
    sel.appendChild(el("option", { value:key, text:PAPER_SIZES[key].label }));
  });
  sel.value = state.paperSize;
}

function initEvents(){
  $("#paperSize").addEventListener("change", function(){ state.paperSize = $("#paperSize").value; renderViewer(); });
  $("#cardOrientationBtn").addEventListener("click", function(){
    /* only affects the default layout used for newly-generated pages on
       the next file drop -- existing pages keep whatever layout they have */
    state.cardOrientation = state.cardOrientation === "vertical" ? "horizontal" : "vertical";
    renderToolbar();
  });
  $("#viewModeBtn").addEventListener("click", function(){
    state.viewMode = state.viewMode === "single" ? "all" : "single";
    renderToolbar(); renderViewer();
  });
  $("#cardWmm").addEventListener("change", function(){
    var v = parseFloat($("#cardWmm").value);
    if(v>0) state.cardWmm = v;
    renderViewer();
  });
  $("#cardHmm").addEventListener("change", function(){
    var v = parseFloat($("#cardHmm").value);
    if(v>0) state.cardHmm = v;
    renderViewer();
  });
  $("#marginMm").addEventListener("change", function(){
    var v = parseFloat($("#marginMm").value);
    if(v>=0) state.marginMm = v;
    renderViewer();
  });
  $("#prevBtn").addEventListener("click", goPrev);
  $("#nextBtn").addEventListener("click", goNext);
  $("#printBtn").addEventListener("click", doPrint);
  $("#viewerWrap").addEventListener("wheel", onWheel, { passive:false });
  window.addEventListener("resize", function(){
    if(state.viewMode === "single"){
      var page = $("#viewerWrap .page");
      if(page) fitSinglePage(page, state.currentPage);
    }
  });
  setupDropZone();
}

/* ===================== DEBUG PANEL (temporary) =====================
   Exposes the module-level tuning constants as live inputs. Reads/writes
   the same vars the renderer already uses, so deleting this whole
   function (+ its call below, + the <aside id="debugPanel"> element and
   its CSS block) fully removes the feature -- nothing else depends on it. */
function initDebugPanel(){
  var panel = $("#debugPanel");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Debug settings" }));

  var settings = [
    { label:"Header font (pt)", get:function(){ return HEADER_FONT_PT; }, set:function(v){ HEADER_FONT_PT=v; } },
    { label:"Name font (pt)",   get:function(){ return NAME_FONT_PT; },   set:function(v){ NAME_FONT_PT=v; } },
    { label:"Email font (pt)",  get:function(){ return EMAIL_FONT_PT; },  set:function(v){ EMAIL_FONT_PT=v; } },
    { label:"Phone font (pt)",  get:function(){ return PHONE_FONT_PT; },  set:function(v){ PHONE_FONT_PT=v; } },
    { label:"Dept font (pt)",   get:function(){ return DEPT_FONT_PT; },   set:function(v){ DEPT_FONT_PT=v; } },
    { label:"Dept max chars",   get:function(){ return DEPT_MAX_CHARS; }, set:function(v){ DEPT_MAX_CHARS=v; } },
    { label:"Label max chars",  get:function(){ return LABEL_MAX_CHARS; }, set:function(v){ LABEL_MAX_CHARS=v; } },
    { label:"Rows: 20-row vert.", get:function(){ return ROWS_V20; }, set:function(v){ ROWS_V20=v; } },
    { label:"Rows: 10-row vert.", get:function(){ return ROWS_V10; }, set:function(v){ ROWS_V10=v; } },
    { label:"Rows: 2-num horiz.", get:function(){ return ROWS_H2; },  set:function(v){ ROWS_H2=v; } }
  ];

  settings.forEach(function(s){
    var row = el("div", { class:"row" });
    row.appendChild(el("label", { text:s.label }));
    var input = document.createElement("input");
    input.type = "number";
    input.step = "0.5";
    input.value = s.get();
    input.addEventListener("change", function(){
      var v = parseFloat(input.value);
      if(!isNaN(v) && v > 0){ s.set(v); renderViewer(); }
    });
    row.appendChild(input);
    panel.appendChild(row);
  });
}
/* ===================== END DEBUG PANEL ===================== */

populatePaperSizes();
renderToolbar();
initEvents();
initDebugPanel();
renderViewer();

})();
</script>
