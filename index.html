  var dims = pageGeometryForIndex(frontIndex).cardDims;
  var gapPx = 24;
  var cw = (wrap.clientWidth * 0.92 - gapPx) / 2;
  var ch = wrap.clientHeight * 0.92;
  var scale = Math.min(cw/dims.w, ch/dims.h);
  pairEl.querySelectorAll(".page").forEach(function(p){
    p.style.width = (dims.w*scale) + "px";
    p.style.height = (dims.h*scale) + "px";
  });
}

var observer = null;
function setupObserver(){
  if(observer) observer.disconnect();
  var wrap = $("#viewerContent");
  var ratios = {};
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var idx = parseInt(entry.target.getAttribute("data-index"), 10);
      ratios[idx] = entry.isIntersecting ? entry.intersectionRatio : 0;
    });
    var bestIdx = state.currentPage, bestRatio = -1;
    Object.keys(ratios).forEach(function(k){
      if(ratios[k] > bestRatio){ bestRatio = ratios[k]; bestIdx = parseInt(k,10); }
    });
    if(bestRatio > 0){ state.currentPage = bestIdx; updateIndicator(); }
  }, { root: wrap, threshold: [0, 0.25, 0.5, 0.75, 1] });
}

function renderViewer(){
  $("#viewerWrap").className = state.viewMode === "single" ? "mode-single" : "mode-all";
  var wrap = $("#viewerContent");
  wrap.innerHTML = "";

  /* nothing to show a card for yet -- one overlay message covering the
     whole viewer, instead of the same text repeated on an empty front
     and an empty back card */
  var overlay = $("#emptyViewerOverlay");
  if(!state.pages.length){
    overlay.textContent = state.contacts.length
      ? "Dra en avdelningsgrupp eller kontakt från panelen till vänster för att skapa en sida"
      : "Släpp en CSV- eller XLSX-fil för att börja";
    overlay.hidden = false;
    updateIndicator();
    updateGridInfo();
    renderGroupPanel();
    return;
  }
  overlay.hidden = true;

  var total = totalPagesCount();
  /* currentPage always names the FRONT of the pair being shown -- pages
     are always printed in pairs (see partnerPageIndex), so the viewer
     only ever shows/steps through whole pairs, never a lone half */
  if(state.currentPage % 2 !== 0) state.currentPage -= 1;
  if(state.currentPage > total-2) state.currentPage = Math.max(0, total-2);
  if(state.currentPage < 0) state.currentPage = 0;

  if(state.viewMode === "single"){
    var pair = buildPagePairEl(state.currentPage);
    wrap.appendChild(pair);
    fitPagePair(pair, state.currentPage);
  } else {
    var container = el("div", { class:"pagesAll" });
    for(var i=0;i<total;i+=2){
      container.appendChild(buildPagePairEl(i));
    }
    wrap.appendChild(container);
    setupObserver();
    container.querySelectorAll(".pagePair").forEach(function(p){ observer.observe(p); });
  }
  updateIndicator();
  updateGridInfo();
  renderGroupPanel();
}

function updateIndicator(){
  var total = totalPagesCount();
  $("#pageIndicator").textContent = "Kort " + (state.currentPage/2+1) + " / " + Math.ceil(total/2);
}
function updateGridInfo(){
  var geo = pageGeometryForIndex(state.currentPage);
  if(geo.layout.key === "empty"){
    $("#gridInfo").textContent = "Tom sida (" + geo.pageDims.name + ")";
  } else {
    $("#gridInfo").textContent = geo.grid.cols+" x "+geo.grid.rows+" = "+geo.grid.count+" kort ("+geo.layout.label+", "+geo.pageDims.name+")";
  }
}

function renderToolbar(){
  $("#viewModeBtn").textContent = state.viewMode === "single" ? "Vy: Enkel" : "Vy: Alla";
}

/* idx names the front of the pair to jump to -- always even */
function scrollToPage(idx){
  var total = totalPagesCount();
  idx = Math.max(0, Math.min(total-2, idx));
  if(state.viewMode === "single"){
    state.currentPage = idx;
    renderViewer();
  } else {
    state.currentPage = idx;
    var target = $("#viewerWrap").querySelector('.pagePair[data-index="'+idx+'"]');
    if(target) target.scrollIntoView({ behavior:"smooth", block:"start" });
    updateIndicator();
  }
}
function goPrev(){ scrollToPage(state.currentPage - 2); }
function goNext(){ scrollToPage(state.currentPage + 2); }

var wheelCooldown = false;
function onWheel(e){
  if(state.viewMode !== "single") return;
  e.preventDefault();
  if(wheelCooldown) return;
  if(e.deltaY > 15) { wheelCooldown = true; goNext(); }
  else if(e.deltaY < -15) { wheelCooldown = true; goPrev(); }
  else return;
  setTimeout(function(){ wheelCooldown = false; }, 350);
}

function populatePaperSizes(){
  var sel = $("#paperSize");
  sel.innerHTML = "";
  Object.keys(PAPER_SIZES).forEach(function(key){
    sel.appendChild(el("option", { value:key, text:PAPER_SIZES[key].label }));
  });
  sel.value = state.paperSize;
}

function initEvents(){
  $("#paperSize").addEventListener("change", function(){ state.paperSize = $("#paperSize").value; renderViewer(); });
  $("#viewModeBtn").addEventListener("click", function(){
    state.viewMode = state.viewMode === "single" ? "all" : "single";
    renderToolbar(); renderViewer();
  });
  $("#prevBtn").addEventListener("click", goPrev);
  $("#nextBtn").addEventListener("click", goNext);
  $("#printBtn").addEventListener("click", doPrint);
  /* Ctrl+P (Cmd+P on Mac) must go through doPrint() too, not the browser's
     own print of whatever's on screen -- the visible viewer is a live
     editor (one card at a time, edit overlays, etc), not the print layout;
     only #printArea (built by doPrint) is meant to ever hit the printer. */
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && (e.key === "p" || e.key === "P")){
      e.preventDefault();
      doPrint();
    }
  });
  $("#viewerWrap").addEventListener("wheel", onWheel, { passive:false });
  window.addEventListener("resize", function(){
    if(state.viewMode === "single"){
      var pair = $("#viewerWrap .pagePair");
      if(pair) fitPagePair(pair, state.currentPage);
    }
  });
  setupDropZone();
}

/* ---------------- department grouping sidebar ---------------- */
/* buckets any contact list by department -- used both for the full roster
   (state.contacts) and for a single page's own contacts, which aren't
   guaranteed to stay contiguous by department once groups are moved
   between pages by hand. Groups appear in first-seen order. */
function groupContactsByDepartment(contacts){
  var byKey = new Map();
  var order = [];
  contacts.forEach(function(c){
    var key = deptGroupKey(c.department);
    if(!byKey.has(key)){
      byKey.set(key, { key:key, label:deptDisplayLabel(c.department), contacts:[] });
      order.push(key);
    }
    byKey.get(key).contacts.push(c);
  });
  return order.map(function(k){ return byKey.get(k); });
}
function computeDepartmentGroups(){ return groupContactsByDepartment(state.contacts); }

/* which 1-indexed page(s) currently show at least one of this group's
   contacts -- contact objects are shared by reference all the way from
   state.contacts through to each page's contacts array (nothing clones
   them), so a plain reference check is enough. A page whose contacts are
   hidden in savedContacts (because it's currently set to "empty") doesn't
   count -- those contacts aren't actually on that page right now. Lets the
   sidebar warn against adding a group somewhere it (partly) already is. */
function pageNumbersForGroup(group){
  var contactSet = new Set(group.contacts);
  var nums = [];
  state.pages.forEach(function(p, i){
    if(p.contacts.some(function(c){ return contactSet.has(c); })) nums.push(i+1);
  });
  return nums;
}

/* appends a whole department group onto the given 1-indexed page, creating
   pages up to that index if needed, then reuses the existing overflow
   cascade (reflowFromPage) so nothing is ever dropped if it doesn't fit --
   the same guarantee a manual layout-capacity change already gets. */
/* ensures state.pages[index] exists and is a real content page (creating
   blank pages up to it, and waking it up from "empty" if needed), ready to
   receive contacts. Shared by moveGroupBetweenPages and moveGroupToNewPage. */
function activateContentPage(index){
  while(state.pages.length <= index){
    state.pages.push(blankPage(DEFAULT_LAYOUT));
  }
  var target = state.pages[index];
  if(target.layout === "empty"){
    target.layout = DEFAULT_LAYOUT;
    target.savedContacts = null;
  }
  return target;
}

/* ---- shared drag/drop placement engine for both a whole department group
   and a single contact -- the two used to be fully separate (but identical)
   function families; unified here behind a match-predicate since the only
   real difference was "match by deptGroupKey" vs "match by id". ---- */

/* removes and returns every contact matching `matches` from one page's
   contacts -- never touches state.contacts itself, so a contact is only
   ever "unassigned from this page", not deleted. */
function takeMatchingOffPage(pageIndex, matches){
  var page = state.pages[pageIndex];
  if(!page) return [];
  var taken = page.contacts.filter(matches);
  if(taken.length) page.contacts = page.contacts.filter(function(c){ return !matches(c); });
  return taken;
}
/* same, but only across pages whose layout is `layoutKey` -- lets a
   consolidation stay within one layout family without disturbing
   placements on a different layout (see takeMatching). Omit layoutKey to
   sweep every page regardless of layout (the delete-zone's "unplace this
   from everywhere" case, in removeMatchingFromPage below). */
function takeMatchingOffAllPages(matches, layoutKey){
  var taken = [];
  state.pages.forEach(function(p, i){
    if(layoutKey == null || p.layout === layoutKey) taken = taken.concat(takeMatchingOffPage(i, matches));
  });
  return taken;
}
/* the unplaced pool (department tiles, expanded contact rows) is draggable
   too, and isn't tied to any one page -- its drags carry fromPage:null.
   Dragging an actual page's chip (fromPage a real index) always just moves
   that one page's portion, as before, regardless of layout.

   Pool drags depend on the destination layout: v20 is the one general-
   purpose directory, so it consolidates -- a contact never ends up on two
   v20 pages at once, though placements on non-v20 pages are left alone.
   v10 pages are each their own group-specific sheet (with info, like
   private numbers, meant only for that group), so a v10 destination never
   takes a contact off anywhere -- the same person can legitimately sit on
   several different v10 sheets, and on a v20 page, at once. */
function takeMatching(fromPage, matches, destLayoutKey){
  if(fromPage == null){
    if(destLayoutKey !== "v20"){
      return state.contacts.filter(matches);
    }
    /* a contact placed on more than one v20 page gets extracted once per
       page it was on, so fromPages can contain the same reference more
       than once -- the Set both tracks what's already accounted for AND,
       converted back to an array, dedupes the final result so
       consolidating never doubles someone up on the one destination page */
    var fromPages = takeMatchingOffAllPages(matches, "v20");
    var alreadyTaken = new Set(fromPages);
    var stillUnplaced = state.contacts.filter(function(c){ return matches(c) && !alreadyTaken.has(c); });
    return Array.from(alreadyTaken).concat(stillUnplaced);
  }
  return takeMatchingOffPage(fromPage, matches);
}

/* moves every matching contact from one page (or the unplaced pool,
   fromPage:null) to another page -- used by the drag-and-drop page-slot
   UI. The destination cascades overflow forward exactly like every other
   placement path. */
function moveMatchingBetweenPages(fromPage, toIndex, matches){
  if(fromPage != null && fromPage === toIndex) return;
  var toPage = activateContentPage(toIndex);
  var moving = takeMatching(fromPage, matches, toPage.layout);
  if(!moving.length) return;
  toPage.contacts = toPage.contacts.concat(moving);
  reflowFromPage(toIndex);
  renderViewer();
}
/* drop target: sends every matching contact to a freshly appended page of
   its own, cascading overflow forward from there like any other placement.
   A brand-new page always starts as DEFAULT_LAYOUT, so that's the
   consolidation scope regardless of what it might get switched to later. */
function moveMatchingToNewPage(fromPage, matches){
  var moving = takeMatching(fromPage, matches, DEFAULT_LAYOUT);
  if(!moving.length) return;
  var newIndex = state.pages.length;
  state.pages.push(blankPage(DEFAULT_LAYOUT, moving));
  reflowFromPage(newIndex);
  if(state.pages.length % 2 !== 0) state.pages.push(emptyFillerPage());
  renderViewer();
}
/* drop target: takes every matching contact off the page it's on (or,
   dragged from the unplaced pool, off every page it's on) and puts it
   nowhere else -- e.g. dragging IT off page 3 without clearing the rest of
   that page. Contacts are never deleted (still in state.contacts): they
   just go back to being unplaced, ready to be dragged somewhere else later. */
function removeMatchingFromPage(fromPage, matches){
  var taken = fromPage == null ? takeMatchingOffAllPages(matches) : takeMatchingOffPage(fromPage, matches);
  if(!taken.length) return;
  renderViewer();
}

function groupMatcher(groupKey){ return function(c){ return deptGroupKey(c.department) === groupKey; }; }
function contactMatcher(contactId){ return function(c){ return c.id === contactId; }; }

function moveGroupBetweenPages(fromPage, toIndex, groupKey){ moveMatchingBetweenPages(fromPage, toIndex, groupMatcher(groupKey)); }
function moveGroupToNewPage(fromPage, groupKey){ moveMatchingToNewPage(fromPage, groupMatcher(groupKey)); }
function removeGroupFromPage(fromPage, groupKey){ removeMatchingFromPage(fromPage, groupMatcher(groupKey)); }

function moveContactBetweenPages(fromPage, toIndex, contactId){ moveMatchingBetweenPages(fromPage, toIndex, contactMatcher(contactId)); }
function moveContactToNewPage(fromPage, contactId){ moveMatchingToNewPage(fromPage, contactMatcher(contactId)); }
function removeContactFromPage(fromPage, contactId){ removeMatchingFromPage(fromPage, contactMatcher(contactId)); }

/* removes a page outright. Its contacts are never deleted -- they're still
   in state.contacts, same as any other unplaced group/contact -- they just
   go back to being unassigned, ready to be dragged onto a different page
   from the pool. (An earlier version reinserted a fresh page with the same
   contacts at the same spot instead, which "rescued" the data but made
   Remove look like it did nothing whenever the page had content -- the
   page count never actually dropped.)

   Deliberately does NOT re-pad to an even count the way page-creating
   actions do: this is an explicit "I want fewer pages" action, and
   re-padding fought that intent outright once nothing was left to
   rescue -- removing an already-empty trailing page would immediately
   get replaced by a fresh empty filler, so the count could never drop
   below whatever it happened to pad up to, and Remove looked like it did
   nothing at all. An odd final page count is fine: pageGeometryForIndex's
   partner lookup already tolerates a page with no pair. */
function removePage(index){
  var page = state.pages[index];
  if(!page) return;
  state.pages.splice(index, 1);
  renderViewer();
}

/* custom MIME type carrying {type:"group"|"contact", fromPage, groupKey|contactId}
   for the group panel's own internal drag-and-drop -- never "Files", so
   isFileDrag() never mistakes it for a real file drop */
var PANEL_DRAG_MIME = "application/x-cccp-panel-item";
/* wires up dragover/dragleave/drop on any element so it accepts a group or
   contact drag, calling onDrop(data) -- shared by every drop target in the
   group panel (page cards, "New page", "Remove from page") */
function wireDropTarget(target, onDrop){
  target.addEventListener("dragover", function(e){
    if(e.dataTransfer.types.indexOf(PANEL_DRAG_MIME) === -1) return;
    e.preventDefault();
    target.classList.add("dragOver");
  });
  target.addEventListener("dragleave", function(){ target.classList.remove("dragOver"); });
  target.addEventListener("drop", function(e){
    e.preventDefault();
    target.classList.remove("dragOver");
    var raw = e.dataTransfer.getData(PANEL_DRAG_MIME);
    if(!raw) return;
    onDrop(JSON.parse(raw));
  });
}
/* dispatches a drop payload to the matching group/contact operation --
   shared by every drop target so they don't each need their own type check */
function handlePanelDrop(data, onGroup, onContact){
  if(data.type === "contact") onContact(data.fromPage, data.contactId);
  else onGroup(data.fromPage, data.groupKey);
}
/* starts a panel drag carrying `payload` (a {type, fromPage, ...} object
   matching handlePanelDrop's expectations) -- shared by every draggable
   pool tile/chip, which otherwise all repeat the same setData+effectAllowed
   pair with only the payload differing */
function wireDragStart(node, payload){
  node.addEventListener("dragstart", function(e){
    e.dataTransfer.setData(PANEL_DRAG_MIME, JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "move";
  });
}

/* wires `row` (one name in a v10 page's own ordered contact list) as a
   drop target for reordering that list -- dropping on the row's top
   half inserts the dragged contact before it, the bottom half after.
   `matches(data)` decides whether an incoming drag is actually a same-
   list reorder; anything else falls to `fallback` (if given) instead,
   so a normal pool/cross-page drop landing on a row still behaves
   exactly like dropping anywhere else on the page card. Handles the
   full drop itself (stopPropagation) rather than relying on it
   bubbling to the card's own drop target, since dataTransfer.getData()
   -- needed to tell reorder from everything else -- only works inside
   "drop", not "dragover", so the decision can't be made early enough
   to conditionally skip preventDefault on the row in the first place. */
function wireReorderTarget(row, matches, onReorder, fallback){
  row.addEventListener("dragover", function(e){
    if(e.dataTransfer.types.indexOf(PANEL_DRAG_MIME) === -1) return;
    e.preventDefault();
    e.stopPropagation();
    row.classList.add("dragOver");
  });
  row.addEventListener("dragleave", function(){ row.classList.remove("dragOver"); });
  row.addEventListener("drop", function(e){
    e.preventDefault();
    e.stopPropagation();
    row.classList.remove("dragOver");
    var raw = e.dataTransfer.getData(PANEL_DRAG_MIME);
    if(!raw) return;
    var data = JSON.parse(raw);
    if(matches(data)){
      var insertAfter = (e.clientY - row.getBoundingClientRect().top) > row.getBoundingClientRect().height/2;
      onReorder(data.contactId, insertAfter);
    } else if(fallback){
      fallback(data);
    }
  });
}

/* every 1-indexed page currently showing this exact contact -- normally at
   most one v20 page, but the same contact can legitimately sit on several
   v10 pages (and a v20 page) at once, since v10 never consolidates. A
   single contact is just a one-member group for this purpose, so it
   reuses pageNumbersForGroup's own reference-matching logic. */
function pageNumbersForContact(contact){
  return pageNumbersForGroup({ contacts:[contact] });
}

/* the expand/collapse triangle shown on both a pool department tile and a
   page's own department chip -- identical either way: flips the caller's
   expanded flag and re-renders, and must never itself start (or count as)
   a drag of the whole tile/chip it sits on */
function buildExpandToggle(expanded, onToggle){
  var toggle = el("span", { class:"groupTileToggle", text: expanded ? "▾" : "▸" });
  toggle.title = expanded ? "Dölj enskilda kontakter" : "Visa enskilda kontakter";
  toggle.addEventListener("dragstart", function(e){ e.preventDefault(); e.stopPropagation(); });
  toggle.addEventListener("click", function(e){ e.stopPropagation(); onToggle(); });
  return toggle;
}

/* one draggable row per contact, used both under an expanded pool tile and
   under an expanded page chip -- identical either way, since a single name
   moves through the same take/move functions a whole department does */
function buildContactList(contacts, fromPage){
  var list = el("div", { class:"contactList" });
  contacts.forEach(function(c){
    var pageNums = pageNumbersForContact(c);
    var placed = pageNums.length > 0;
    var chip = el("div", {
      class: "contactChip" + (placed ? " placed" : ""),
      draggable: "true",
      title: (placed ? ("På sid" + (pageNums.length>1 ? "orna " : "an ") + pageNums.join(", ")) : "Inte placerad än") + " -- dra till en sida, \"+ Ny sida\", eller \"" + "✕ Ta bort från sida" + "\""
    });
    chip.appendChild(el("span", { class:"contactChipName", text:c.name }));
    if(placed) chip.appendChild(el("span", { class:"contactChipPage", text:"s"+pageNums.join(",") }));
    wireDragStart(chip, { type:"contact", fromPage:fromPage, contactId:c.id });
    list.appendChild(chip);
  });
  return list;
}

/* v10's own flat, numbered, drag-to-reorder contact list -- the actual
   printed order on the card, unlike buildContactList's department-tile
   rows (a pool/placement view where order doesn't matter). A manual
   page's rows are also still draggable out to another page or the
   delete zone (payloadType "contact", reusing the normal contact drag
   machinery -- onPageDrop is the same fallback the page card itself
   drops onto); a chain page's rows only ever reorder within their own
   list (payloadType "chainReorder", no fallback -- see
   reorderWithinPage for why chain membership isn't "moved" this way). */
function buildOrderedContactList(pageIndex, contacts, payloadType, onPageDrop){
  var list = el("div", { class:"contactList" });
  contacts.forEach(function(c, idx){
    var title = "Dra för att ändra ordning" + (onPageDrop ? ", eller till en annan sida eller \"✕ Ta bort från sida\"" : "");
    var row = el("div", { class:"contactChip", draggable:"true", title:title });
    row.appendChild(el("span", { class:"contactChipName", text:(idx+1) + ". " + c.name }));
    wireDragStart(row, { type:payloadType, fromPage:pageIndex, contactId:c.id });
    wireReorderTarget(row,
      function(data){ return data.type === payloadType && data.fromPage === pageIndex; },
      function(draggedId, insertAfter){ reorderWithinPage(pageIndex, draggedId, c.id, insertAfter); },
      onPageDrop);
    list.appendChild(row);
  });
  return list;
}

function renderGroupPanel(){
  var panel = $("#groupPanelBody");
  if(!panel) return;
  panel.innerHTML = "";
  panel.appendChild(el("h2", { text:"Avdelningsgrupper" }));

  if(!state.contacts.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"Importera en CSV/XLSX för att se grupper här." }));
    return;
  }

  var clearBtn = el("button", { type:"button", text:"Rensa sidor, gruppera manuellt", style:"width:100%; margin-bottom:10px; font-size:11px; padding:4px;" });
  clearBtn.addEventListener("click", function(){
    state.pages = [];
    renderViewer();
  });
  panel.appendChild(clearBtn);

  var grid = el("div", { class:"groupGrid" });
  computeDepartmentGroups().forEach(function(g){
    var pageNums = pageNumbersForGroup(g);
    var placed = pageNums.length > 0;
    var expanded = !!state.expandedGroups[g.key];
    var tile = el("div", {
      class: "groupTile" + (placed ? " placed" : ""),
      draggable: "true",
      title: (placed ? ("På sid" + (pageNums.length>1 ? "orna " : "an ") + pageNums.join(", ")) : "Inte placerad än") + " -- dra till en sida nedan"
    });
    var nameRow = el("div", { class:"groupTileNameRow" });
    nameRow.appendChild(buildExpandToggle(expanded, function(){
      state.expandedGroups[g.key] = !expanded;
      renderGroupPanel();
    }));
    nameRow.appendChild(el("span", { class:"groupTileName", text:g.label }));
    tile.appendChild(nameRow);
    tile.appendChild(el("div", { class:"groupTileCount", text:g.contacts.length + (placed ? " · s" + pageNums.join(",") : "") }));
    /* fromPage:null marks this as a drag from the unplaced-pool grid
       (as opposed to a specific page's chip) -- see takeGroup() */
    wireDragStart(tile, { type:"group", fromPage:null, groupKey:g.key });
    grid.appendChild(tile);
    if(expanded) grid.appendChild(buildContactList(g.contacts, null));
  });
  panel.appendChild(grid);

  panel.appendChild(el("h2", { text:"Sidor", style:"margin-top:14px;" }));

  /* always rendered, even with zero pages -- "+ New page" is the only way
     to create the very first one now that placement is drag-only */
  var actionZone = el("div", { class:"pageActionZone" });
  var newPageZone = el("div", { class:"dropZone newPageZone", text:"+ Ny sida" });
  var deleteZone = el("div", { class:"dropZone deleteZone", text:"✕ Ta bort från sida" });
  wireDropTarget(newPageZone, function(data){ handlePanelDrop(data, moveGroupToNewPage, moveContactToNewPage); });
  wireDropTarget(deleteZone, function(data){ handlePanelDrop(data, removeGroupFromPage, removeContactFromPage); });
  actionZone.appendChild(newPageZone);
  actionZone.appendChild(deleteZone);
  panel.appendChild(actionZone);

  if(!state.pages.length){
    panel.appendChild(el("div", { class:"emptyNote", text:"Inga sidor än." }));
    return;
  }

  state.pages.forEach(function(p, i){
    var card = el("div", { class:"pageCard" });

    var headerRow = el("div", { class:"pageCardHeader" });
    var cap = layoutRows(p.layout), used = contactsForPage(p).length, free = Math.max(0, cap-used);
    /* the layout name itself is dropped here -- it's redundant with the
       Layout select shown right below -- so this stays short enough to
       always fit one row next to Remove; title carries the full text too,
       and text-overflow:ellipsis (see CSS) is a hard backstop regardless */
    var headerText = p.layout === "empty"
      ? "Sida " + (i+1) + ": tom"
      : "Sida " + (i+1) + ": " + used + "/" + cap + " använda, " + free + " lediga";
    headerRow.appendChild(el("span", { class: free === 0 && p.layout !== "empty" ? "full" : "", text:headerText, title:headerText }));
    var removeBtn = el("button", { type:"button", text:"Ta bort" });
    removeBtn.addEventListener("click", function(){ removePage(i); });
    headerRow.appendChild(removeBtn);
    card.appendChild(headerRow);

    card.appendChild(buildPageControls(i));

    /* shared by the card's own drop target and, for a manual v10 page,
       every row's reorder-target fallback (a normal pool/cross-page drop
       landing on a row should behave exactly like dropping anywhere else
       on the card) */
    function onPageDrop(data){
      handlePanelDrop(data,
        function(fromPage, groupKey){ moveGroupBetweenPages(fromPage, i, groupKey); },
        function(fromPage, contactId){ moveContactBetweenPages(fromPage, i, contactId); });
    }

    var chipList = el("div", { class:"pageGroupList" });
    if(p.layout === "v10" && p.chain){
      /* a chained page's contacts are computed from the chain, not the
         normal drag-and-drop group system, so the note explains what it
         resolved to; the list below is still manually reorderable
         (dragging within it), just not movable elsewhere -- see
         reorderWithinPage */
      var chainTotal = contactsForChain(p.chain).length;
      var chainNote = "Kedja \"" + p.chain + "\": " + Math.min(chainTotal, cap) + " av " + chainTotal + " visas";
      if(chainTotal > cap){
        chainNote += " -- " + (chainTotal - cap) + " till taggade \"" + p.chain + "\" får inte plats på ett kort";
      }
      chipList.appendChild(el("div", { class: chainTotal > cap ? "emptyNote full" : "emptyNote", text:chainNote }));
      var chainMembers = contactsForPage(p);
      if(chainMembers.length) chipList.appendChild(buildOrderedContactList(i, chainMembers, "chainReorder", null));
    } else if(p.layout === "v10"){
      /* a manual v10 page: order is what actually prints, so it's shown
         (and reordered) as a flat numbered list, not department chips */
      if(p.contacts.length){
        chipList.appendChild(buildOrderedContactList(i, p.contacts, "contact", onPageDrop));
      } else {
        chipList.appendChild(el("div", { class:"emptyNote", text:"Inga kontakter än" }));
      }
    } else {
      groupContactsByDepartment(p.contacts).forEach(function(g){
        var pgKey = i + ":" + g.key;
        var expandedP = !!state.expandedPageGroups[pgKey];
        var chip = el("div", { class:"pageGroupChip", draggable:"true" });
        chip.appendChild(buildExpandToggle(expandedP, function(){
          state.expandedPageGroups[pgKey] = !expandedP;
          renderGroupPanel();
        }));
        chip.appendChild(el("span", { text:g.label + " " + g.contacts.length }));
        wireDragStart(chip, { type:"group", fromPage:i, groupKey:g.key });
        chipList.appendChild(chip);
        if(expandedP) chipList.appendChild(buildContactList(g.contacts, i));
      });
      if(!chipList.children.length){
        chipList.appendChild(el("div", { class:"emptyNote", text: p.layout === "empty" ? "Släpp en grupp här för att fylla den" : "Inga kontakter än" }));
      }
    }
    card.appendChild(chipList);

    /* the whole card is a drop target -- dragging a group or contact from
       any page (including this one, a no-op) onto it moves it from the
       source page here, cascading overflow like every other placement */
    wireDropTarget(card, onPageDrop);

    panel.appendChild(card);
  });
}

populatePaperSizes();
renderToolbar();
initEvents();
renderViewer();

})();
</script>
</body>
</html>
